{{ define "head" }}
<meta property="og:title" content="The distributed inference fieldbook">
<meta property="og:description" content="An entrepreneur's field guide to Darkbloom, idle compute, cybercafés, and the next inference layer.">
<meta name="twitter:card" content="summary_large_image">
{{ end }}

{{ define "main" }}
<div class="swipe-report">
    <div class="swipe-topline">
        <a href="/">Seah Ying Cong</a>
        <span>FIELD NOTE · 04</span>
        <a href="/research/">Research</a>
    </div>
    <div class="swipe-progress" aria-hidden="true"><span></span></div>
    <article class="swipe-article">
        <div class="swipe-content">{{ .Content }}</div>
    </article>
    <div class="swipe-controls" aria-label="Slide navigation">
        <button type="button" data-swipe="prev" aria-label="Previous slide">←</button>
        <div class="swipe-dots" aria-hidden="true"></div>
        <button type="button" data-swipe="next" aria-label="Next slide">→</button>
    </div>
    <div class="swipe-endnote">Independent market investigation · 24 August 2026</div>
</div>
<script>
(function () {
  var viewport = document.querySelector('.swipe-content');
  if (!viewport) return;
  var nodes = Array.prototype.slice.call(viewport.children);
  var slides = [];
  var current = null;
  var h2Count = 0;

  nodes.forEach(function (node) {
    var isSection = node.tagName === 'H2';
    if (isSection) h2Count += 1;
    if (isSection && h2Count > 1) {
      current = document.createElement('section');
      current.className = 'story-slide';
      current.setAttribute('tabindex', '0');
      viewport.appendChild(current);
      slides.push(current);
    } else if (!current) {
      current = document.createElement('section');
      current.className = 'story-slide story-slide--cover';
      current.setAttribute('tabindex', '0');
      viewport.appendChild(current);
      slides.push(current);
    }
    current.appendChild(node);
  });

  var dots = document.querySelector('.swipe-dots');
  var progress = document.querySelector('.swipe-progress span');
  var track = document.createElement('div');
  track.className = 'swipe-track';
  slides.forEach(function (slide) { track.appendChild(slide); });
  viewport.appendChild(track);
  var activeIndex = 0;
  var drag = null;

  function stepSize() {
    return slides.length > 1 ? slides[1].offsetLeft - slides[0].offsetLeft : slides[0].offsetWidth;
  }

  function render(index, animate) {
    activeIndex = Math.max(0, Math.min(slides.length - 1, index));
    track.style.transition = animate ? 'transform 420ms cubic-bezier(.22,.8,.26,1)' : 'none';
    track.style.transform = 'translate3d(' + (-activeIndex * stepSize()) + 'px, 0, 0)';
    slides.forEach(function (slide) {
      slide.style.transition = animate ? 'transform 420ms cubic-bezier(.22,.8,.26,1)' : 'none';
      slide.style.transform = 'rotate(0deg) translate3d(0, 0, 0)';
    });
    Array.prototype.forEach.call(dots.children, function (dot, dotIndex) {
      dot.classList.toggle('is-active', dotIndex === activeIndex);
    });
    progress.style.width = ((activeIndex + 1) / slides.length * 100) + '%';
    slides.forEach(function (slide, slideIndex) {
      slide.setAttribute('aria-hidden', slideIndex === activeIndex ? 'false' : 'true');
    });
  }

  slides.forEach(function (_, index) {
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', 'Go to slide ' + (index + 1));
    dot.addEventListener('click', function () { render(index, true); });
    dots.appendChild(dot);
  });

  function go(delta) {
    render(activeIndex + delta, true);
  }
  document.querySelector('[data-swipe="prev"]').addEventListener('click', function () { go(-1); });
  document.querySelector('[data-swipe="next"]').addEventListener('click', function () { go(1); });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') go(-1);
    if (event.key === 'ArrowRight') go(1);
  });

  viewport.addEventListener('pointerdown', function (event) {
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY, lastX: event.clientX, lastTime: Date.now(), horizontal: false };
    track.style.transition = 'none';
    viewport.setPointerCapture(event.pointerId);
  });

  viewport.addEventListener('pointermove', function (event) {
    if (!drag || drag.id !== event.pointerId) return;
    var dx = event.clientX - drag.x;
    var dy = event.clientY - drag.y;
    if (!drag.horizontal && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.15) drag.horizontal = true;
    if (!drag.horizontal) return;
    event.preventDefault();
    var resistance = (activeIndex === 0 && dx > 0) || (activeIndex === slides.length - 1 && dx < 0) ? .28 : 1;
    track.style.transform = 'translate3d(' + (-activeIndex * stepSize() + dx * resistance) + 'px, 0, 0)';
    var tilt = Math.max(-12, Math.min(12, dx / viewport.clientWidth * 16));
    slides[activeIndex].style.transform = 'translate3d(0, ' + Math.min(18, Math.abs(dx) * .08) + 'px, 0) rotate(' + tilt + 'deg) scale(.985)';
    drag.lastX = event.clientX;
    drag.lastTime = Date.now();
  });

  function finishDrag(event) {
    if (!drag || drag.id !== event.pointerId) return;
    var dx = event.clientX - drag.x;
    var threshold = Math.max(96, Math.min(140, viewport.clientWidth * .28));
    if (drag.horizontal && Math.abs(dx) > threshold) {
      render(activeIndex + (dx < 0 ? 1 : -1), true);
    } else {
      render(activeIndex, true);
    }
    drag = null;
  }
  viewport.addEventListener('pointerup', finishDrag);
  viewport.addEventListener('pointercancel', finishDrag);
  viewport.addEventListener('lostpointercapture', function () { if (drag) finishDrag({ pointerId: drag.id, clientX: drag.lastX, clientY: drag.y }); });
  window.addEventListener('resize', function () { render(activeIndex, false); });
  render(0, false);
})();
</script>
{{ end }}
