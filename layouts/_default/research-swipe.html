{{ define "head" }}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Description }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="/images/fieldbook-favicon.svg">
<link rel="apple-touch-icon" href="/images/fieldbook-favicon.svg">
<meta name="theme-color" content="#d4c6b4">

{{ end }}

{{ define "main" }}
<div class="swipe-report fieldbook{{ with .Params.fieldbook.theme }} fieldbook--{{ . }}{{ end }}">
    {{ partial "fieldbook/config.html" . }}
    <a class="fieldbook-back" href="/learning/" aria-label="Back to all learning">← All learning</a>
    <article class="swipe-article">
        <div class="swipe-content">{{ .Content }}</div>
    </article>
</div>
<script>
(function () {
  document.documentElement.classList.add('research-swipe-root', 'fieldbook-continuous');
  var configNode = document.getElementById('fieldbook-config');
  var fieldbookConfig = configNode ? JSON.parse(configNode.textContent || '{}') : {};
  var illustrations = fieldbookConfig.illustrations || {};
  var frameMode = new URLSearchParams(window.location.search).get('frame');
  if (frameMode === 'full' || frameMode === 'raised') document.body.classList.add('card-frame-' + frameMode);
  var viewport = document.querySelector('.swipe-content');
  if (!viewport) return;
  var nodes = Array.prototype.slice.call(viewport.children);
  var slides = [];
  var current = null;

  function cardSlug(text, fallback) {
    var slug = String(text || '').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
    return slug || fallback;
  }

  nodes.forEach(function (node) {
    var isSection = node.tagName === 'H2';
    if (isSection) {
      current = document.createElement('section');
      current.className = 'story-slide';
      viewport.appendChild(current);
      slides.push(current);
    } else if (!current) {
      current = document.createElement('section');
      current.className = 'story-slide story-slide--cover';
      viewport.appendChild(current);
      slides.push(current);
    }
    current.appendChild(node);
  });

  slides.forEach(function (slide, index) {
    var heading = slide.querySelector('h2');
    var label = heading ? heading.textContent : (slide.querySelector('h1') ? slide.querySelector('h1').textContent : 'cover');
    slide.dataset.cardSlug = index === 0 ? 'cover' : cardSlug(label, 'card-' + (index + 1));
    slide.id = 'card-' + slide.dataset.cardSlug;
    Array.prototype.forEach.call(slide.querySelectorAll('.story-illustration'), function (image) { image.remove(); });
    var illustration = illustrations[slide.dataset.cardSlug];
    if (!illustration || !illustration.src) return;
    var image = document.createElement('img');
    image.src = illustration.src;
    image.alt = illustration.alt || '';
    image.className = 'story-illustration' + (index === 0 ? ' cover-illustration' : '');
    (heading || slide.querySelector('h1')).insertAdjacentElement('afterend', image);
  });

  var track = document.createElement('div');
  track.className = 'swipe-track';
  slides.forEach(function (slide) {
    var scroll = document.createElement('div');
    scroll.className = 'story-scroll';
    while (slide.firstChild) scroll.appendChild(slide.firstChild);
    slide.appendChild(scroll);
    Array.prototype.forEach.call(scroll.querySelectorAll('table'), function (table) {
      var headers = Array.prototype.map.call(table.querySelectorAll('thead th'), function (header) {
        return header.textContent.trim();
      });
      Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (row) {
        Array.prototype.forEach.call(row.children, function (cell, cellIndex) {
          if (headers[cellIndex]) cell.dataset.label = headers[cellIndex];
        });
      });
      var wide = document.createElement('div');
      wide.className = 'wide-object';
      table.parentNode.insertBefore(wide, table);
      wide.appendChild(table);
    });
    Array.prototype.forEach.call(scroll.querySelectorAll('img[src*="distributed-inference-"], img[src*="airbnb-ai-"]'), function (image) {
      image.classList.add('editorial-plate');
    });
    track.appendChild(slide);
  });
  viewport.appendChild(track);
  function restoreReadingPosition() {
    var slug = window.location.hash.replace(/^#/, '').replace(/^card-/, '');
    var target = slides.find(function (slide) { return slide.dataset.cardSlug === slug; });
    if (target) target.scrollIntoView({ block: 'start' });
  }
  requestAnimationFrame(restoreReadingPosition);
  window.addEventListener('hashchange', restoreReadingPosition);
})();
</script>
{{ end }}
