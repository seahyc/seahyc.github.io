{{ define "head" }}
<meta property="og:title" content="The distributed inference fieldbook">
<meta property="og:description" content="An entrepreneur's field guide to Darkbloom, idle compute, cybercafés, and the next inference layer.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
{{ end }}

{{ define "main" }}
<div class="swipe-report">
    <article class="swipe-article">
        <div class="swipe-content">{{ .Content }}</div>
    </article>
    <div class="swipe-progress" aria-hidden="true"></div>
    <div class="swipe-controls" aria-label="Slide navigation">
        <button type="button" data-swipe="prev" aria-label="Previous card">←</button>
        <button type="button" data-swipe="next" aria-label="Next card">→</button>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
(function () {
  var frameMode = new URLSearchParams(window.location.search).get('frame');
  if (frameMode === 'full' || frameMode === 'raised') document.body.classList.add('card-frame-' + frameMode);
  var viewport = document.querySelector('.swipe-content');
  if (!viewport) return;
  var nodes = Array.prototype.slice.call(viewport.children);
  var slides = [];
  var current = null;
  var h2Count = 0;

  nodes.forEach(function (node) {
    var isSection = node.tagName === 'H2';
    if (isSection) h2Count += 1;
    if (isSection && h2Count > 1) {
      current = document.createElement('section');
      current.className = 'story-slide';
      current.setAttribute('tabindex', '0');
      viewport.appendChild(current);
      slides.push(current);
    } else if (!current) {
      current = document.createElement('section');
      current.className = 'story-slide story-slide--cover';
      current.setAttribute('tabindex', '0');
      viewport.appendChild(current);
      slides.push(current);
    }
    current.appendChild(node);
  });

  // Replace the old collage plates with small, topic-specific notebook vignettes.
  slides.forEach(function (slide, index) {
    var heading = slide.querySelector('h2');
    var title = heading ? heading.textContent.toLowerCase() : '';
    Array.prototype.forEach.call(slide.querySelectorAll('img[src*="darkbloom-fieldbook"], img[src*="distributed-inference-"]'), function (image) {
      image.remove();
    });
    var illustration = null;
    if (index === 0) illustration = {
      src: '/images/distributed-inference-cover-doodle.png',
      alt: 'A small room welcoming a cloud beside a laptop'
    };
    if (title.indexOf('demand map') !== -1) illustration = {
      src: '/images/distributed-inference-demand-doodle.png',
      alt: 'Three small computers passing a parcel along a crooked path'
    };
    if (title.indexOf('supply map') !== -1) illustration = {
      src: '/images/distributed-inference-supply-doodle.png',
      alt: 'A small hand-drawn laptop carrying an oversized stack of computer boxes'
    };
    if (title.indexOf('fleet-owner') !== -1) illustration = {
      src: '/images/distributed-inference-fleet-doodle.png',
      alt: 'A cheerful fleet operator beside a row of computers'
    };
    if (title.indexOf('multi-platform') !== -1) illustration = {
      src: '/images/distributed-inference-network-doodle.png',
      alt: 'Mismatched computers connected around a shared parcel'
    };
    if (!illustration) return;
    var image = document.createElement('img');
    image.src = illustration.src;
    image.alt = illustration.alt;
    image.className = 'story-illustration';
    (heading || slide.querySelector('h1')).insertAdjacentElement('afterend', image);
  });

  var track = document.createElement('div');
  track.className = 'swipe-track swiper-wrapper';
  viewport.classList.add('swiper');
  slides.forEach(function (slide) {
    slide.classList.add('swiper-slide');
    var scroll = document.createElement('div');
    scroll.className = 'story-scroll';
    while (slide.firstChild) scroll.appendChild(slide.firstChild);
    slide.appendChild(scroll);
    Array.prototype.forEach.call(scroll.querySelectorAll('table'), function (table) {
      var wide = document.createElement('div');
      wide.className = 'wide-object';
      table.parentNode.insertBefore(wide, table);
      wide.appendChild(table);
    });
    Array.prototype.forEach.call(scroll.querySelectorAll('img[src*="distributed-inference-"]'), function (image) {
      image.classList.add('editorial-plate');
    });
    track.appendChild(slide);
  });
  viewport.appendChild(track);
  var dots = document.querySelector('.swipe-progress');
  slides.forEach(function (_, index) {
    var dot = document.createElement('button');
    dot.type = 'button';
    dot.setAttribute('aria-label', 'Go to card ' + (index + 1));
    dots.appendChild(dot);
  });
  var swiper = new Swiper(viewport, {
    effect: 'slide',
    grabCursor: true,
    threshold: 0,
    touchAngle: 28,
    touchRatio: 1.2,
    followFinger: true,
    longSwipes: true,
    longSwipesRatio: .18,
    longSwipesMs: 0,
    shortSwipes: false,
    speed: 460,
    resistance: true,
    resistanceRatio: .55,
    watchSlidesProgress: true,
    preventInteractionOnTransition: true,
    nested: false,
    touchMoveStopPropagation: false,
    noSwipingSelector: 'table, .wide-object',
    keyboard: { enabled: true, onlyInViewport: true },
    initialSlide: 0
  });
  function syncNavigation() {
    var active = swiper.activeIndex;
    slides.forEach(function (slide, index) {
      var distance = Math.abs(index - active);
      slide.style.setProperty('z-index', index === active ? '20' : String(Math.max(1, 10 - distance)), 'important');
      slide.setAttribute('aria-hidden', index === active ? 'false' : 'true');
    });
    Array.prototype.forEach.call(dots.children, function (dot, index) {
      dot.classList.toggle('is-active', index === active);
      dot.classList.toggle('is-complete', index < active);
    });
  }
  function setCardMotion(slide, progress) {
    var distance = Math.min(1.25, Math.abs(progress));
    var eased = Math.pow(distance, .72);
    // Swiper's progress sign is opposite the finger direction: a leftward
    // drag makes the current slide's progress positive, so invert it here.
    var tilt = Math.max(-10, Math.min(10, -Math.sign(progress) * eased * 10));
    slide.style.setProperty('--card-tilt', tilt.toFixed(2) + 'deg');
    slide.style.setProperty('--card-lift', (eased * -10).toFixed(2) + 'px');
    slide.style.setProperty('--card-shadow-x', (tilt * -1.1).toFixed(2) + 'px');
  }
  function applyCardTilt() {
    slides.forEach(function (slide) { setCardMotion(slide, Number(slide.progress || 0)); });
  }
  var arrowRaf = null;
  function animateArrowCards() {
    var direction = swiper.activeIndex > swiper.previousIndex ? 1 : -1;
    var outgoing = slides[swiper.previousIndex];
    var incoming = slides[swiper.activeIndex];
    var start = performance.now();
    function frame(now) {
      var t = Math.min(1, (now - start) / swiper.params.speed);
      var eased = 1 - Math.pow(1 - t, 3);
      setCardMotion(outgoing, direction * eased);
      setCardMotion(incoming, -direction * (1 - eased));
      if (t < 1) arrowRaf = requestAnimationFrame(frame);
    }
    if (arrowRaf) cancelAnimationFrame(arrowRaf);
    arrowRaf = requestAnimationFrame(frame);
  }
  swiper.on('setTranslate', applyCardTilt);
  swiper.on('slideChangeTransitionStart', animateArrowCards);
  swiper.on('transitionEnd', function () { if (arrowRaf) cancelAnimationFrame(arrowRaf); applyCardTilt(); syncNavigation(); });
  swiper.on('touchStart', function () { slides.forEach(function (slide) { slide.classList.add('is-dragging'); }); });
  swiper.on('touchEnd', function () { slides.forEach(function (slide) { slide.classList.remove('is-dragging'); }); });
  document.querySelector('[data-swipe="prev"]').addEventListener('click', function () { swiper.slidePrev(); });
  document.querySelector('[data-swipe="next"]').addEventListener('click', function () { swiper.slideNext(); });
  Array.prototype.forEach.call(dots.children, function (dot, index) {
    dot.addEventListener('click', function () { swiper.slideTo(index); });
  });
  syncNavigation();
  applyCardTilt();

  // Development-only harness: ?tilt-test=1 drives the same progress values
  // used during a live drag and exposes the resulting CSS variables.
  if (new URLSearchParams(window.location.search).has('tilt-test')) {
    var harness = document.createElement('div');
    harness.className = 'tilt-test-harness';
    harness.innerHTML = '<label>tilt test <input type="range" min="-1" max="1" step=".01" value="0"></label><output></output>';
    document.body.appendChild(harness);
    var tiltInput = harness.querySelector('input');
    var tiltOutput = harness.querySelector('output');
    function runTiltTest(value) {
      var translate = Number(value) * viewport.clientWidth;
      swiper.updateSlidesProgress(translate);
      swiper.emit('setTranslate', translate);
      var activeSlide = slides[swiper.activeIndex];
      var tilt = activeSlide.style.getPropertyValue('--card-tilt') || '0deg';
      var lift = activeSlide.style.getPropertyValue('--card-lift') || '0px';
      tiltOutput.textContent = 'progress ' + Number(value).toFixed(2) + ' · ' + tilt + ' · ' + lift;
    }
    tiltInput.addEventListener('input', function () { runTiltTest(tiltInput.value); });
    window.__fieldbookTiltTest = runTiltTest;
    runTiltTest(tiltInput.value);
  }
  slides.forEach(function (slide) {
    var scroll = slide.querySelector('.story-scroll');
    if (!scroll) return;
    scroll._cardOffset = 0;
    function cardMaxOffset() {
      var styles = getComputedStyle(scroll);
      var bottomGap = parseFloat(styles.marginBottom) || 0;
      var available = slide.clientHeight - scroll.offsetTop - bottomGap;
      return Math.max(0, scroll.offsetHeight - available);
    }
    function renderCardOffset(offset) {
      var max = cardMaxOffset();
      scroll._cardMaxOffset = max;
      scroll._cardOffset = Math.max(0, Math.min(max, offset));
      scroll.style.setProperty('--card-scroll-y', (-scroll._cardOffset).toFixed(2) + 'px');
    }
    var gesture = null;
    scroll.addEventListener('touchstart', function (event) {
      var touch = event.touches[0];
      gesture = { x: touch.clientX, y: touch.clientY, vertical: false, offset: scroll._cardOffset, edgeX: null, handedOff: false };
    }, { passive: true });
    scroll.addEventListener('touchmove', function (event) {
      if (!gesture) return;
      var touch = event.touches[0];
      var dx = touch.clientX - gesture.x;
      var dy = touch.clientY - gesture.y;
      if (!gesture.vertical && Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx) * 1.15) {
        gesture.vertical = true;
        event.stopPropagation();
        swiper.allowTouchMove = false;
      } else if (gesture.vertical) {
        event.stopPropagation();
      }
      if (gesture.vertical) {
        event.preventDefault();
        scroll.classList.add('is-vertical-dragging');
        var atBottom = scroll._cardOffset >= (scroll._cardMaxOffset || cardMaxOffset()) - 1;
        var atTop = scroll._cardOffset <= 1;
        if ((atBottom || atTop) && gesture.edgeX === null) gesture.edgeX = touch.clientX;
        var edgeDx = gesture.edgeX === null ? 0 : touch.clientX - gesture.edgeX;
        if (!gesture.handedOff && ((atBottom && edgeDx < -34) || (atTop && edgeDx > 34))) {
          gesture.handedOff = true;
          swiper.allowTouchMove = true;
          scroll.classList.remove('is-vertical-dragging');
          if (edgeDx < 0) swiper.slideNext();
          else swiper.slidePrev();
          return;
        }
        renderCardOffset(gesture.offset - dy);
      }
    }, { passive: false });
    scroll.addEventListener('touchend', function () {
      scroll.classList.remove('is-vertical-dragging');
      gesture = null;
      swiper.allowTouchMove = true;
    }, { passive: true });
    scroll.addEventListener('touchcancel', function () {
      scroll.classList.remove('is-vertical-dragging');
      gesture = null;
      swiper.allowTouchMove = true;
    }, { passive: true });
  });
  viewport.addEventListener('wheel', function (event) {
    if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
    var activeScroll = viewport.querySelector('.swiper-slide-active .story-scroll');
    if (!activeScroll) return;
    var styles = getComputedStyle(activeScroll);
    var bottomGap = parseFloat(styles.marginBottom) || 0;
    var available = activeScroll.parentElement.clientHeight - activeScroll.offsetTop - bottomGap;
    var max = Math.max(0, activeScroll.offsetHeight - available);
    if (!max) return;
    activeScroll._cardOffset = Math.max(0, Math.min(max, (activeScroll._cardOffset || 0) + event.deltaY));
    activeScroll.style.setProperty('--card-scroll-y', (-activeScroll._cardOffset).toFixed(2) + 'px');
    event.preventDefault();
  }, { passive: false });

  // Instagram-style tap zones. Interactive content keeps its native behavior.
  var tap = null;
  viewport.addEventListener('touchstart', function (event) {
    var touch = event.touches[0];
    tap = { x: touch.clientX, y: touch.clientY, moved: false };
  }, { passive: true });
  viewport.addEventListener('touchmove', function (event) {
    if (!tap) return;
    var touch = event.touches[0];
    if (Math.hypot(touch.clientX - tap.x, touch.clientY - tap.y) > 12) tap.moved = true;
  }, { passive: true });
  viewport.addEventListener('click', function (event) {
    if (tap && tap.moved) { tap = null; return; }
    if (event.target.closest('a, button, input, textarea, select, table, pre, .wide-object, .tilt-test-harness')) return;
    if (event.clientX < viewport.clientWidth / 2) swiper.slidePrev();
    else swiper.slideNext();
    tap = null;
  });
})();
</script>
{{ end }}
