<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">An advisory path is not approval</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">An advisory path is not approval</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">July: advisory committee meeting</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">HHS later records favorable recommendations.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">October: linked HHS policy PDF</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Calls itself an interim enforcement policy.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">30 October: Federal Register notice</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Calls the policy draft and nonbinding.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Before accepting a customer case</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Counsel checks form, route, state and pathway.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Official sources; checked 3 Nov 2026. Not legal clearance.</text></g></svg>