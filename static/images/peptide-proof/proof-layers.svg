<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">Keep the claims separate</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">Keep the claims separate</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Identity + content</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">What is present? How much?</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Impurities + microbiology</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">What else did the specified methods detect?</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Process + provenance</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Where did it come from? What happened?</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Eligibility + clinical evidence</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Different questions; chemistry cannot settle them.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Conceptual claim boundaries, not a release checklist.</text></g></svg>