<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">A molecule needs several questions</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">A molecule needs several questions</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">HPLC separates detected components</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">Peak area depends on the method.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Calibrated assay estimates quantity</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Reference standards anchor the amount.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Mass spectrometry adds identity evidence</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Matching mass is not every structural answer.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Biological activity is another question</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Chemical amount does not establish benefit.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Synthesis: Agilent peptide methods; FDA Q2(R2).</text></g></svg>