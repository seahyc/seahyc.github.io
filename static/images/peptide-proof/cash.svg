<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">Margin does not finance receivables</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">Margin does not finance receivables</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Discovery: $80,000 gross cap</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">Target receipts $10,000 → net burn $70,000.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">After discovery: 30-day cash gap</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">45 cases × $1,255 = $56,475 advanced.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Plus fixed-cost reserve</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">2 months × $22,000 = $44,000.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Incremental cash screen: $100,475</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Separate from earlier discovery spending.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Invented USD assumptions; prepayments change the gap.</text></g></svg>