<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">Ask for a decision, then a payment</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">Ask for a decision, then a payment</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Reach an owner or quality director</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">APC directory; introductions; owner events.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Review consented recent lot decisions</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Compare the existing direct-lab workflow.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Name the accepting pharmacist</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Agree scope, raw data and failure handling.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Prepaid pilot → priced renewal</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Interest becomes evidence only when paid.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Proposed route; no outreach or customer commitment.</text></g></svg>