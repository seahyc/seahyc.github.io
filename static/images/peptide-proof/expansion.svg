<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">Three expansion gates, three businesses</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">Three expansion gates, three businesses</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Own a lab only after repeat demand</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">Scope assessment + bids + capacity coverage.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Consumers need their own paid test</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Direct contribution must cover acquisition.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Verified supply needs a new legal case</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Licenses, actual products, transfers, conflicts.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Default: stay an evidence company</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Do not attach a storefront to a test report.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Proposed 12–24 month choices, not verified permissions.</text></g></svg>