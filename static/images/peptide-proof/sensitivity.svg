<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">How the base case breaks</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">How the base case breaks</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Base: $545 contribution / case</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">45 cases → $2,525 monthly operating result.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Price falls 20%</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Contribution $185 → monthly loss $13,675.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Total lab cost rises 50%</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Contribution $105 → monthly loss $17,275.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Review time doubles</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Contribution $345 → monthly loss $6,475.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">USD planning scenarios; fixed costs included in results.</text></g></svg>