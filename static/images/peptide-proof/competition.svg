<svg xmlns="http://www.w3.org/2000/svg" width="600" height="515" viewBox="0 0 600 515" role="img" aria-labelledby="title"><title id="title">The buyer already has alternatives</title><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="37" font-size="28" fill="#9d4c3f" text-anchor="start">The buyer already has alternatives</text><rect x="24" y="68" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="99" font-size="26" fill="#526f62" text-anchor="start">Direct qualified laboratory</text><text x="42" y="130" font-size="23" fill="#27231e" text-anchor="start">Chemistry, methods and original reports.</text><rect x="24" y="168" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="199" font-size="26" fill="#526f62" text-anchor="start">Finnrick</text><text x="42" y="230" font-size="23" fill="#27231e" text-anchor="start">Coordinates testing; public and private programs.</text><rect x="24" y="268" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="299" font-size="26" fill="#526f62" text-anchor="start">Internal pharmacy quality staff</text><text x="42" y="330" font-size="23" fill="#27231e" text-anchor="start">Existing supplier and release knowledge.</text><rect x="24" y="368" width="552" height="82" rx="8" fill="none" stroke="#696052" stroke-width="1.4"/><text x="42" y="399" font-size="26" fill="#526f62" text-anchor="start">Proposed entrant</text><text x="42" y="430" font-size="23" fill="#27231e" text-anchor="start">Buyer-controlled custody + reviewed case record.</text><text x="24" y="491" font-size="21" fill="#696052" text-anchor="start">Advertised roles; entrant value remains unproven.</text></g></svg>