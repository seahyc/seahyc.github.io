<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Scenario residuals are not forecasts</title><desc id="desc">Bar chart uses a zero line and scenario annual residuals of negative 384000, positive 123000, and positive 1100000 dollars.</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
<text x="24" y="40" font-size="26" font-weight="700" text-anchor="start">Scenario residuals are not forecasts</text>
<line x1="70" y1="341.25" x2="550" y2="341.25" stroke="#17324d" stroke-width="2"/><text x="52" y="348.25" font-size="21" fill="#17324d" font-weight="700" text-anchor="end">$0</text><rect x="130" y="341.25" width="78" height="67.19999999999999" fill="#a73a3a" opacity="0.88"/><text x="169" y="435.45" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">-384,000</text><text x="169" y="458" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">LOW</text><rect x="285" y="319.725" width="78" height="21.524999999999977" fill="#176b87" opacity="0.88"/><text x="324" y="309.725" font-size="21" fill="#176b87" font-weight="700" text-anchor="middle">+123,000</text><text x="324" y="458" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">BASE</text><rect x="440" y="148.75" width="78" height="192.5" fill="#168777" opacity="0.88"/><text x="479" y="138.75" font-size="21" fill="#168777" font-weight="700" text-anchor="middle">+1,100,000</text><text x="479" y="458" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">HIGH</text><text x="300" y="493" font-size="21" fill="#17324d" font-weight="700" text-anchor="middle">Annual residual · overhead: $300,000/year</text><text x="300" y="522" font-size="21" fill="#17324d" font-weight="400" text-anchor="middle">Assumed completed packages/year: 6 / 12 / 20</text><text x="300" y="548" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">and $300k overhead; all inputs are invented.</text>
<text x="24" y="590" font-size="21" fill="#536777" text-anchor="start">Original scenarios · USD/year · 3 Nov 2026.</text>
</g></svg>
