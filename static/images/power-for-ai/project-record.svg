<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Keep project evidence in separate fields</title><desc id="desc">A project record contains distinct evidence fields. No combined or inferred progress status is assigned.</desc>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" font-weight="700" fill="#17324d">Keep project evidence in separate fields</text><rect x="28" y="75" width="544" height="56" rx="9" fill="none" stroke="#176b87" stroke-width="2.5"/><text x="44" y="99" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">Test authorisation</text><text x="556" y="120" font-size="21" fill="#536777" font-weight="400" text-anchor="end">Permission to conduct a defined test</text><rect x="28" y="140" width="544" height="56" rx="9" fill="none" stroke="#168777" stroke-width="2.5"/><text x="44" y="164" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">Fueled operation</text><text x="556" y="185" font-size="21" fill="#536777" font-weight="400" text-anchor="end">Operation evidence</text><rect x="28" y="205" width="544" height="56" rx="9" fill="none" stroke="#176b87" stroke-width="2.5"/><text x="44" y="229" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">Sustained heat</text><text x="556" y="250" font-size="21" fill="#536777" font-weight="400" text-anchor="end">Thermal output evidence</text><rect x="28" y="270" width="544" height="56" rx="9" fill="none" stroke="#168777" stroke-width="2.5"/><text x="44" y="294" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">Net electricity</text><text x="556" y="315" font-size="21" fill="#536777" font-weight="400" text-anchor="end">Measured export evidence</text><rect x="28" y="335" width="544" height="56" rx="9" fill="none" stroke="#bd7911" stroke-width="2.5"/><text x="44" y="359" font-size="21" fill="#17324d" font-weight="700" text-anchor="start">Site permissions</text><text x="556" y="380" font-size="21" fill="#536777" font-weight="400" text-anchor="end">Project-specific approvals</text><rect x="28" y="400" width="544" height="56" rx="9" fill="none" stroke="#176b87" stroke-width="2.5"/><text x="44" y="424" font-size="21" fill="#17324d" font-weight="700" text-