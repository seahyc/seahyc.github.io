<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Criticality is an early gate</title><desc id="desc">Conceptual chain from zero-power criticality to repeat dependable site delivery; intermediate gates need not occur in this strict order.</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
<text x="24" y="40" font-size="26" font-weight="700" text-anchor="start">Criticality is an early gate</text>
<rect x="126" y="105" width="348" height="72" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300.0" y="136" font-size="22" fill="#168777" font-weight="700" text-anchor="middle">Zero-power</text><text x="300.0" y="164" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">criticality</text><line x1="300" y1="178" x2="300" y2="185" stroke="#9aabb4" stroke-width="2" stroke-dasharray="5 6"/><rect x="126" y="190" width="348" height="72" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="221" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Sustained</text><text x="300.0" y="249" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">heat</text><line x1="300" y1="263" x2="300" y2="270" stroke="#9aabb4" stroke-width="2" stroke-dasharray="5 6"/><rect x="126" y="275" width="348" height="72" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="306" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Net electricity</text><text x="300.0" y="334" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">metered</text><line x1="300" y1="348" x2="300" y2="355" stroke="#9aabb4" stroke-width="2" stroke-dasharray="5 6"/><rect x="126" y="360" width="348" height="72" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="391" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Site permissions</text><text x="300.0" y="419" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">specific</text><line x1="300" y1="433" x2="300" y2="440" stroke="#9aabb4" stroke-width="2" stroke-dasharray="5 6"/><rect x="126" y="445" width="348" height="72" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="476" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Repeat dependable</text><text x="300.0" y="504" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">delivery</text><text x="300" y="550" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">Evidence gates, not a regulatory sequence.</text>
<text x="24" y="590" font-size="21" fill="#536777" text-anchor="start">Basis: DOE test milestones · as of 3 Nov 2026.</text>
</g></svg>
