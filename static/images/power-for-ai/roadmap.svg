<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Readiness service: prove it in steps</title><desc id="desc">Proposed 0 to 24 month evidence gates for validating a readiness service, not an established plan or forecast.</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
<text x="24" y="40" font-size="26" font-weight="700" text-anchor="start">Readiness service: prove it in steps</text>
<rect x="24" y="86" width="552" height="94" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="42" y="117" font-size="22" fill="#176b87" font-weight="700" text-anchor="start">0–3 months</text><text x="205" y="117" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">Paid validation</text><text x="205" y="145" font-size="21" fill="#536777" font-weight="400" text-anchor="start">Audit histories; compare tools;</text><text x="205" y="170" font-size="21" fill="#536777" font-weight="400" text-anchor="start">sell bounded pilots</text><rect x="24" y="198" width="552" height="94" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="42" y="229" font-size="22" fill="#168777" font-weight="700" text-anchor="start">3–6 months</text><text x="205" y="229" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">Repeat delivery</text><text x="205" y="257" font-size="21" fill="#536777" font-weight="400" text-anchor="start">Collect fees; measure hours;</text><text x="205" y="282" font-size="21" fill="#536777" font-weight="400" text-anchor="start">keep the same scope</text><rect x="24" y="310" width="552" height="94" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="42" y="341" font-size="22" fill="#bd7911" font-weight="700" text-anchor="start">6–12 months</text><text x="205" y="341" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">Automate repeats</text><text x="205" y="369" font-size="21" fill="#536777" font-weight="400" text-anchor="start">Reconcile shared evidence;</text><text x="205" y="394" font-size="21" fill="#536777" font-weight="400" text-anchor="start">integrate existing tools</text><rect x="24" y="422" width="552" height="94" rx="12" fill="none" stroke="#17324d" stroke-width="3"/><text x="42" y="453" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">12–24 months</text><text x="205" y="453" font-size="22" fill="#17324d" font-weight="700" text-anchor="start">Expand one path</text><text x="205" y="481" font-size="21" fill="#536777" font-weight="400" text-anchor="start">New region or onsite module;</text><text x="205" y="506" font-size="21" fill="#536777" font-weight="400" text-anchor="start">revalidate requirements</text><text x="300" y="548" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">Proposed evidence gates; conditional on validation.</text>
<text x="24" y="590" font-size="21" fill="#536777" text-anchor="start">Original proposed plan · 3 Nov 2026.</text>
</g></svg>
