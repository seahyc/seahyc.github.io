<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">A queue is a request</title><desc id="desc">Outcomes for the historical generation-capacity cohort requested 2000 to 2020. Other outcomes are not classified here.</desc>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" font-weight="700" fill="#17324d">A queue is a request</text><rect x="28" y="83" width="544" height="74" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300" y="114" font-size="23" fill="#176b87" font-weight="700" text-anchor="middle">2000–2020 generation capacity requested</text><text x="300" y="142" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Historical cohort · reported by end of 2025</text><rect x="28" y="182" width="544" height="74" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300" y="213" font-size="23" fill="#168777" font-weight="700" text-anchor="middle">13% operating</text><text x="300" y="241" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Reported outcome</text><rect x="28" y="281" width="544" height="74" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="300" y="312" font-size="23" fill="#bd7911" font-weight="700" text-anchor="middle">75% withdrawn</text><text x="300" y="340" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Reported outcome</text><rect x="28" y="380" width="544" height="74" rx="12" fill="none" stroke="#536777" stroke-width="3"/><text x="300" y="411" font-size="23" fill="#536777" font-weight="700" text-anchor="middle">Remaining outcomes</text><text x="300" y="439" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Not classified in this summary</text><text x="300" y="494" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">Not an AI-load queue or project success probability.</text>
<text x="28" y="584" font-size="21" fill="#536777">Source: LBNL, Queued Up 2026 · cohort through 2025.</text></g></svg>
