<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">AI power is a chain of gates</title><desc id="desc">AI power is a chain of gates</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
<text x="24" y="40" font-size="26" font-weight="700" text-anchor="start">AI power is a chain of gates</text>
<rect x="24" y="85" width="552" height="82" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="116" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Source → electricity</text><text x="300.0" y="144" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Fuel or heat; conversion; net output</text><line x1="300" y1="168" x2="300" y2="190" stroke="#9aabb4" stroke-width="3"/><rect x="24" y="193" width="552" height="82" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="224" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Grid → service</text><text x="300.0" y="252" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Network capacity; studies; firm terms</text><line x1="300" y1="276" x2="300" y2="298" stroke="#9aabb4" stroke-width="3"/><rect x="24" y="301" width="552" height="82" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300.0" y="332" font-size="22" fill="#176b87" font-weight="700" text-anchor="middle">Equipment → site</text><text x="300.0" y="360" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Transformer; switchgear; commissioning</text><line x1="300" y1="384" x2="300" y2="406" stroke="#9aabb4" stroke-width="3"/><rect x="24" y="409" width="552" height="82" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300.0" y="440" font-size="22" fill="#168777" font-weight="700" text-anchor="middle">Electricity → computing</text><text x="300.0" y="468" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Reliable supply for the required load</text><text x="300" y="540" font-size="23" fill="#a73a3a" font-weight="700" text-anchor="middle">Every dependency must be ready.</text>
<text x="24" y="590" font-size="21" fill="#536777" text-anchor="start">Original conceptual synthesis · 3 Nov 2026.</text>
</g></svg>
