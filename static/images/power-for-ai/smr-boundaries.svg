<title id="title">SMR evidence has separate boundaries</title><desc id="desc">Design approval, site-specific permissions and delivered dependable power are distinct evidence categories.</desc>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" font-weight="700" fill="#17324d">SMR evidence has separate boundaries</text><rect x="28" y="104" width="544" height="74" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300" y="135" font-size="23" fill="#176b87" font-weight="700" text-anchor="middle">Design approval</text><text x="300" y="163" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Evidence about a design</text><text x="300" y="216" font-size="30" fill="#a73a3a" font-weight="700" text-anchor="middle">≠</text><rect x="28" y="248" width="544" height="74" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="300" y="279" font-size="23" fill="#bd7911" font-weight="700" text-anchor="middle">Project permissions</text><text x="300" y="307" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Evidence for a specific site</text><text x="300" y="360" font-size="30" fill="#a73a3a" font-weight="700" text-anchor="middle">≠</text><rect x="28" y="392" width="544" height="74" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300" y="423" font-size="23" fill="#168777" font-weight="700" text-anchor="middle">Delivery</text><text x="300" y="451" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Evidence of dependable electricity</text><text x="300" y="505" font-size="21" fill="#536777" font-weight="700" text-anchor="middle">Each answers a different customer question.</text>
<text x="28" y="584" font-size="21" fill="#536777">Source: company disclosures · reviewed 3 Nov 2026.</text></g></svg>
