<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Transformer lead times differ</title><desc id="desc">DOE historical distribution transformer data and separate Wood Mackenzie large transformer provider estimate.</desc>
<g font-family="Arial, Helvetica, sans-serif" fill="#17324d">
<text x="24" y="40" font-size="26" font-weight="700" text-anchor="start">Transformer lead times differ</text>
<text x="300" y="84" font-size="22" fill="#536777" font-weight="400" text-anchor="middle">Different equipment, different evidence</text><rect x="24" y="108" width="552" height="136" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="44" y="139" font-size="22" fill="#176b87" font-weight="700" text-anchor="start">DOE · distribution transformers</text><text x="44" y="183" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">2019   3–6 months</text><text x="44" y="219" font-size="24" fill="#17324d" font-weight="700" text-anchor="start">2023   12–30 months</text><rect x="24" y="270" width="552" height="136" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="44" y="301" font-size="22" fill="#bd7911" font-weight="700" text-anchor="start">Wood Mackenzie · public 2025 webinar</text><text x="44" y="348" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">Large / GSU power transformer</text><text x="44" y="382" font-size="23" fill="#17324d" font-weight="700" text-anchor="start">2–3 years · provider estimate</text><text x="300" y="450" font-size="22" fill="#a73a3a" font-weight="700" text-anchor="middle">Not a current quote; not SKU-specific.</text><text x="300" y="490" font-size="21" fill="#17324d" font-weight="400" text-anchor="middle">Availability was described as improving.</text><text x="300" y="526" font-size="21" fill="#17324d" font-weight="400" text-anchor="middle">Use site-specific vendor and utility dates.</text>
<text x="24" y="590" font-size="21" fill="#536777" text-anchor="start">Sources: DOE (2019/2023); WoodMac (2025).</text>
</g></svg>
