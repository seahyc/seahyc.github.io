<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">The bear case tests durable value</title><desc id="desc">Four plausible changes that could weaken a startup thesis and the need for durable customer value.</desc>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" font-weight="700" fill="#17324d">The bear case tests durable value</text><rect x="28" y="91" width="544" height="74" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300" y="122" font-size="23" fill="#176b87" font-weight="700" text-anchor="middle">Manufacturers expand</text><text x="300" y="150" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Equipment scarcity may ease</text><rect x="28" y="198" width="544" height="74" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300" y="229" font-size="23" fill="#168777" font-weight="700" text-anchor="middle">Utility processes improve</text><text x="300" y="257" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Project handling may get better</text><rect x="28" y="305" width="544" height="74" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="300" y="336" font-size="23" fill="#bd7911" font-weight="700" text-anchor="middle">Customers standardise</text><text x="300" y="364" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Fewer bespoke workflows</text><rect x="28" y="412" width="544" height="74" rx="12" fill="none" stroke="#536777" stroke-width="3"/><text x="300" y="443" font-size="23" fill="#536777" font-weight="700" text-anchor="middle">Incumbent EPCs deliver</text><text x="300" y="471" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Existing capability may be enough</text><text x="300" y="532" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">Startup value must survive all four changes.</text>
<text x="28" y="584" font-size="21" fill="#536777">Source: Power for AI · author’s bear case, 3 Nov 2026.</text></g></svg>
