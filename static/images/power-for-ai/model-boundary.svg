<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
<title id="title">Model outputs stop at the evidence boundary</title><desc id="desc">Original assumptions generate calculated outputs, but customer and operating inputs remain unverified.</desc>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="42" font-size="26" font-weight="700" fill="#17324d">Model outputs stop at the evidence boundary</text><rect x="28" y="100" width="544" height="74" rx="12" fill="none" stroke="#176b87" stroke-width="3"/><text x="300" y="131" font-size="23" fill="#176b87" font-weight="700" text-anchor="middle">Original assumptions</text><text x="300" y="159" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Fees · hours · costs · volume · overhead</text><text x="300" y="228" font-size="28" fill="#536777" font-weight="700" text-anchor="middle">↓</text><rect x="28" y="258" width="544" height="74" rx="12" fill="none" stroke="#168777" stroke-width="3"/><text x="300" y="289" font-size="23" fill="#168777" font-weight="700" text-anchor="middle">Calculated outputs</text><text x="300" y="317" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Contribution · annual residual · sensitivities</text><text x="300" y="386" font-size="30" fill="#a73a3a" font-weight="700" text-anchor="middle">≠</text><rect x="28" y="414" width="544" height="74" rx="12" fill="none" stroke="#bd7911" stroke-width="3"/><text x="300" y="445" font-size="23" fill="#bd7911" font-weight="700" text-anchor="middle">Unverified real-world inputs</text><text x="300" y="473" font-size="21" fill="#536777" font-weight="400" text-anchor="middle">Customer demand · delivery effort · reliability</text><text x="300" y="526" font-size="21" fill="#a73a3a" font-weight="700" text-anchor="middle">Arithmetic is not validation.</text>
<text x="28" y="584" font-size="21" fill="#536777">Source: original model · assumptions dated 3 Nov 2026.</text></g></svg>
