<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Scenario contribution per one million dollars of invoices purchased</title><desc id="d">Three scenario bars show contribution after illustrative funding, loss, operations, and acquisition costs.</desc><rect width="1200" height="620" fill="#f3eadb"/><style>text{font-family:Arial,sans-serif;fill:#27231e}.h{font-weight:700;font-size:24px}.s{font-size:17px;fill:#62594e}.v{font-size:21px;font-weight:700}.axis{stroke:#81766a;stroke-width:2}</style><text x="65" y="65" class="h">ILLUSTRATIVE CONTRIBUTION PER $1M PURCHASED</text><text x="65" y="96" class="s">36.5-day cash conversion; fee, loss, operations and acquisition inputs are analyst scenarios—not observed startup economics.</text><line x1="170" y1="470" x2="1100" y2="470" class="axis"/><line x1="170" y1="150" x2="170" y2="510" class="axis"/><text x="100" y="160" class="s">$10k</text><text x="102" y="320" class="s">$0</text><text x="91" y="480" class="s">−$10k</text><g><rect x="270" y="210" width="170" height="110" fill="#315746"/><text x="300" y="195" class="v">+$3.9k</text><text x="300" y="510" class="h">LOW</text><text x="276" y="540" class="s">fee 1.29% · loss .1%</text></g><g><rect x="550" y="320" width="170" height="85" fill="#a6752e"/><text x="580" y="435" class="v">−$3.1k</text><text x="574" y="510" class="h">BASE</text><text x="552" y="540" class="s">fee 1.29% · loss .3%</text></g><g><rect x="830" y="320" width="170" height="205" fill="#9d4c3f"/><text x="858" y="555" class="v">−$23.5k</text><text x="858" y="510" class="h">HIGH</text><text x="828" y="580" class="s">fee .75% · loss 1.0%</text></g><text x="65" y="595" class="s">Formula: gross fee − funding cost − expected loss − operations − acquisition. Inputs are visible in the report appendix.</text></svg>
