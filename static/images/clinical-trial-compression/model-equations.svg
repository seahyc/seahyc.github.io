<svg xmlns="http://www.w3.org/2000/svg" width="600" height="715" viewBox="0 0 600 715" role="img" aria-labelledby="title desc"><title id="title">Supplier and buyer economics use different equations</title><desc id="desc">Supplier contribution subtracts delivery, reserve and acquisition from fee. Delivery comprises hours times loaded rate and other direct costs. Buyer cash benefit multiplies saved workflow days, critical-path fraction and avoidable daily cash, then subtracts the fee. Fixed overhead and buyer integration costs require separate consideration.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="29" fill="#27231e">Two equations, two decisions</text><text x="20" y="77" font-family="Georgia,serif" font-size="22" fill="#665f52">Author assumptions · USD · 3 Nov 2026</text><rect x="20" y="105" width="560" height="206" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="142" font-family="Georgia,serif" font-size="28" fill="#566e5e">Supplier contribution</text><text x="40" y="187" font-family="Georgia,serif" font-size="24" fill="#27231e">Fee − delivery − reserve − acquisition</text><text x="40" y="231" font-family="Georgia,serif" font-size="23" fill="#27231e">Delivery includes hours × loaded rate</text><text x="40" y="272" font-family="Georgia,serif" font-size="23" fill="#27231e">and other direct costs.</text><rect x="20" y="342" width="560" height="216" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="40" y="380" font-family="Georgia,serif" font-size="28" fill="#9d4c3f">Buyer avoidable cash benefit</text><text x="40" y="426" font-family="Georgia,serif" font-size="25" fill="#27231e">Workflow days saved</text><text x="40" y="464" font-family="Georgia,serif" font-size="23" fill="#27231e">× fraction that advances the critical path</text><text x="40" y="502" font-family="Georgia,serif" font-size="23" fill="#27231e">× documented avoidable cash per day</text><text x="40" y="538" font-family="Georgia,serif" font-size="23" fill="#27231e">Then subtract the fee.</text><text x="20" y="603" font-family="Georgia,serif" font-size="23" fill="#27231e">Company viability also needs fixed overhead.</text><text x="20" y="639" font-family="Georgia,serif" font-size="23" fill="#27231e">Buyer value also needs integration costs.</text><text x="20" y="686" font-family="Georgia,serif" font-size="22" fill="#665f52">Source: scenario-model.json; not market rates.</text></svg>
