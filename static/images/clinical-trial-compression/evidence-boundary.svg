<svg xmlns="http://www.w3.org/2000/svg" width="600" height="725" viewBox="0 0 600 725" role="img" aria-labelledby="title desc"><title id="title">Evidence layers answer different questions</title><desc id="desc">Regulators establish rules. Observational cohorts establish bounded historical burden. Company reports establish reported use and task results. Founder scenarios expose arithmetic. None establishes this startup’s customer-specific acceleration; actual timelines and paid acceptance are the proposed next evidence.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="29" fill="#27231e">What each evidence layer earns</text><rect x="20" y="75" width="560" height="109" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="107" font-family="Georgia,serif" font-size="27" fill="#566e5e">Regulators</text><text x="40" y="141" font-family="Georgia,serif" font-size="23" fill="#27231e">Rules, routes and responsibilities</text><text x="40" y="171" font-family="Georgia,serif" font-size="22" fill="#9d4c3f">Not this company’s measured effect</text><rect x="20" y="205" width="560" height="109" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="237" font-family="Georgia,serif" font-size="27" fill="#566e5e">Observational studies</text><text x="40" y="271" font-family="Georgia,serif" font-size="23" fill="#27231e">Burden in a defined historical cohort</text><text x="40" y="301" font-family="Georgia,serif" font-size="22" fill="#9d4c3f">Not current avoidable customer delay</text><rect x="20" y="335" width="560" height="109" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="367" font-family="Georgia,serif" font-size="27" fill="#566e5e">Company reports</text><text x="40" y="401" font-family="Georgia,serif" font-size="23" fill="#27231e">Reported use or bounded task results</text><text x="40" y="431" font-family="Georgia,serif" font-size="22" fill="#9d4c3f">Not independent whole-trial proof</text><rect x="20" y="465" width="560" height="109" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="497" font-family="Georgia,serif" font-size="27" fill="#566e5e">Founder scenarios</text><text x="40" y="531" font-family="Georgia,serif" font-size="23" fill="#27231e">Inspectable assumptions and arithmetic</text><text x="40" y="561" font-family="Georgia,serif" font-size="22" fill="#9d4c3f">Not demand, pricing or observed savings</text><path d="M300 584 L300 612" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294 605 L300 612" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M306 605 L300 612" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="650" font-family="Georgia,serif" font-size="25" fill="#27231e">Next: actual timelines + paid acceptance</text><text x="20" y="694" font-family="Georgia,serif" font-size="22" fill="#665f52">Source: dossier evidence ledger · 3 Nov 2026</text></svg>
