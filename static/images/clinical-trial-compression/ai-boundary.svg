<svg xmlns="http://www.w3.org/2000/svg" width="600" height="575" viewBox="0 0 600 575" role="img" aria-labelledby="title desc"><title id="title">Task improvement is not whole-trial acceleration</title><desc id="desc">The 89% company-reported human review-time reduction applies to manufacturing batch records. Human quality staff retain decisions. The result does not establish total clinical-trial acceleration.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="29" fill="#27231e">A task result has a boundary</text><rect x="20" y="65" width="560" height="142" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="100" font-family="Georgia,serif" font-size="26" fill="#566e5e">Manufacturing batch-record review</text><text x="40" y="144" font-family="Georgia,serif" font-size="28" fill="#566e5e">89% less human review time</text><text x="40" y="181" font-family="Georgia,serif" font-size="23" fill="#27231e">Company-reported; advisory system</text><path d="M300 219 L300 247" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294 240 L300 247" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M306 240 L300 247" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="286" font-family="Georgia,serif" font-size="27" fill="#27231e">Human quality decision remains</text><path d="M20 312 L580 312" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="7 6"/><text x="20" y="352" font-family="Georgia,serif" font-size="26" fill="#9d4c3f">No measured bridge to total trial time</text><rect x="20" y="380" width="560" height="91" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="40" y="416" font-family="Georgia,serif" font-size="26" fill="#27231e">Clinical milestones</text><text x="40" y="450" font-family="Georgia,serif" font-size="22" fill="#27231e">Timing effect not established by this result</text><text x="20" y="517" font-family="Georgia,serif" font-size="22" fill="#665f52">Sources: Anthropic / Enveda reports</text><text x="20" y="549" font-family="Georgia,serif" font-size="22" fill="#665f52">Company evidence · checked 3 Nov 2026</text></svg>
