<svg xmlns="http://www.w3.org/2000/svg" width="600" height="590" viewBox="0 0 600 590" role="img" aria-labelledby="title desc"><title id="title">Location and comparison design are separate choices</title><desc id="desc">Remote visits do not lower the evidence standard. External observed controls, predicted prognosis and randomized comparisons are distinct and not automatically interchangeable.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="29" fill="#27231e">Remote visits change location</text><text x="20" y="72" font-family="Georgia,serif" font-size="25" fill="#9d4c3f">The evidence standard still applies.</text><rect x="20" y="110" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="142" font-family="Georgia,serif" font-size="26" fill="#566e5e">External observed controls</text><text x="38" y="173" font-family="Georgia,serif" font-size="22" fill="#27231e">Outcomes observed outside this trial</text><rect x="20" y="231" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="263" font-family="Georgia,serif" font-size="26" fill="#566e5e">Predicted prognosis</text><text x="38" y="294" font-family="Georgia,serif" font-size="22" fill="#27231e">A model estimates an untreated outcome</text><rect x="20" y="352" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="384" font-family="Georgia,serif" font-size="26" fill="#566e5e">Randomized comparison</text><text x="38" y="415" font-family="Georgia,serif" font-size="22" fill="#27231e">Assignment creates a concurrent comparison</text><text x="20" y="480" font-family="Georgia,serif" font-size="25" fill="#9d4c3f">These are distinct evidence designs.</text><text x="20" y="515" font-family="Georgia,serif" font-size="23" fill="#27231e">Suitability needs design-specific review.</text><text x="20" y="560" font-family="Georgia,serif" font-size="22" fill="#665f52">Separate methods; no blanket acceptance.</text></svg>
