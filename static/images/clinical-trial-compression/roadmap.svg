<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">Proposed evidence-gated development path</title><desc id="desc">Months zero to three access and paid pilots; three to six quality and milestone testing; six to twelve repeat delivery; twelve to twenty-four unrelated software buyers only if reusable.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="28" fill="#27231e">Proposed sequence · evidence gates</text><rect x="20" y="65" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="97" font-family="Georgia,serif" font-size="26" fill="#566e5e">Months 0–3: access + paid pilots</text><text x="38" y="128" font-family="Georgia,serif" font-size="22" fill="#27231e">Confirm lawful access and a paying buyer</text><path d="M300 153 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="185" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="217" font-family="Georgia,serif" font-size="26" fill="#566e5e">Months 3–6: quality + milestone test</text><text x="38" y="248" font-family="Georgia,serif" font-size="22" fill="#27231e">Measure critical-path movement and quality</text><path d="M300 273 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="305" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="337" font-family="Georgia,serif" font-size="26" fill="#566e5e">Months 6–12: repeat delivery</text><text x="38" y="368" font-family="Georgia,serif" font-size="22" fill="#27231e">Test repeatability and contribution</text><path d="M300 393 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="425" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="457" font-family="Georgia,serif" font-size="26" fill="#566e5e">Months 12–24: software buyers</text><text x="38" y="488" font-family="Georgia,serif" font-size="22" fill="#27231e">Only if reusable; seek unrelated buyers</text><text x="20" y="590" font-family="Georgia,serif" font-size="23" fill="#665f52">A proposed test sequence, not a forecast.</text></svg>
