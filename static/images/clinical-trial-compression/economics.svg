<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Supplier contribution and buyer value diverge</title><desc id="desc">Base scenario assumptions: fee 90000, direct delivery 56200, acquisition 9000, contribution 24800. Separately buyer cash benefit 60000 less fee 90000 equals negative 30000; before any customer integration cost.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="28" fill="#27231e">Base scenario · USD assumptions</text><text x="20" y="78" font-family="Georgia,serif" font-size="26" fill="#566e5e">Supplier contribution per package</text><text x="20" y="123" font-family="Georgia,serif" font-size="24" fill="#27231e">Fee</text><text x="420" y="123" font-family="Georgia,serif" font-size="24" fill="#566e5e">90,000</text><text x="20" y="172" font-family="Georgia,serif" font-size="24" fill="#27231e">Less direct delivery</text><text x="420" y="172" font-family="Georgia,serif" font-size="24" fill="#665f52">-56,200</text><text x="20" y="221" font-family="Georgia,serif" font-size="24" fill="#27231e">Less acquisition</text><text x="420" y="221" font-family="Georgia,serif" font-size="24" fill="#665f52">-9,000</text><text x="20" y="270" font-family="Georgia,serif" font-size="24" fill="#27231e">Contribution</text><text x="420" y="270" font-family="Georgia,serif" font-size="24" fill="#566e5e">24,800</text><path d="M20 285 L580 285" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="329" font-family="Georgia,serif" font-size="26" fill="#9d4c3f">Buyer cash value is a separate test</text><text x="20" y="376" font-family="Georgia,serif" font-size="24" fill="#27231e">Avoidable cash benefit</text><text x="420" y="376" font-family="Georgia,serif" font-size="24" fill="#566e5e">60,000</text><text x="20" y="425" font-family="Georgia,serif" font-size="24" fill="#27231e">Less fee</text><text x="420" y="425" font-family="Georgia,serif" font-size="24" fill="#9d4c3f">-90,000</text><text x="20" y="474" font-family="Georgia,serif" font-size="24" fill="#27231e">Benefit less fee</text><text x="420" y="474" font-family="Georgia,serif" font-size="24" fill="#9d4c3f">-30,000</text><text x="20" y="541" font-family="Georgia,serif" font-size="23" fill="#9d4c3f">Supplier profit does not establish buyer ROI.</text><text x="20" y="582" font-family="Georgia,serif" font-size="21" fill="#665f52">Source: scenario-model.json; not market quotes.</text></svg>
