<svg xmlns="http://www.w3.org/2000/svg" width="600" height="575" viewBox="0 0 600 575" role="img" aria-labelledby="title desc"><title id="title">HSA and ethics review can run in parallel</title><desc id="desc">The standard CTA turnaround is 30 working days excluding clarification stop clocks. Ethics review can run in parallel. Completion does not establish site readiness; CTN is a different route.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="27" fill="#27231e">Singapore: parallel paths, distinct gates</text><text x="20" y="81" font-family="Georgia,serif" font-size="25" fill="#566e5e">CTA application</text><text x="20" y="115" font-family="Georgia,serif" font-size="25" fill="#566e5e">30 working days</text><text x="20" y="148" font-family="Georgia,serif" font-size="22" fill="#27231e">Standard HSA clock</text><text x="20" y="181" font-family="Georgia,serif" font-size="22" fill="#27231e">Stop clocks excluded</text><text x="330" y="81" font-family="Georgia,serif" font-size="25" fill="#566e5e">Ethics review</text><text x="330" y="115" font-family="Georgia,serif" font-size="24" fill="#27231e">Runs in parallel</text><text x="330" y="148" font-family="Georgia,serif" font-size="22" fill="#27231e">Separate review</text><text x="330" y="181" font-family="Georgia,serif" font-size="22" fill="#27231e">and decision</text><path d="M150 205 L150 242" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M450 205 L450 242" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M150 242 L450 242" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M300 242 L300 270" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294 263 L300 270" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M306 263 L300 270" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><rect x="20" y="291" width="560" height="94" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="327" font-family="Georgia,serif" font-size="26" fill="#9d4c3f">Both reviews are not all of startup</text><text x="40" y="362" font-family="Georgia,serif" font-size="24" fill="#27231e">Site readiness must also be established</text><text x="20" y="428" font-family="Georgia,serif" font-size="24" fill="#27231e">Do not borrow the CTN route as a shortcut.</text><text x="20" y="464" font-family="Georgia,serif" font-size="24" fill="#27231e">Sponsor responsibilities persist.</text><text x="20" y="515" font-family="Georgia,serif" font-size="22" fill="#665f52">Sources: HSA application + sponsor guidance</text><text x="20" y="547" font-family="Georgia,serif" font-size="22" fill="#665f52">Process diagram; lengths are not durations</text></svg>
