<svg xmlns="http://www.w3.org/2000/svg" width="600" height="645" viewBox="0 0 600 645" role="img" aria-labelledby="title desc"><title id="title">Measure the accepted path rather than generated pages</title><desc id="desc">A proposed measurement flow begins with all attempted deliveries, separates waiting, work, expert review, corrections and external dependencies, and compares accepted-package and first-patient milestones with a baseline while independently reviewing quality.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="29" fill="#27231e">Measure every delivery attempt</text><rect x="20" y="65" width="560" height="74" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="97" font-family="Georgia,serif" font-size="26" fill="#566e5e">Start with all assignments</text><text x="40" y="125" font-family="Georgia,serif" font-size="22" fill="#27231e">Include cancellations and failed deliveries</text><path d="M300 148 L300 176" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294 169 L300 176" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M306 169 L300 176" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="209" font-family="Georgia,serif" font-size="25" fill="#27231e">Separate the elapsed-time components</text><rect x="20" y="233" width="560" height="51" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="267" font-family="Georgia,serif" font-size="25" fill="#566e5e">Input waiting + active work</text><rect x="20" y="300" width="560" height="51" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="40" y="334" font-family="Georgia,serif" font-size="25" fill="#566e5e">Expert queue + corrections</text><rect x="20" y="367" width="560" height="51" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="40" y="401" font-family="Georgia,serif" font-size="25" fill="#9d4c3f">Contracts + authority + supply</text><path d="M300 428 L300 456" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294 449 L300 456" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M306 449 L300 456" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="489" font-family="Georgia,serif" font-size="27" fill="#27231e">Accepted package → first patient</text><text x="20" y="528" font-family="Georgia,serif" font-size="24" fill="#27231e">Compare with a usual-workflow baseline.</text><text x="20" y="566" font-family="Georgia,serif" font-size="24" fill="#27231e">Independently adjudicate critical misses.</text><text x="20" y="616" font-family="Georgia,serif" font-size="22" fill="#665f52">Proposed measurement design; no results yet.</text></svg>
