<svg xmlns="http://www.w3.org/2000/svg" width="600" height="959" viewBox="0 0 600 959" role="img" aria-labelledby="title desc"><title id="title">Scenario contribution differs for supplier and buyer</title><desc id="desc">Invented low, base and high scenarios. Supplier contributions are minus 30000, 24800 and 64400 USD. Buyer cash benefits less fee are minus 65000, minus 30000 and 70000 USD. Identical diverging scales and zero baselines.</desc><text x="20" y="36" font-family="Georgia,serif" font-size="29" fill="#27231e">Supplier and buyer can disagree</text><text x="20" y="73" font-family="Georgia,serif" font-size="23" fill="#665f52">USD per package · invented scenarios</text><text x="20" y="118" font-family="Georgia,serif" font-size="25" fill="#566e5e">Supplier: contribution after acquisition</text><path d="M296 140 L296 405" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="167" font-family="Georgia,serif" font-size="23" fill="#27231e">Low</text><rect x="194.0" y="177" width="102.0" height="15" fill="#9d4c3f"/><text x="154.0" y="219" font-family="Georgia,serif" font-size="23" fill="#9d4c3f">−$30,000</text><text x="20" y="258" font-family="Georgia,serif" font-size="23" fill="#27231e">Base</text><rect x="296.0" y="268" width="84.3" height="15" fill="#566e5e"/><text x="340.32" y="310" font-family="Georgia,serif" font-size="23" fill="#566e5e">$24,800</text><text x="20" y="349" font-family="Georgia,serif" font-size="23" fill="#27231e">High</text><rect x="296.0" y="359" width="219.0" height="15" fill="#566e5e"/><text x="450" y="401" font-family="Georgia,serif" font-size="23" fill="#566e5e">$64,400</text><text x="288" y="434" font-family="Georgia,serif" font-size="21" fill="#665f52">0</text><text x="20" y="495" font-family="Georgia,serif" font-size="25" fill="#9d4c3f">Buyer: cash benefit less fee</text><path d="M296 517 L296 782" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="20" y="544" font-family="Georgia,serif" font-size="23" fill="#27231e">Low</text><rect x="75.0" y="554" width="221.0" height="15" fill="#9d4c3f"/><text x="35.0" y="596" font-family="Georgia,serif" font-size="23" fill="#9d4c3f">−$65,000</text><text x="20" y="635" font-family="Georgia,serif" font-size="23" fill="#27231e">Base</text><rect x="194.0" y="645" width="102.0" height="15" fill="#9d4c3f"/><text x="154.0" y="687" font-family="Georgia,serif" font-size="23" fill="#9d4c3f">−$30,000</text><text x="20" y="726" font-family="Georgia,serif" font-size="23" fill="#27231e">High</text><rect x="296.0" y="736" width="238.0" height="15" fill="#566e5e"/><text x="450" y="778" font-family="Georgia,serif" font-size="23" fill="#566e5e">$70,000</text><text x="288" y="811" font-family="Georgia,serif" font-size="21" fill="#665f52">0</text><text x="20" y="861" font-family="Georgia,serif" font-size="22" fill="#665f52">Common zero and scale in both panels.</text><text x="20" y="896" font-family="Georgia,serif" font-size="22" fill="#665f52">Source: scenario-model.json · 3 Nov 2026</text><text x="20" y="931" font-family="Georgia,serif" font-size="22" fill="#665f52">Before fixed overhead / buyer integration costs</text></svg>
