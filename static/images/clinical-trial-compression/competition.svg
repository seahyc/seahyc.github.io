amily="Georgia,serif" font-size="24" fill="#27231e">Recruitment</text><path d="M20 435 L580 435" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="483" font-family="Georgia,serif" font-size="25" fill="#566e5e">Formation Bio</text><text x="260" y="483" font-family="Georgia,serif" font-size="24" fill="#27231e">Asset ownership</text><path d="M20 501 L580 501" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="575" font-family="Georgia,serif" font-size="22" fill="#665f52">Documented offerings; not a feature comparison.</text></svg>
