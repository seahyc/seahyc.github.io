<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title desc"><title id="title">Parallel startup dependencies</title><desc id="desc">Conceptual parallel branches join at startup. Site contracting is drawn as binding. Branch lengths are illustrative, not measured durations.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="28" fill="#27231e">Startup waits for all three branches</text><text x="20" y="90" font-family="Georgia,serif" font-size="25" fill="#566e5e">Protocol readiness</text><path d="M30 110 L360 110" fill="none" stroke="#566e5e" stroke-width="2"/><circle cx="360" cy="110" r="6" fill="#566e5e"/><path d="M360 110 L550 110" fill="none" stroke="#665f52" stroke-width="2"/><path d="M550 110 L550 390" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="200" font-family="Georgia,serif" font-size="25" fill="#9d4c3f">Site contracting</text><path d="M30 220 L510 220" fill="none" stroke="#9d4c3f" stroke-width="2"/><circle cx="510" cy="220" r="6" fill="#9d4c3f"/><path d="M510 220 L550 220" fill="none" stroke="#665f52" stroke-width="2"/><path d="M550 220 L550 390" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="310" font-family="Georgia,serif" font-size="25" fill="#566e5e">Drug supply</text><path d="M30 330 L430 330" fill="none" stroke="#566e5e" stroke-width="2"/><circle cx="430" cy="330" r="6" fill="#566e5e"/><path d="M430 330 L550 330" fill="none" stroke="#665f52" stroke-width="2"/><path d="M550 330 L550 390" fill="none" stroke="#665f52" stroke-width="2"/><text x="20" y="405" font-family="Georgia,serif" font-size="27" fill="#566e5e">All ready → startup may proceed</text><text x="20" y="460" font-family="Georgia,serif" font-size="24" fill="#27231e">Faster protocol work advances startup</text><text x="20" y="492" font-family="Georgia,serif" font-size="24" fill="#27231e">only when the longest binding branch</text><text x="20" y="524" font-family="Georgia,serif" font-size="24" fill="#27231e">changes. Other constraints can take over.</text><text x="20" y="575" font-family="Georgia,serif" font-size="22" fill="#665f52">Conceptual dependencies; no time scale</text></svg>
