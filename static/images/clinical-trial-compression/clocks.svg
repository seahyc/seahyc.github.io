<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Historical Phase II duration means</title><desc id="desc">Three independent zero-based bars show initiation 130.0 days, enrollment 438.5 days, and protocol to database lock 1027.9 days. They are not additive. Table 6 of PMC9373886; overall cohort 187 protocols.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="27" fill="#27231e">Different clocks, separate zero baselines</text><text x="20" y="100" font-family="Georgia,serif" font-size="26" fill="#27231e">Initiation</text><text x="20" y="133" font-family="Georgia,serif" font-size="23" fill="#566e5e">130.0 days</text><path d="M20 144 L20 174" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="148" width="67.03" height="20" fill="#566e5e"/><text x="20" y="225" font-family="Georgia,serif" font-size="26" fill="#27231e">Enrollment</text><text x="20" y="258" font-family="Georgia,serif" font-size="23" fill="#566e5e">438.5 days</text><path d="M20 269 L20 299" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="273" width="226.10" height="20" fill="#566e5e"/><text x="20" y="350" font-family="Georgia,serif" font-size="26" fill="#27231e">Protocol to database lock</text><text x="20" y="383" font-family="Georgia,serif" font-size="23" fill="#566e5e">1,027.9 days</text><path d="M20 394 L20 424" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="398" width="530.00" height="20" fill="#566e5e"/><text x="20" y="465" font-family="Georgia,serif" font-size="21" fill="#665f52">0</text><text x="20" y="505" font-family="Georgia,serif" font-size="23" fill="#9d4c3f">Historical Phase II means; do not add them.</text><text x="20" y="545" font-family="Georgia,serif" font-size="22" fill="#665f52">Tufts · PMC9373886 · Table 6</text><text x="20" y="577" font-family="Georgia,serif" font-size="22" fill="#665f52">187 protocols in the overall study cohort</text></svg>
