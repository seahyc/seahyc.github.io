<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc"><title id="title">Proposed package boundary and acceptance</title><desc id="desc">Four readiness deliverables feed qualified sponsor acceptance. Clinical care, drug supply, full monitoring and regulator decisions are outside the proposed package.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="29" fill="#27231e">Proposed readiness package</text><rect x="20" y="70" width="560" height="49" rx="6" fill="none" stroke="#566e5e"/><text x="38" y="103" font-family="Georgia,serif" font-size="25" fill="#566e5e">Evidence matrix</text><rect x="20" y="132" width="560" height="49" rx="6" fill="none" stroke="#566e5e"/><text x="38" y="165" font-family="Georgia,serif" font-size="25" fill="#566e5e">Clinical issue log</text><rect x="20" y="194" width="560" height="49" rx="6" fill="none" stroke="#566e5e"/><text x="38" y="227" font-family="Georgia,serif" font-size="25" fill="#566e5e">Site-confirmed feasibility</text><rect x="20" y="256" width="560" height="49" rx="6" fill="none" stroke="#566e5e"/><text x="38" y="289" font-family="Georgia,serif" font-size="25" fill="#566e5e">Named dependency owners</text><path d="M300 310 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="345" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="377" font-family="Georgia,serif" font-size="26" fill="#566e5e">Qualified sponsor acceptance</text><text x="38" y="408" font-family="Georgia,serif" font-size="22" fill="#27231e">Explicit scope, open issues and sign-off</text><text x="20" y="475" font-family="Georgia,serif" font-size="26" fill="#9d4c3f">Outside this package</text><text x="20" y="511" font-family="Georgia,serif" font-size="22" fill="#27231e">Clinical care · drug supply · full monitoring</text><text x="20" y="546" font-family="Georgia,serif" font-size="23" fill="#27231e">Regulator decisions remain external.</text></svg>
