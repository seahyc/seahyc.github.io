<svg xmlns="http://www.w3.org/2000/svg" width="600" height="625" viewBox="0 0 600 625" role="img" aria-labelledby="title desc"><title id="title">Three gates for proceeding</title><desc id="desc">Require lawful access and a paid buyer, critical-path movement with quality, and buyer value plus contribution. Failure at any gate means stop or reposition.</desc><text x="20" y="35" font-family="Georgia,serif" font-size="29" fill="#27231e">Three gates before expansion</text><rect x="20" y="75" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="107" font-family="Georgia,serif" font-size="26" fill="#566e5e">1. Lawful access + paid buyer</text><text x="38" y="138" font-family="Georgia,serif" font-size="22" fill="#27231e">Rights, workflow access and a real budget</text><path d="M300 165 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="205" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="237" font-family="Georgia,serif" font-size="26" fill="#566e5e">2. Critical-path movement + quality</text><text x="38" y="268" font-family="Georgia,serif" font-size="22" fill="#27231e">Accepted evidence; no degraded safeguards</text><path d="M300 295 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="335" width="560" height="82" rx="8" fill="none" stroke="#566e5e" stroke-width="2"/><text x="38" y="367" font-family="Georgia,serif" font-size="26" fill="#566e5e">3. Buyer value + contribution</text><text x="38" y="398" font-family="Georgia,serif" font-size="22" fill="#27231e">Buyer benefit and viable delivery economics</text><path d="M300 425 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="20" y="465" width="560" height="82" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="38" y="497" font-family="Georgia,serif" font-size="26" fill="#9d4c3f">Any failed gate: stop or reposition</text><text x="38" y="528" font-family="Georgia,serif" font-size="22" fill="#27231e">Proceed only after the failed gate is resolved</text><text x="20" y="595" font-family="Georgia,serif" font-size="23" fill="#665f52">Proposed decision rule; no gate is proven.</text></svg>
