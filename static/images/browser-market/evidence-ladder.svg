<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Two columns listing what the Levels post supports and what it does not show"><text x="300" y="32" font-family="Georgia, Times, serif" font-size="22" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">One retained subscription: what it shows</text><rect x="10" y="56" width="285" height="312" rx="6" fill="#e4ecd9" stroke="#4f7f7a" stroke-width="1.5" opacity="1"/><rect x="305" y="56" width="285" height="312" rx="6" fill="#f1ddd6" stroke="#9d4c3f" stroke-width="1.5" opacity="1"/><text x="152" y="88" font-family="Georgia, Times, serif" font-size="20" text-anchor="middle" fill="#4f7f7a" font-weight="bold" font-style="normal">The post supports</text><text x="447" y="88" font-family="Georgia, Times, serif" font-size="20" text-anchor="middle" fill="#9d4c3f" font-weight="bold" font-style="normal">The post does not show</text><text x="26" y="122" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Levels keeps $99/month</text><text x="26" y="146" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">after weeks of trying</text><text x="26" y="170" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">to replace it with code.</text><text x="26" y="194" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal"></text><text x="26" y="218" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">~80% of his scraping is</text><text x="26" y="242" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Google results for one</text><text x="26" y="266" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">product.</text><text x="26" y="290" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal"></text><text x="26" y="314" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">He says he is happy</text><text x="26" y="338" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">with ScrapingBee.</text><text x="321" y="122" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Why his own version failed</text><text x="321" y="146" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">(no logs were available).</text><text x="321" y="170" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal"></text><text x="321" y="194" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">An unmet need the</text><text x="321" y="218" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">incumbent leaves open.</text><text x="321" y="242" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal"></text><text x="321" y="266" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Any multi-page or</text><text x="321" y="290" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">transactional workflow.</text><text x="321" y="314" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal"></text><text x="321" y="338" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">That other buyers switch.</text><text x="300" y="400" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">Source: raw captures of the 5 Sept 2026 thread, paraphrased.</text></svg>