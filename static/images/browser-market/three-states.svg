<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 426" width="600" height="426" role="img" aria-label="Three stacked boxes: browser state, task state, business state"><text x="300" y="30" font-family="Georgia, Times, serif" font-size="22" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">Three kinds of state</text><rect x="14" y="56" width="572" height="98" rx="10" fill="#e4ecd9" stroke="#4f7f7a" stroke-width="2.5" opacity="1"/><text x="30" y="88" font-family="Georgia, Times, serif" font-size="22" text-anchor="start" fill="#4f7f7a" font-weight="bold" font-style="normal">Browser state</text><text x="30" y="116" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">cookies, saved login, fingerprint</text><text x="30" y="140" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#81766a" font-weight="normal" font-style="normal">Sold today by Browserbase, Steel, Skyvern</text><rect x="14" y="168" width="572" height="98" rx="10" fill="#f3ead9" stroke="#b98a2e" stroke-width="2.5" opacity="1"/><text x="30" y="200" font-family="Georgia, Times, serif" font-size="22" text-anchor="start" fill="#b98a2e" font-weight="bold" font-style="normal">Task state</text><text x="30" y="228" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">step reached, retries, pause for a person</text><text x="30" y="252" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#81766a" font-weight="normal" font-style="normal">Temporal-style durability and handoffs</text><rect x="14" y="280" width="572" height="98" rx="10" fill="#f1ddd6" stroke="#9d4c3f" stroke-width="2.5" opacity="1"/><text x="30" y="312" font-family="Georgia, Times, serif" font-size="22" text-anchor="start" fill="#9d4c3f" font-weight="bold" font-style="normal">Business state</text><text x="30" y="340" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">was the order accepted, is the draft saved,</text><text x="30" y="364" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#81766a" font-weight="normal" font-style="normal">will a retry duplicate it?  Not seen on any page</text><text x="300" y="408" font-family="Georgia, Times, serif" font-size="17" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">Wedge hypothesis: own the bottom box for one workflow. Unproven.</text></svg>