<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 446" width="600" height="446" role="img" aria-label="Staircase of four stages with a gate on each step"><text x="300" y="30" font-family="Georgia, Times, serif" font-size="22" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">Four stages, each with a gate</text><rect x="14" y="250" width="148" height="150" rx="8" fill="#f3ead9" stroke="#4f7f7a" stroke-width="2" opacity="1"/><text x="88" y="278" font-family="Georgia, Times, serif" font-size="17" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">0  Find the job</text><text x="88" y="302" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">days 1-30</text><text x="88" y="330" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#9d4c3f" font-weight="normal" font-style="normal">gate:</text><text x="88" y="354" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">3 buyers</text><text x="88" y="378" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">same job</text><rect x="154" y="192" width="148" height="208" rx="8" fill="#e9e4cf" stroke="#4f7f7a" stroke-width="2" opacity="1"/><text x="228" y="220" font-family="Georgia, Times, serif" font-size="17" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">1  Paid pilots</text><text x="228" y="244" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">days 31-90</text><text x="228" y="272" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#9d4c3f" font-weight="normal" font-style="normal">gate:</text><text x="228" y="296" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">3 prepaid</text><text x="228" y="320" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">30% better</text><rect x="294" y="134" width="148" height="266" rx="8" fill="#e4ecd9" stroke="#4f7f7a" stroke-width="2" opacity="1"/><text x="368" y="162" font-family="Georgia, Times, serif" font-size="17" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">2  Repeatable</text><text x="368" y="186" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">months 4-12</text><text x="368" y="214" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#9d4c3f" font-weight="normal" font-style="normal">gate:</text><text x="368" y="238" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">10 paying</text><text x="368" y="262" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">80% renew</text><rect x="434" y="76" width="148" height="324" rx="8" fill="#d5e5dd" stroke="#4f7f7a" stroke-width="2" opacity="1"/><text x="508" y="104" font-family="Georgia, Times, serif" font-size="17" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">3  Runtime</text><text x="508" y="128" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">months 12-24</text><text x="508" y="156" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#9d4c3f" font-weight="normal" font-style="normal">gate:</text><text x="508" y="180" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">2nd workflow</text><text x="508" y="204" font-family="Georgia, Times, serif" font-size="15" text-anchor="middle" fill="#27231e" font-weight="normal" font-style="normal">in 4 weeks</text><text x="300" y="428" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">All thresholds are planning assumptions set in advance to be failed.</text></svg>