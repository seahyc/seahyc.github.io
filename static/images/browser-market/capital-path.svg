<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 446" width="600" height="446" role="img" aria-label="Capital needs by stage plus ScrapingBee and Browserbase precedents"><text x="300" y="30" font-family="Georgia, Times, serif" font-size="22" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">Money by stage, with two precedents</text><rect x="10" y="52" width="580" height="60" rx="8" fill="#f3ead9" stroke="none" stroke-width="0" opacity="1"/><text x="24" y="90" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Stage 0-1</text><text x="130" y="90" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#9d4c3f" font-weight="normal" font-style="normal">$5k-12k</text><text x="262" y="90" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">savings, then pilot fees</text><rect x="10" y="122" width="580" height="60" rx="8" fill="#f3ead9" stroke="none" stroke-width="0" opacity="1"/><text x="24" y="160" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Stage 2</text><text x="130" y="160" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#9d4c3f" font-weight="normal" font-style="normal">$100k-300k</text><text x="262" y="160" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">revenue, small angel or accelerator</text><rect x="10" y="192" width="580" height="60" rx="8" fill="#f3ead9" stroke="none" stroke-width="0" opacity="1"/><text x="24" y="230" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Stage 3</text><text x="130" y="230" font-family="Georgia, Times, serif" font-size="20" text-anchor="start" fill="#9d4c3f" font-weight="normal" font-style="normal">$1M-5M</text><text x="262" y="230" font-family="Georgia, Times, serif" font-size="17" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">venture only if reuse proven</text><text x="14" y="288" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Precedents (different shapes)</text><rect x="10" y="300" width="280" height="100" rx="8" fill="#e4ecd9" stroke="#4f7f7a" stroke-width="2" opacity="1"/><text x="24" y="330" font-family="Georgia, Times, serif" font-size="19" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">ScrapingBee</text><text x="24" y="356" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">$5M ARR, team of four,</text><text x="24" y="378" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">8-figure all-cash exit</text><rect x="310" y="300" width="280" height="100" rx="8" fill="#f1ddd6" stroke="#9d4c3f" stroke-width="2" opacity="1"/><text x="324" y="330" font-family="Georgia, Times, serif" font-size="19" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Browserbase</text><text x="324" y="356" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">~$67.5M raised (secondary),</text><text x="324" y="378" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">$40M Series B at $300M</text><text x="300" y="426" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">Stage amounts are assumptions. Precedents show shapes, not repeatability.</text></svg>