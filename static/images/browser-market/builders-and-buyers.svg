<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 462" width="600" height="462" role="img" aria-label="Bar charts of how respondents run scraping infrastructure and how their proxy spending changed"><text x="300" y="30" font-family="Georgia, Times, serif" font-size="21" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">Who builds, who buys, 2025 practitioner survey</text><text x="14" y="62" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">How scraping infrastructure is run</text><text x="190" y="100" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">In-house code only</text><rect x="200" y="76" width="256.85" height="30" rx="3" fill="#9d4c3f" stroke="none" stroke-width="0" opacity="1"/><text x="464.85" y="100" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">46.7%</text><text x="190" y="144" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">Mix of both</text><rect x="200" y="120" width="229.35000000000002" height="30" rx="3" fill="#b98a2e" stroke="none" stroke-width="0" opacity="1"/><text x="437.35" y="144" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">41.7%</text><text x="190" y="188" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">Unaware</text><rect x="200" y="164" width="36.85" height="30" rx="3" fill="#c9bda9" stroke="none" stroke-width="0" opacity="1"/><text x="244.85" y="188" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">6.7%</text><text x="190" y="232" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">External only</text><rect x="200" y="208" width="27.5" height="30" rx="3" fill="#4f7f7a" stroke="none" stroke-width="0" opacity="1"/><text x="235.5" y="232" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">5.0%</text><text x="14" y="290" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="bold" font-style="normal">Proxy spending over the past 12 months</text><text x="190" y="328" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">Increased</text><rect x="200" y="304" width="320.65" height="30" rx="3" fill="#9d4c3f" stroke="none" stroke-width="0" opacity="1"/><text x="528.65" y="328" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">58.3%</text><text x="190" y="372" font-family="Georgia, Times, serif" font-size="17" text-anchor="end" fill="#27231e" font-weight="normal" font-style="normal">Stable</text><rect x="200" y="348" width="155.65" height="30" rx="3" fill="#c9bda9" stroke="none" stroke-width="0" opacity="1"/><text x="363.65" y="372" font-family="Georgia, Times, serif" font-size="18" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">28.3%</text><text x="300" y="416" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">Self-selected sample ("hundreds"), mostly freelancers</text><text x="300" y="440" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">and small firms. Shares of respondents. Apify / Web Scraping Club, Dec 2025.</text></svg>