<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Gantt chart of seven actions across thirteen weeks"><text x="300" y="30" font-family="Georgia, Times, serif" font-size="22" text-anchor="middle" fill="#27231e" font-weight="bold" font-style="normal">First 90 days, by week</text><text x="204.0" y="58" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">W1</text><text x="316.0" y="58" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">W5</text><text x="428.0" y="58" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">W9</text><text x="540.0" y="58" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="normal">W13</text><text x="8" y="100" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Operator list, 15 calls</text><rect x="190" y="80" width="54" height="26" rx="4" fill="#4f7f7a" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="146" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Interviews, failure logs</text><rect x="218" y="126" width="82" height="26" rx="4" fill="#4f7f7a" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="192" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Test on real workload</text><rect x="246" y="172" width="54" height="26" rx="4" fill="#b98a2e" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="238" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Gate 0 decision</text><rect x="274" y="218" width="26" height="26" rx="4" fill="#9d4c3f" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="284" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Counsel: authorisation</text><rect x="302" y="264" width="54" height="26" rx="4" fill="#b98a2e" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="330" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">3 supervised pilots</text><rect x="302" y="310" width="166" height="26" rx="4" fill="#4f7f7a" stroke="none" stroke-width="0" opacity="1"/><text x="8" y="376" font-family="Georgia, Times, serif" font-size="16" text-anchor="start" fill="#27231e" font-weight="normal" font-style="normal">Renewal and Gate 1</text><rect x="470" y="356" width="82" height="26" rx="4" fill="#9d4c3f" stroke="none" stroke-width="0" opacity="1"/><text x="300" y="420" font-family="Georgia, Times, serif" font-size="16" text-anchor="middle" fill="#81766a" font-weight="normal" font-style="italic">Budget assumed: about $5,000 to $10,500 in total across the 13 weeks.</text></svg>