<svg xmlns="http://www.w3.org/2000/svg" width="600" height="532" viewBox="0 0 600 532" role="img" aria-labelledby="title desc"><title id="title">LOCATE THE REACHABLE HARM</title><desc id="desc">Conceptual synthesis; not a product benchmark.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#9d4c3f" text-anchor="start">LOCATE THE REACHABLE HARM</text><rect x="20" y="65" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="98" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Locate the contact before exposure</text><text x="38" y="130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Does it begin inside the buyer’s workflow?</text><path d="M300 152 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="173" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="206" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Establish observable outcomes</text><text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Can the buyer see what happened afterward?</text><path d="M300 260 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="281" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="314" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Name the intervention authority</text><text x="38" y="346" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Who may limit reach, review or checkpoint?</text><path d="M300 368 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="389" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Agree the operating boundaries</text><text x="38" y="454" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Permissions / retention / appeals / provenance</text><text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Discovery questions; public totals cannot answer them.</text></svg>