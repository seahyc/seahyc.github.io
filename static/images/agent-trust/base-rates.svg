<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img" aria-labelledby="title desc"><title id="title">Precision depends on prevalence and false positives</title><desc id="desc">Green is true positive, red false positive, with direct labels. Scenario expected counts, not classifier results.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#9d4c3f" text-anchor="start">RARE ABUSE MAKES ERRORS EXPENSIVE</text><text x="20" y="73" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6d6358" text-anchor="start">100,000 events • invented example</text><text x="20" y="108" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6d6358" text-anchor="start">0.1% abuse prevalence • 80% recall</text><text x="20" y="155" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">False-positive rate 0.10%</text><rect x="20" y="175" width="216.0" height="30" fill="#527367"/><rect x="236.0" y="175" width="269.73" height="30" fill="#9d4c3f"/><text x="20" y="239" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">80 true flags / 99.90 false flags</text><text x="20" y="271" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#527367" text-anchor="start">Precision: 44.47%</text><text x="20" y="300" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">False-positive rate 0.01%</text><rect x="20" y="320" width="216.0" height="30" fill="#527367"/><rect x="236.0" y="320" width="26.973000000000003" height="30" fill="#9d4c3f"/><text x="20" y="384" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">80 true flags / 9.99 false flags</text><text x="20" y="416" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#527367" text-anchor="start">Precision: 88.90%</text><text x="20" y="478" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Bar length = expected flagged events; zero origin.</text><text x="20" y="516" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Source: original scenario-model.json, 3 Nov 2026</text></svg>