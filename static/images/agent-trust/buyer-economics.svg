<svg xmlns="http://www.w3.org/2000/svg" width="600" height="552" viewBox="0 0 600 552" role="img" aria-labelledby="title desc"><title id="title">Buyer benefit versus proposed continuation hurdle</title><desc id="desc">Only high scenario exceeds proposed two-times-fee threshold; base fails despite vendor profitability.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#9d4c3f" text-anchor="start">CAN THE CUSTOMER JUSTIFY THE FEE?</text><text x="20" y="73" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6d6358" text-anchor="start">USD / month • invented buyer cases</text><text x="20" y="143" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">Low</text><rect x="100" y="115" width="35.0" height="38" fill="#9d4c3f"/><text x="145.0" y="143" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">$1,500</text><text x="20" y="233" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">Base</text><rect x="100" y="205" width="151.66666666666669" height="38" fill="#9d4c3f"/><text x="251.66666666666669" y="193" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="end">$6,500</text><text x="20" y="323" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">High</text><rect x="100" y="295" width="320.8333333333333" height="38" fill="#527367"/><text x="430.8333333333333" y="323" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">$13,750</text><path d="M333.3333333333333 100 V365" stroke="#27231e" stroke-width="2" stroke-dasharray="6 6"/><text x="20" y="407" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#27231e" text-anchor="start">Dashed: proposed 2× fee hurdle = $10,000</text><text x="20" y="447" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#9d4c3f" text-anchor="start">Base: $6,500 benefit / $5,000 fee = 1.30×</text><text x="20" y="490" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Zero-based scale, $0–$15,000. Before fee.</text><text x="20" y="529" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Source: original scenario-model.json, 3 Nov 2026</text></svg>