<svg xmlns="http://www.w3.org/2000/svg" width="600" height="532" viewBox="0 0 600 532" role="img" aria-labelledby="title desc"><title id="title">THE FIRST USEFUL INTERVENTION</title><desc id="desc">Conceptual synthesis; not a product benchmark.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#9d4c3f" text-anchor="start">THE FIRST USEFUL INTERVENTION</text><rect x="20" y="65" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="98" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Employer joins or changes representative</text><text x="38" y="130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Link company + claimed recruiter authority</text><path d="M300 152 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="173" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="206" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Listing or first contact is proposed</text><text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Compare mandate, history and action</text><path d="M300 260 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="281" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="314" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Evidence is incomplete or suspicious</text><text x="38" y="346" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Limit reach; route a reviewable case</text><path d="M300 368 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="389" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Customer decides; outcomes return</text><text x="38" y="454" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Appeals + sampled misses + updated policy</text><text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Proposed workflow. No pilot has run.</text></svg>