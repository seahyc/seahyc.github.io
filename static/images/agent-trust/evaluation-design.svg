<svg xmlns="http://www.w3.org/2000/svg" width="600" height="532" viewBox="0 0 600 532" role="img" aria-labelledby="title desc"><title id="title">TEST WITHOUT LEAKING THE ANSWER</title><desc id="desc">Conceptual synthesis; not a product benchmark.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#9d4c3f" text-anchor="start">TEST WITHOUT LEAKING THE ANSWER</text><rect x="20" y="65" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="98" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Use evidence available at decision time</text><text x="38" y="130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Keep later complaints out of earlier inputs</text><path d="M300 152 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="173" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="206" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Hold out later periods and campaigns</text><text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Repeated templates must not cross the split</text><path d="M300 260 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="281" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="314" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Inspect allowed traffic as well as flags</text><text x="38" y="346" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">An all-flagged queue cannot reveal misses</text><path d="M300 368 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="389" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Adjudicate outcomes independently</text><text x="38" y="454" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Match review effort and legitimate-user friction</text><text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Proposed evaluation design; no pilot was run.</text></svg>