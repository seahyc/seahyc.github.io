<svg xmlns="http://www.w3.org/2000/svg" width="600" height="530" viewBox="0 0 600 530" role="img" aria-labelledby="title desc"><title id="title">Singapore job-scam cases declined</title><desc id="desc">Zero-based annual count comparison. Half-year counts shown separately, never annualised. Reporting is not prevalence or platform exposure.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#9d4c3f" text-anchor="start">REPORTED JOB SCAMS IN SINGAPORE</text><text x="20" y="73" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#6d6358" text-anchor="start">Annual cases • calendar years • SPF</text><text x="20" y="142" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">2024</text><rect x="100" y="112" width="325.548" height="38" fill="#527367"/><text x="435.548" y="141" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">9,043</text><text x="20" y="232" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">2025</text><rect x="100" y="202" width="200.7" height="38" fill="#527367"/><text x="310.7" y="231" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">5,575</text><path d="M100 292 H460" stroke="#6d6358"/><text x="100.0" y="328" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#6d6358" text-anchor="middle">0</text><text x="280.0" y="328" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#6d6358" text-anchor="middle">5,000</text><text x="460.0" y="328" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#6d6358" text-anchor="middle">10,000</text><text x="20" y="382" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#9d4c3f" text-anchor="start">H1 comparison, kept separate:</text><text x="20" y="423" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">2025: 2,717 → 2026: 2,247 cases</tex