<svg xmlns="http://www.w3.org/2000/svg" width="600" height="532" viewBox="0 0 600 532" role="img" aria-labelledby="title desc"><title id="title">FOUR SEPARATE TRUST QUESTIONS</title><desc id="desc">Conceptual synthesis; not a product benchmark.</desc><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#9d4c3f" text-anchor="start">FOUR SEPARATE TRUST QUESTIONS</text><rect x="20" y="65" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="98" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Identity: who signed this request?</text><text x="38" y="130" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Signature → named key holder</text><path d="M300 152 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="173" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="206" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Authority: whom may they represent?</text><text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Mandate → person / company / action</text><path d="M300 260 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="281" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="314" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Intent: what are they trying to do?</text><text x="38" y="346" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Context → evidence of harmful behaviour</text><path d="M300 368 v20 m-6 -6 l6 6 6 -6" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="389" width="560" height="86" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="422" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#527367" text-anchor="start">Policy: what happens next?</text><text x="38" y="454" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Allow / limit / review / checkpoint</text><text x="20" y="520" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#6d6358" text-anchor="start">Identity is useful. It cannot settle all four questions.</text></svg>