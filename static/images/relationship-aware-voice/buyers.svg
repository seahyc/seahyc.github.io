<svg xmlns="http://www.w3.org/2000/svg" width="600" height="552" viewBox="0 0 600 552" role="img" aria-labelledby="title desc"><title id="title">BUYERS, TRUST AND PEOPLE</title><desc id="desc">Three panels listing first buyers and the ask, how credibility is built, and the first team roles.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >BUYERS, TRUST AND PEOPLE</text><rect x="20" y="54" width="560" height="150" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="86" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Who to reach first</text><text x="36" y="118" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Owner-led WhatsApp-first firms:</text><text x="36" y="144" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >tuition, home services, clinics</text><text x="36" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Warm path: the two interviewees</text><text x="36" y="196" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Ask: 100 chats for a graded audit</text><rect x="20" y="220" width="560" height="150" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="252" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">How a newcomer earns trust</text><text x="36" y="284" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Publish the method and the numbers</text><text x="36" y="310" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Open-source the local composer</text><text x="36" y="336" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Show where the data boundary is</text><text x="36" y="362" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Design partners who grade outputs</text><rect x="20" y="386" width="560" height="150" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="418" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">People to add</text><text x="36" y="450" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Founder: product + eval design</text><text x="36" y="476" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Hire: conversation-quality grader</text><text x="36" y="502" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Advisor: inbox-product operator</text><text x="36" y="528" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Later: integration engineer</text></svg>