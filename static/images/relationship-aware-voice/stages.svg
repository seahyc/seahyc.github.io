<svg xmlns="http://www.w3.org/2000/svg" width="600" height="556" viewBox="0 0 600 556" role="img" aria-labelledby="title desc"><title id="title">FOUR STAGES, EACH GATED</title><desc id="desc">Staged sequence from personal composer to AI sales desk with a gate for each stage.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >FOUR STAGES, EACH GATED</text><rect x="20" y="54" width="560" height="104" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="84" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">0 · Personal composer</text><text x="36" y="112" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >local, open source, no sending</text><text x="36" y="140" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Gate: B wins ≥70%</text><rect x="50" y="172" width="530" height="104" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="66" y="202" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">1 · Conversation audit</text><text x="66" y="230" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >paid, 100 chats × 2 firms</text><text x="66" y="258" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Gate: owner sees new misses</text><rect x="80" y="290" width="500" height="104" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="96" y="320" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">2 · Drafting layer</text><text x="96" y="348" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >human-approved, in their inbox</text><text x="96" y="376" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Gate: acceptance, renewal</text><rect x="110" y="408" width="470" height="104" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="126" y="438" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9d4c3f" text-anchor="start" font-weight="bold">3 · AI sales desk</text><text x="126" y="466" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >stage-aware policy + console</text><text x="126" y="494" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Gate: renewals first</text><text x="20" y="540" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Each stage must earn the next.</text></svg>