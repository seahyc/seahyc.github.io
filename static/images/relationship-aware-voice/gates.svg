<svg xmlns="http://www.w3.org/2000/svg" width="600" height="626" viewBox="0 0 600 626" role="img" aria-labelledby="title desc"><title id="title">MONEY, PAYOUT AND STOP RULES</title><desc id="desc">Per-stage money sources, founder payout and stop conditions.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >MONEY, PAYOUT, STOP RULES</text><rect x="20" y="54" width="560" height="122" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="84" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Stage 0</text><text x="36" y="112" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Money: savings</text><text x="36" y="138" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Paid: nothing</text><text x="36" y="164" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Stop: B under 70%, or A ≈ B</text><rect x="20" y="190" width="560" height="122" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="220" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Stage 1</text><text x="36" y="248" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Money: audit fees</text><text x="36" y="274" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Paid: audit fees</text><text x="36" y="300" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Stop: no new issue found</text><rect x="20" y="326" width="560" height="122" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="356" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Stage 2</text><text x="36" y="384" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Money: pilot fees, grant*</text><text x="36" y="410" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Paid: salary from fees</text><text x="36" y="436" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Stop: low acceptance, no renewal</text><rect x="20" y="462" width="560" height="122" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="492" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Stage 3</text><text x="36" y="520" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Money: recurring fees, angel</text><text x="36" y="546" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Paid: salary, equity</text><text x="36" y="572" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Stop: churn, no renewals</text><text x="20" y="608" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#6d6358" text-anchor="start" >*Grant terms unverified; see text.</text></svg>