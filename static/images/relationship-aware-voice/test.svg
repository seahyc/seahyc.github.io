<svg xmlns="http://www.w3.org/2000/svg" width="600" height="520" viewBox="0 0 600 520" role="img" aria-labelledby="title desc"><title id="title">THE CHEAPEST DECISIVE TEST</title><desc id="desc">Flow of the proposed blind A versus B drafting test with advance and kill conditions.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >THE CHEAPEST DECISIVE TEST</text><rect x="20" y="52" width="560" height="84" rx="8" fill="none" stroke="#6d6358" stroke-width="2"/><text x="36" y="80" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >5 people × 3+ channels × 20 real intents</text><text x="36" y="106" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Local, read-only prototype.</text><text x="36" y="128" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >No message is sent.</text><path d="M160 138 V170 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><path d="M440 138 V170 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="174" width="270" height="92" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="204" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#527367" text-anchor="start" font-weight="bold">A · generic</text><text x="36" y="230" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >“write like me” +</text><text x="36" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >recent thread</text><rect x="310" y="174" width="270" height="92" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="326" y="204" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="start" font-weight="bold">B · conditioned</text><text x="326" y="230" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >baseline + channel +</text><text x="326" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >this person’s examples</text><path d="M300 268 V298 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="60" y="302" width="480" height="50" rx="8" fill="none" stroke="#6d6358" stroke-width="2"/><text x="300" y="334" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="middle" >Blind pick of the more sendable draft</text><path d="M160 354 V384 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><path d="M440 354 V384 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="388" width="270" height="110" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="418" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#527367" text-anchor="start" font-weight="bold">Advance if</text><text x="36" y="444" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >B wins ≥70% of picks,</text><text x="36" y="468" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >and time-to-send or</text><text x="36" y="490" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >edits fall in a week</text><rect x="310" y="388" width="270" height="110" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="326" y="418" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="start" font-weight="bold">Kill or reshape if</text><text x="326" y="444" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >thread context alone</text><text x="326" y="468" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >does as well (A ≈ B)</text></svg>