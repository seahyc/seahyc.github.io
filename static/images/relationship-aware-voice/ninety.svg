<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" role="img" aria-labelledby="title desc"><title id="title">THE FIRST NINETY DAYS</title><desc id="desc">Three-phase thirteen week plan with actions and the evidence each produces.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >THE FIRST NINETY DAYS</text><rect x="20" y="52" width="560" height="180" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="84" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Weeks 1–4</text><text x="200" y="84" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="start" font-weight="bold">Build the test</text><text x="36" y="118" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Read-only local</text><text x="36" y="144" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >prototype</text><text x="36" y="170" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >5 people, 3+ channels</text><text x="36" y="196" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >20 intents each</text><rect x="20" y="248" width="560" height="180" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="280" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Weeks 5–8</text><text x="200" y="280" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="start" font-weight="bold">Run it</text><text x="36" y="314" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Blind A/B, pooled</text><text x="36" y="340" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Edit-time log</text><text x="36" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Ask 2 firms for</text><text x="36" y="392" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >100 chats each</text><rect x="20" y="444" width="560" height="180" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="476" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Weeks 9–13</text><text x="200" y="476" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="start" font-weight="bold">Decide, sell</text><text x="36" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Apply the 70% gate</text><text x="36" y="536" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >2 graded audits</text><text x="36" y="562" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Ask for a paid</text><text x="36" y="588" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >pilot, or write</text><text x="36" y="614" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >up the kill</text><rect x="20" y="636" width="560" height="100" rx="8" fill="none" stroke="#6d6358" stroke-width="2"/><text x="36" y="666" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Evidence out: blind-choice table, edit log,</text><text x="36" y="692" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >two graded audits, and a signed pilot</text><text x="36" y="718" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >request or a documented kill.</text></svg>