<svg xmlns="http://www.w3.org/2000/svg" width="600" height="561" viewBox="0 0 600 561" role="img" aria-labelledby="title desc"><title id="title">ONE INTENT, THREE VOICES</title><desc id="desc">Illustrative demo of one intent rendered for three recipient and channel pairs.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >ONE INTENT, THREE VOICES</text><rect x="20" y="52" width="560" height="62" rx="8" fill="none" stroke="#6d6358" stroke-width="2"/><text x="36" y="78" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Intent: “I’m running 20 minutes late.</text><text x="36" y="101" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Apologize and ask if that still works.”</text><path d="M300 116 V136 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="140" width="560" height="90" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="168" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#527367" text-anchor="start" font-weight="bold">Partner · WhatsApp</text><text x="36" y="196" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >sorry love, got held up (crying face)</text><text x="36" y="221" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >20 mins? I’ll grab dinner on the way</text><path d="M300 236 V256 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="260" width="560" height="115" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="288" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#527367" text-anchor="start" font-weight="bold">Manager · Slack</text><text x="36" y="316" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Running ~20m late—the previous call</text><text x="36" y="341" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >overran. I’ll join at 3:20 and send</text><text x="36" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >the notes first.</text><path d="M300 381 V401 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="20" y="405" width="560" height="140" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="433" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#527367" text-anchor="start" font-weight="bold">Recruiter · LinkedIn</text><text x="36" y="461" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Apologies, I’m running about 20 minutes</text><text x="36" y="486" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >behind. Would 3:20 still work for you?</text><text x="36" y="511" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >Completely understand if we should</text><text x="36" y="536" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#27231e" text-anchor="start" >reschedule.</text></svg>