<svg xmlns="http://www.w3.org/2000/svg" width="600" height="512" viewBox="0 0 600 512" role="img" aria-labelledby="title desc"><title id="title">FOUR INPUTS, ONE DRAFT</title><desc id="desc">Diagram of the proposed composer: four conditioning inputs produce one draft and an edit loop updates the relationship profile.</desc><text x="20" y="34" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#9d4c3f" text-anchor="start" >FOUR INPUTS, ONE DRAFT</text><rect x="20" y="56" width="275" height="84" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="90" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Baseline voice</text><text x="34" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >your sent messages</text><rect x="305" y="56" width="275" height="84" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="319" y="90" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">Channel habits</text><text x="319" y="120" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >WhatsApp vs Slack</text><rect x="20" y="152" width="275" height="84" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="186" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">This person</text><text x="34" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >examples sent to them</text><rect x="305" y="152" width="275" height="84" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="319" y="186" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#527367" text-anchor="start" font-weight="bold">The thread</text><text x="319" y="216" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#27231e" text-anchor="start" >plus your intent</text><path d="M300 246 V278 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="110" y="282" width="380" height="56" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="300" y="318" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#9d4c3f" text-anchor="middle" >One draft (+ optional alternate)</text><path d="M300 340 V372 m-6 -7 l6 7 l6 -7" fill="none" stroke="#6d6358" stroke-width="2"/><rect x="110" y="376" width="380" height="56" rx="8" fill="none" stroke="#6d6358" stroke-width="2"/><text x="300" y="412" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#27231e" text-anchor="middle" >You edit it and send it yourself</text><path d="M490 404 H575 V310 H495" fill="none" stroke="#8a6a1c" stroke-width="2" stroke-dasharray="6 4"/><path d="M503 303 l-10 7 l10 7" fill="none" stroke="#8a6a1c" stroke-width="2"/><text x="584" y="350" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#8a6a1c" text-anchor="end" >edit</text><text x="584" y="374" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#8a6a1c" text-anchor="end" >delta</text><text x="20" y="470" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >Dashed loop: your edits update only this</text><text x="20" y="494" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#6d6358" text-anchor="start" >relationship’s local profile. Proposed, not built.</text></svg>