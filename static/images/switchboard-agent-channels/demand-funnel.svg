<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 482" width="600" height="482" role="img" aria-label="Funnel bars: 10 prospects, at least 3 qualified replies, at least 2 agree to connect a sender, at least 1 accepts paid terms."><title>Funnel bars: 10 prospects, at least 3 qualified replies, at least 2 agree to connect a sender, at least 1 accepts paid terms.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">Demand test thresholds, set before running</text><text x="24" y="70" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Prospects approached</text><rect x="24" y="84" width="400" height="26" fill="#4f7391"/><text x="434" y="104" font-family="Arial,Helvetica,sans-serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">10</text><line x1="24" y1="84" x2="24" y2="110" stroke="#27231e" stroke-width="1.5"/><text x="24" y="146" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Qualified replies</text><rect x="24" y="160" width="120" height="26" fill="#4f7391"/><text x="154" y="180" font-family="Arial,Helvetica,sans-serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">3 or more</text><line x1="24" y1="160" x2="24" y2="186" stroke="#27231e" stroke-width="1.5"/><text x="24" y="222" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Agree to connect a real sender</text><rect x="24" y="236" width="80" height="26" fill="#4f7391"/><text x="114" y="256" font-family="Arial,Helvetica,sans-serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">2 or more</text><line x1="24" y1="236" x2="24" y2="262" stroke="#27231e" stroke-width="1.5"/><text x="24" y="298" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Accept paid-pilot terms</text><rect x="24" y="312" width="40" height="26" fill="#4f7391"/><text x="74" y="332" font-family="Arial,Helvetica,sans-serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">1 or more</text><line x1="24" y1="312" x2="24" y2="338" stroke="#27231e" stroke-width="1.5"/><rect x="24" y="364" width="552" height="74" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="6 4"/><text x="300.0" y="392" font-family="Georgia,Times,serif" font-size="22.0" fill="#9d4c3f" text-anchor="middle" font-weight="normal">Fail if fewer than 2 teams will connect a sender,</text><text x="300.0" y="416" font-family="Georgia,Times,serif" font-size="22.0" fill="#9d4c3f" text-anchor="middle" font-weight="normal">or everyone asks only for source code.</text><text x="300" y="468" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Bars start at zero. Thresholds are the research notes' gate MIH-01.</text></svg>