<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 392" width="600" height="392" role="img" aria-label="Bar chart of derived monthly price per sender: IGdm 3 dollars, DMnode Growth 20, DMnode Starter 50, HeyReach 79, and an untested Switchboard idea at 499."><title>Bar chart of derived monthly price per sender: IGdm 3 dollars, DMnode Growth 20, DMnode Starter 50, HeyReach 79, and an untested Switchboard idea at 499.</title><text x="300" y="26" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">Price per sender per month, USD (derived)</text><text x="190" y="72" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">IGdm Standard</text><rect x="200" y="56" width="3.0" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="211" y="74" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$3.00</text><text x="190" y="114" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">DMnode Growth</text><rect x="200" y="98" width="12.0" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="220.0" y="116" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$20</text><text x="190" y="156" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">DMnode Starter</text><rect x="200" y="140" width="30.0" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="238.0" y="158" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$50</text><text x="190" y="198" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">HeyReach Growth</text><rect x="200" y="182" width="47.4" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="255.4" y="200" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$79</text><text x="190" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">Switchboard idea</text><rect x="200" y="224" width="299.4" height="24" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="5 3"/><text x="507.4" y="242" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$499</text><line x1="200" y1="46" x2="200" y2="262" stroke="#27231e" stroke-width="1.5"/><text x="300" y="288" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Plan price divided by senders: $8.99 / 3, $500 / 25.</text><text x="300" y="314" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">DMnode lists self-serve sending; mine is concierge</text><text x="300" y="340" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">and human-approved. That is the claim to test.</text><text x="300" y="366" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Bars start at $0.</text></svg>