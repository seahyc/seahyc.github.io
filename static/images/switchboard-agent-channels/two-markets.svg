<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-label="Two columns contrasting automation-build buyers and creator-relationship labour buyers, plus a bar comparing a 499 dollar managed price idea to 650 to 780 dollars of monthly assistant labour."><title>Two columns contrasting automation-build buyers and creator-relationship labour buyers, plus a bar comparing a 499 dollar managed price idea to 650 to 780 dollars of monthly assistant labour.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">Two different markets in the marketplace scan</text><rect x="14" y="48" width="276" height="36" rx="8" fill="#d3e0ea" stroke="#27231e" stroke-width="2"/><text x="152.0" y="68" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="bold">Automation builds</text><rect x="310" y="48" width="276" height="36" rx="8" fill="#e9c9bf" stroke="#27231e" stroke-width="2"/><text x="448.0" y="68" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="bold">Relationship labour</text><text x="30" y="116" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Buyers accept software</text><text x="30" y="144" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Want: resumable chats,</text><text x="30" y="172" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">deterministic actions,</text><text x="30" y="200" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">CRM state, upkeep</text><text x="30" y="228" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Budgets seen: $250 to</text><text x="30" y="256" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">$1,200 fixed, hourly</text><text x="30" y="284" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Easiest near-term revenue</text><text x="326" y="116" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Buyers pay humans</text><text x="326" y="144" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Want: research, follow-up,</text><text x="326" y="172" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">memory, a natural voice</text><text x="326" y="200" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Some ban bots outright</text><text x="326" y="228" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Budgets seen: $5 to $6/hr</text><text x="326" y="256" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">up to $1,500 fixed</text><text x="326" y="284" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Validates tone, not autosend</text><text x="300" y="340" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="bold">Monthly cost of one outreach assistant, 30 h/week, USD</text><rect x="60.0" y="356" width="240" height="26" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="5 3"/><text x="66.0" y="375" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#9d4c3f" text-anchor="start" font-weight="normal">$499 idea</text><rect x="60.0" y="394" width="312" height="26" fill="#4f7391" opacity=".35"/><rect x="372.0" y="394" width="62" height="26" fill="#4f7391"/><text x="441.91999999999996" y="414" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$650 to $780</text><text x="66" y="444" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="start" font-weight="normal">Assistant: $5 to $6/hr x 30 h x 4.33 weeks.</text><text x="66" y="468" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="start" font-weight="normal">Excludes management time.</text><line x1="60.0" y1="350" x2="60.0" y2="424" stroke="#27231e" stroke-width="1.5"/><text x="300" y="498" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Scan of live listings, 3 Sep 2026; counts are</text><text x="300" y="522" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">contaminated, scopes are the signal.</text></svg>