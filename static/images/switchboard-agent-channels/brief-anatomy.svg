<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 556" width="600" height="556" role="img" aria-label="The buyer's brief as a pipeline: submit a list, vendor owns sending and recovery, targets end in states, replies return by webhook. One-off scripts are rejected."><title>The buyer's brief as a pipeline: submit a list, vendor owns sending and recovery, targets end in states, replies return by webhook. One-off scripts are rejected.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">What the buyer's brief asks the vendor to own</text><text x="24" y="84" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#6b6157" text-anchor="start" font-weight="bold">You submit</text><rect x="210" y="50" width="366" height="74" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="393.0" y="78" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">Vetted creator profiles,</text><text x="393.0" y="102" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">a message, campaign settings</text><line x1="393" y1="124" x2="393" y2="146" stroke="#27231e" stroke-width="2.5"/><polygon points="393,146 387,135 399,135" fill="#27231e"/><text x="24" y="180" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#6b6157" text-anchor="start" font-weight="bold">Vendor owns</text><rect x="210" y="146" width="366" height="74" rx="8" fill="#e9c9bf" stroke="#27231e" stroke-width="2"/><text x="393.0" y="174" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">Sender setup, pacing, health,</text><text x="393.0" y="198" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">recovery, deduplication, upkeep</text><line x1="393" y1="220" x2="393" y2="242" stroke="#27231e" stroke-width="2.5"/><polygon points="393,242 387,231 399,231" fill="#27231e"/><text x="24" y="276" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#6b6157" text-anchor="start" font-weight="bold">Target ends as</text><rect x="210" y="242" width="366" height="74" rx="8" fill="#dbe6d2" stroke="#27231e" stroke-width="2"/><text x="393.0" y="282" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">sent, failed, skipped or replied</text><line x1="393" y1="316" x2="393" y2="338" stroke="#27231e" stroke-width="2.5"/><polygon points="393,338 387,327 399,327" fill="#27231e"/><text x="24" y="372" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#6b6157" text-anchor="start" font-weight="bold">You receive</text><rect x="210" y="338" width="366" height="74" rx="8" fill="#d3e0ea" stroke="#27231e" stroke-width="2"/><text x="393.0" y="366" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">Reply and status events by API,</text><text x="393.0" y="390" font-family="Georgia,Times,serif" font-size="22.0" fill="#27231e" text-anchor="middle" font-weight="normal">webhook, export or inbox</text><rect x="24" y="446" width="552" height="62" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="6 4"/><text x="300.0" y="468" font-family="Georgia,Times,serif" font-size="22.0" fill="#9d4c3f" text-anchor="middle" font-weight="normal">Not accepted: a one-off script, a repo, a browser bot</text><text x="300.0" y="492" font-family="Georgia,Times,serif" font-size="22.0" fill="#9d4c3f" text-anchor="middle" font-weight="normal">the buyer has to run and maintain</text><text x="300" y="536" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Source: buyer's public post and linked brief (paraphrased), 30 May 2026.</text></svg>