<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 478" width="600" height="478" role="img" aria-label="Five inputs combine into one human-approved message. A counter-signal box notes buyers who ban AI messaging."><title>Five inputs combine into one human-approved message. A counter-signal box notes buyers who ban AI messaging.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">A message is built from five inputs</text><rect x="14" y="50" width="300" height="42" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="164.0" y="73" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">Relationship with this person</text><line x1="314" y1="71" x2="388" y2="71" stroke="#27231e" stroke-width="1.5"/><rect x="14" y="102" width="300" height="42" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="164.0" y="125" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">Sender persona</text><line x1="314" y1="123" x2="388" y2="123" stroke="#27231e" stroke-width="1.5"/><rect x="14" y="154" width="300" height="42" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="164.0" y="177" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">Channel norms</text><line x1="314" y1="175" x2="388" y2="175" stroke="#27231e" stroke-width="1.5"/><rect x="14" y="206" width="300" height="42" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="164.0" y="229" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">Campaign goal</text><line x1="314" y1="227" x2="388" y2="227" stroke="#27231e" stroke-width="1.5"/><rect x="14" y="258" width="300" height="42" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="164.0" y="281" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">Recent profile evidence</text><line x1="314" y1="279" x2="388" y2="279" stroke="#27231e" stroke-width="1.5"/><line x1="388" y1="71" x2="388" y2="279" stroke="#27231e" stroke-width="1.5"/><line x1="388" y1="175" x2="408" y2="175" stroke="#27231e" stroke-width="2.5"/><polygon points="420,175 407,168 407,182" fill="#27231e"/><rect x="420" y="140" width="166" height="70" rx="8" fill="#dbe6d2" stroke="#27231e" stroke-width="2"/><text x="503.0" y="166" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">One message,</text><text x="503.0" y="189" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="middle" font-weight="normal">human-approved</text><rect x="14" y="330" width="572" height="96" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="6 4"/><text x="300.0" y="357" font-family="Georgia,Times,serif" font-size="20.7" fill="#9d4c3f" text-anchor="middle" font-weight="normal">Counter-signal: some creator-relationship buyers</text><text x="300.0" y="380" font-family="Georgia,Times,serif" font-size="20.7" fill="#9d4c3f" text-anchor="middle" font-weight="normal">ban AI-heavy messaging or any software.</text><text x="300.0" y="403" font-family="Georgia,Times,serif" font-size="20.7" fill="#9d4c3f" text-anchor="middle" font-weight="normal">So: assistive memory plus human approval first.</text><text x="300" y="462" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Formula from the strategy notes; uplift is untested.</text></svg>