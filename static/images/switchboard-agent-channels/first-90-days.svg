<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 468" width="600" height="468" role="img" aria-label="Gantt-style timeline across 13 weeks: packaging, marketplace probes, building a campaign layer, a 14-day live pilot, then a decision."><title>Gantt-style timeline across 13 weeks: packaging, marketplace probes, building a campaign layer, a 14-day live pilot, then a decision.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">Proposed first 90 days (week 0 to 13)</text><text x="24" y="68" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Package the offer, shortlist 10 prospects</text><rect x="24" y="76" width="85" height="20" rx="4" fill="#4f7391"/><text x="24" y="136" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Marketplace probes, 3 tailored bids</text><rect x="66" y="144" width="170" height="20" rx="4" fill="#4f7391"/><text x="24" y="204" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Thin campaign layer on the connector</text><rect x="109" y="212" width="212" height="20" rx="4" fill="#5d7a52"/><text x="24" y="272" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Live pilot, 14-day window</text><rect x="321" y="280" width="170" height="20" rx="4" fill="#c58a2b"/><text x="24" y="340" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">Read results, decide</text><rect x="491" y="348" width="85" height="20" rx="4" fill="#9d4c3f"/><text x="24.0" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">W0</text><text x="193.84615384615384" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">W4</text><text x="363.6923076923077" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">W8</text><text x="576.0" y="400" font-family="Arial,Helvetica,sans-serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">W13</text><line x1="24" y1="378" x2="576" y2="378" stroke="#27231e" stroke-width="1.5"/><text x="300" y="426" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Only the 14-day window and the one-build-cycle cap come from the notes.</text><text x="300" y="454" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Week placements are my assumptions.</text></svg>