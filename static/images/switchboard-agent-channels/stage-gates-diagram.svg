<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 580" width="600" height="580" role="img" aria-label="Four sequential gates with pre-set thresholds and a kill condition."><title>Four sequential gates with pre-set thresholds and a kill condition.</title><text x="300" y="28" font-family="Georgia,Times,serif" font-size="24.4" fill="#27231e" text-anchor="middle" font-weight="bold">Four gates, each with a number set in advance</text><rect x="14" y="50" width="560" height="80" rx="8" fill="#dbe6d2" stroke="#27231e" stroke-width="2"/><text x="28" y="81" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Offer  (MIH-01)</text><text x="28" y="104" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">3 replies, 2 connect, 1 accepts</text><rect x="44" y="150" width="530" height="80" rx="8" fill="#e8dcc6" stroke="#27231e" stroke-width="2"/><text x="58" y="181" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Fulfilment  (MIH-02)</text><text x="58" y="204" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">90% of 50 targets reach a valid end state</text><rect x="74" y="250" width="500" height="80" rx="8" fill="#d3e0ea" stroke="#27231e" stroke-width="2"/><text x="88" y="281" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Voice  (MIH-03)</text><text x="88" y="304" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">fewer edits, more positive replies</text><rect x="104" y="350" width="470" height="80" rx="8" fill="#efd7cf" stroke="#27231e" stroke-width="2"/><text x="118" y="381" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">Pay  (MIH-04)</text><text x="118" y="404" font-family="Georgia,Times,serif" font-size="20.7" fill="#27231e" text-anchor="start" font-weight="normal">1 customer pays the next month</text><rect x="14" y="460" width="572" height="76" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="6 4"/><text x="300.0" y="489" font-family="Georgia,Times,serif" font-size="20.7" fill="#9d4c3f" text-anchor="middle" font-weight="normal">Kill: only a repo wanted, no real account connected,</text><text x="300.0" y="512" font-family="Georgia,Times,serif" font-size="20.7" fill="#9d4c3f" text-anchor="middle" font-weight="normal">or no one pays after a good campaign.</text><text x="300" y="566" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">From the research notes' experiment table; the voice test is small-sample.</text></svg>