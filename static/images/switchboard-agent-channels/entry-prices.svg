 sender</text><rect x="232" y="182" width="23.7" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="263.7" y="200" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$79</text><text x="222" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">Modash Essentials</text><rect x="232" y="224" width="59.7" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="299.7" y="242" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$199</text><text x="222" y="282" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">Switchboard idea</text><rect x="232" y="266" width="149.7" height="24" fill="none" stroke="#9d4c3f" stroke-width="2" stroke-dasharray="5 3"/><text x="389.7" y="284" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$499</text><text x="222" y="324" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">DMnode Growth</text><rect x="232" y="308" width="150.0" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="390.0" y="326" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$500</text><text x="222" y="366" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="end" font-weight="normal">HeyReach Agency</text><rect x="232" y="350" width="299.7" height="24" fill="#4f7391" stroke="#4f7391" stroke-width="2"/><text x="539.7" y="368" font-family="Arial,Helvetica,sans-serif" font-size="19.5" fill="#27231e" text-anchor="start" font-weight="normal">$999</text><line x1="232" y1="46" x2="232" y2="388" stroke="#27231e" stroke-width="1.5"/><text x="300" y="412" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Bars start at $0. Units differ: seats, accounts, senders, workspaces.</text><text x="300" y="438" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Modash is the annual-billing rate. Dashed bar is my untested hypothesis.</text><text x="300" y="464" font-family="Georgia,Times,serif" font-size="18.3" fill="#6b6157" text-anchor="middle" font-weight="normal">Pages read 21 Nov 2026; prices change.</text></svg>