<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Air-bearing cross section</title>
  <desc id="desc">Compressed air enters restrictors and creates a thin film between opposed pads and a moving carriage. The carriage is supported without ordinary rubbing contact.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9d4c3f"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" fill="#27231e">
    <text x="54" y="62" font-size="28" font-weight="700" letter-spacing="2">THE FLOATING INTERFACE</text>
    <text x="55" y="94" font-size="18" fill="#81766a">A bearing removes rubbing contact; the stage still needs structure, drive, sensing, and control.</text>
    <rect x="172" y="222" width="856" height="166" rx="24" fill="#d9c8b1" stroke="#27231e" stroke-width="5" transform="rotate(-1 600 305)"/>
    <path d="M215 365L985 365" stroke="#9d4c3f" stroke-width="8" opacity=".7"/>
    <text x="469" y="300" font-size="30" font-weight="700">MOVING CARRIAGE</text>
    <text x="487" y="333" font-size="18" fill="#81766a">payload + tooling</text>
    <g fill="#a86e58" stroke="#27231e" stroke-width="4"><rect x="245" y="389" width="188" height="64" rx="12"/><rect x="767" y="389" width="188" height="64" rx="12"/></g>
    <text x="263" y="429" font-size="19" fill="#fff">opposed pad</text><text x="785" y="429" font-size="19" fill="#fff">opposed pad</text>
    <path d="M265 462C370 476 830 476 935 462" stroke="#9d4c3f" stroke-width="10" stroke-dasharray="5 14" marker-end="url(#arrow)"/>
    <text x="455" y="516" font-size="24" font-weight="700" fill="#9d4c3f">thin air film · no ordinary contact</text>
    <path d="M135 632H1065" stroke="#5b5148" stroke-width="8"/><path d="M189 621L161 704H1039L1011 621Z" fill="#8e8578" stroke="#27231e" stroke-width="5"/>
    <text x="467" y="685" font-size="25" font-weight="700" fill="#fff">STIFF BASE / GRANITE</text>
    <path d="M89 136C170 136 205 170 245 222" fill="none" stroke="#9d4c3f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="54" y="126" font-size="20" font-weight="700">filtered compressed air</text><text x="54" y="153" font-size="17" fill="#81766a">pressure + restrictor geometry set the film</text>
    <path d="M1054 185C1000 190 968 207 930 222" fill="none" stroke="#9d4c3f" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="838" y="142" font-size="20" font-weight="700">drive + encoder</text><text x="838" y="169" font-size="17" fill="#81766a">turns floating pads into a stage</text>
  </g>
</svg>
