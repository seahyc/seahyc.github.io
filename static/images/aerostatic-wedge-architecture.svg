<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Architecture and wedge comparison</title>
  <desc id="desc">A split comparison: a lithography tool is an integrated magnetic stage with optics, sensors, and control; the proposed first wedge is a customer-specified aerostatic module for packaging and metrology.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9d4c3f"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" fill="#27231e">
    <text x="54" y="54" font-size="27" font-weight="700" letter-spacing="2">DON’T CONFUSE PRECISION WITH A WEDGE</text>
    <text x="55" y="85" font-size="18" fill="#81766a">The reference machine is integrated; the first product can own one measurable motion problem.</text>
    <rect x="48" y="128" width="513" height="555" rx="22" fill="#e4d5c2" stroke="#9d4c3f" stroke-width="4"/><rect x="591" y="128" width="561" height="555" rx="22" fill="#d9e6df" stroke="#527f78" stroke-width="4"/>
    <text x="86" y="177" font-size="23" font-weight="700">SUB-2NM LITHOGRAPHY</text><text x="86" y="208" font-size="17" fill="#81766a">integrated magnetic architecture</text>
    <g stroke="#27231e" stroke-width="4"><rect x="125" y="280" width="352" height="102" rx="12" fill="#9eafba"/><rect x="174" y="242" width="255" height="32" rx="8" fill="#d0b88e"/><rect x="177" y="403" width="248" height="62" rx="8" fill="#af8a70"/><rect x="115" y="489" width="372" height="38" rx="8" fill="#8e8578"/></g>
    <text x="200" y="305" font-size="18">wafer stage</text><text x="208" y="431" font-size="18">magnetic drive</text><text x="194" y="515" font-size="18" fill="#fff">metrology base</text>
    <g font-size="16" fill="#27231e"><text x="88" y="574">optics + sensors + control</text><text x="88" y="602">qualification history + service</text><text x="88" y="630" fill="#9d4c3f" font-weight="700">not a generic replacement slot</text></g>
    <text x="629" y="177" font-size="23" font-weight="700">PACKAGING / 3D METROLOGY</text><text x="629" y="208" font-size="17" fill="#527f78">customer-specified module wedge</text>
    <g stroke="#27231e" stroke-width="4"><rect x="665" y="282" width="414" height="101" rx="12" fill="#d9c8b1"/><rect x="713" y="243" width="319" height="29" rx="8" fill="#b9d4d0"/><rect x="744" y="405" width="255" height="55" rx="8" fill="#a86e58"/><rect x="646" y="492" width="447" height="38" rx="8" fill="#8e8578"/></g>
    <text x="789" y="309" font-size="18">payload plate</text><text x="795" y="438" font-size="18" fill="#fff">air pads + motor</text><text x="806" y="518" font-size="18" fill="#fff">stable base</text>
    <path d="M868 554V620" stroke="#527f78" stroke-width="5" marker-end="url(#arrow)"/><text x="697" y="581" font-size="17">one error budget</text><text x="697" y="605" font-size="17">one witness test</text><text x="697" y="653" font-size="18" font-weight="700" fill="#527f78">sell the acceptance result</text>
    <path d="M561 405H591" stroke="#9d4c3f" stroke-width="5" marker-end="url(#arrow)"/><text x="538" y="372" font-size="17" fill="#9d4c3f" transform="rotate(-90 538 372)">narrow the claim</text>
  </g>
</svg>
