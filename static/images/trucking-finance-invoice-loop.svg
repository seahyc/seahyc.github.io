<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d"><title id="t">Freight invoice to cash workflow</title><desc id="d">A reconstructed workflow from completed load through proof of delivery, invoice, audit, funding and reconciliation.</desc><rect width="1200" height="540" fill="#f3eadb"/><style>text{font-family:Arial,sans-serif;fill:#27231e}.k{font-size:19px;font-weight:700;letter-spacing:1.6px}.s{font-size:16px;fill:#62594e}.n{font-size:42px;font-weight:700;fill:#9d4c3f}.box{fill:#fbf5e9;stroke:#81766a;stroke-width:2}.arrow{stroke:#315746;stroke-width:5;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#315746"/></marker></defs><text x="60" y="68" class="k">RECONSTRUCTED OPERATING LOOP · NOT A PRODUCT SCREENSHOT</text><text x="60" y="112" class="s">The data asset is created before the financing decision—not after it.</text><g transform="translate(60 185)"><rect class="box" width="180" height="155" rx="14"/><text class="n" x="20" y="52">01</text><text class="k" x="20" y="91">LOAD</text><text class="s" x="20" y="120">delivery event</text></g><path class="arrow" d="M245 262h65"/><g transform="translate(320 185)"><rect class="box" width="180" height="155" rx="14"/><text class="n" x="20" y="52">02</text><text class="k" x="20" y="91">POD</text><text class="s" x="20" y="120">proof, validation</text></g><path class="arrow" d="M505 262h65"/><g transform="translate(580 185)"><rect class="box" width="180" height="155" rx="14"/><text class="n" x="20" y="52">03</text><text class="k" x="20" y="91">INVOICE</text><text class="s" x="20" y="120">submit + audit</text></g><path class="arrow" d="M765 262h65"/><g transform="translate(840 185)"><rect class="box" width="180" height="155" rx="14"/><text class="n" x="20" y="52">04</text><text class="k" x="20" y="91">CASH</text><text class="s" x="20" y="120">fund + reconcile</text></g><path d="M930 380c0 75-520 75-520 0" stroke="#9d4c3f" stroke-width="3" fill="none" stroke-dasharray="9 10"/><text x="444" y="478" class="s">payment timing · disputes · counterparty behavior → underwriting evidence</text></svg>
