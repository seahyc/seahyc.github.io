<svg xmlns="http://www.w3.org/2000/svg" width="600" height="526" viewBox="0 0 600 526" role="img"><title>EV IS NOT PERSONAL CASH</title><g font-family="Arial,Helvetica,sans-serif"><text x="18" y="36" font-size="27" fill="#9d4c3f">EV IS NOT PERSONAL CASH</text><rect x="18" y="70" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="103" font-size="26" fill="#27231e">$1,000m enterprise value</text><text x="34" y="136" font-size="23" fill="#665f52">Less $300m net debt and $20m fees</text><rect x="18" y="174" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="207" font-size="26" fill="#27231e">$680m residual before preferences</text><text x="34" y="240" font-size="23" fill="#665f52">5% participating common → $34m gross</text><rect x="18" y="278" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="311" font-size="26" fill="#27231e">Alternative promote, not additive</text><text x="34" y="344" font-size="23" fill="#665f52">$400m hurdle; 15% pool; half → $21m</text><rect x="18" y="382" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="415" font-size="26" fill="#27231e">Secondary / recap require permission</text><text x="34" y="448" font-size="23" fill="#665f52">Dilution, tax and senior claims still matter</text><text x="18" y="511" font-size="21" fill="#665f52">USD • alternative scenario waterfalls E45</text></g></svg>