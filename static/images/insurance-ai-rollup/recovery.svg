<svg xmlns="http://www.w3.org/2000/svg" width="600" height="526" viewBox="0 0 600 526" role="img"><title>RECOVERY IS A CASH COHORT</title><g font-family="Arial,Helvetica,sans-serif"><text x="18" y="36" font-size="27" fill="#9d4c3f">RECOVERY IS A CASH COHORT</text><rect x="18" y="70" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="103" font-size="26" fill="#27231e">1,000 files screened · base assumption</text><text x="34" y="136" font-size="23" fill="#665f52">20% success × $10,000 collected each</text><rect x="18" y="174" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="207" font-size="26" fill="#27231e">$2m collected for the rights holder</text><text x="34" y="240" font-size="23" fill="#665f52">20% assumed fee → $400k revenue</text><rect x="18" y="278" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="311" font-size="26" fill="#27231e">$300k cost before collection</text><text x="34" y="344" font-size="23" fill="#665f52">$100k contribution; 12-month lag assumed</text><rect x="18" y="382" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="415" font-size="26" fill="#27231e">Break-even success · 15%</text><text x="34" y="448" font-size="23" fill="#665f52">20% less collected cash → only $20k profit</text><text x="18" y="511" font-size="21" fill="#665f52">USD • scenarios E43 • no legal fee approval</text></g></svg>