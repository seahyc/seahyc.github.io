<svg xmlns="http://www.w3.org/2000/svg" width="600" height="526" viewBox="0 0 600 526" role="img"><title>WHAT THE BROKER OWNS</title><g font-family="Arial,Helvetica,sans-serif"><text x="18" y="36" font-size="27" fill="#9d4c3f">WHAT THE BROKER OWNS</text><rect x="18" y="70" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="103" font-size="26" fill="#27231e">Client mandate</text><text x="34" y="136" font-size="23" fill="#665f52">Understand risk and arrange cover</text><rect x="18" y="174" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="207" font-size="26" fill="#27231e">Insurer placement</text><text x="34" y="240" font-size="23" fill="#665f52">Match appetite, negotiate, document</text><rect x="18" y="278" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="311" font-size="26" fill="#27231e">Service through renewal</text><text x="34" y="344" font-size="23" fill="#665f52">Endorsements, claims support, retention</text><rect x="18" y="382" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="415" font-size="26" fill="#27231e">Net brokerage revenue</text><text x="34" y="448" font-size="23" fill="#665f52">Commission / lawful fees; not premium</text><text x="18" y="511" font-size="21" fill="#665f52">Conceptual synthesis • ledger E06–E18</text></g></svg>