<svg xmlns="http://www.w3.org/2000/svg" width="600" height="526" viewBox="0 0 600 526" role="img"><title>EARN THE RIGHT TO BUY AGAIN</title><g font-family="Arial,Helvetica,sans-serif"><text x="18" y="36" font-size="27" fill="#9d4c3f">EARN THE RIGHT TO BUY AGAIN</text><rect x="18" y="70" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="103" font-size="26" fill="#27231e">Access gate · first 90 days</text><text x="34" y="136" font-size="23" fill="#665f52">3 sellers ready for diligence; 3 paid/budgeted</text><rect x="18" y="174" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="207" font-size="26" fill="#27231e">Purchase gate · before closing</text><text x="34" y="240" font-size="23" fill="#665f52">Existing cash earnings; full downside ≥1.5×</text><rect x="18" y="278" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="311" font-size="26" fill="#27231e">Operating gate · full renewal cycle</text><text x="34" y="344" font-size="23" fill="#665f52">≥95% normalized retained revenue</text><rect x="18" y="382" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="415" font-size="26" fill="#27231e">Expansion gate · after proof</text><text x="34" y="448" font-size="23" fill="#665f52">Ownership map, positive return, local authority</text><text x="18" y="511" font-size="21" fill="#665f52">Proposed stop/go rules • E46 • not benchmarks</text></g></svg>