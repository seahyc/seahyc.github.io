<svg xmlns="http://www.w3.org/2000/svg" width="600" height="526" viewBox="0 0 600 526" role="img"><title>AN ANCHOR NEEDS REAL EQUITY</title><g font-family="Arial,Helvetica,sans-serif"><text x="18" y="36" font-size="27" fill="#9d4c3f">AN ANCHOR NEEDS REAL EQUITY</text><rect x="18" y="70" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="103" font-size="26" fill="#27231e">Assumed historical EBITDA · $1.6m</text><text x="34" y="136" font-size="23" fill="#665f52">8× entry → $12.8m enterprise value</text><rect x="18" y="174" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="207" font-size="26" fill="#27231e">Other uses · $1.5m</text><text x="34" y="240" font-size="23" fill="#665f52">Integration, fees and working cash</text><rect x="18" y="278" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="311" font-size="26" fill="#27231e">Total uses · $14.3m</text><text x="34" y="344" font-size="23" fill="#665f52">$5.12m debt + $9.18m equity</text><rect x="18" y="382" width="564" height="88" rx="9" fill="none" stroke="#566e5e"/><text x="34" y="415" font-size="26" fill="#27231e">At 14× entry, debt held fixed</text><text x="34" y="448" font-size="23" fill="#665f52">Equity needed rises to $18.78m</text><text x="18" y="511" font-size="21" fill="#665f52">USD • original scenarios • no seller/lender quote</text></g></svg>