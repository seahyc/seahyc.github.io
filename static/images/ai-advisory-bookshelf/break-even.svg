<svg xmlns="http://www.w3.org/2000/svg" width="600" height="720" viewBox="0 0 600 720" role="img" aria-labelledby="title desc"><title id="title">Founder time and retention change the break-even hurdle</title><desc id="desc">Original scenario-model.json outputs dated 3 November 2026. Base cash break-even 267 payers; including USD10000 monthly founder opportunity cost 1599; doubling support time alone yields 2664; doubling monthly churn alone yields 3551. All commercial inputs are chosen assumptions, not observed unit economics. Shared absolute scale starts at zero.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="27" fill="#9d4c3f" text-anchor="start">PAYERS NEEDED TO BREAK EVEN</text><text x="20" y="75" font-size="22" fill="#6d665c" text-anchor="start">Original scenarios · active paying customers</text><text x="20" y="120" font-size="23" fill="#27231e" text-anchor="start">Base · cash costs only</text><rect x="20" y="135" width="30.705000000000002" height="26" fill="#597365"/><text x="60.705" y="157" font-size="23" fill="#27231e" text-anchor="start">267</text><text x="20" y="222" font-size="23" fill="#27231e" text-anchor="start">Base · includes founder time</text><rect x="20" y="237" width="183.885" height="26" fill="#597365"/><text x="213.885" y="259" font-size="23" fill="#27231e" text-anchor="start">1,599</text><text x="20" y="324" font-size="23" fill="#27231e" text-anchor="start">Support time doubles</text><rect x="20" y="339" width="306.36" height="26" fill="#9d4c3f"/><text x="336.36" y="361" font-size="23" fill="#27231e" text-anchor="start">2,664</text><text x="20" y="426" font-size="23" fill="#27231e" text-anchor="start">Monthly churn doubles</text><rect x="20" y="441" width="408.365" height="26" fill="#9d4c3f"/><text x="438.365" y="463" font-size="23" fill="#27231e" text-anchor="start">3,551</text><path d="M20 535 L480 535" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M20.0 535 L20.0 542" fill="none" stroke="#6d665c" stroke-width="2"/><text x="20.0" y="571" font-size="21" fill="#6d665c" text-anchor="middle">0</text><path d="M135.0 535 L135.0 542" fill="none" stroke="#6d665c" stroke-width="2"/><text x="135.0" y="571" font-size="21" fill="#6d665c" text-anchor="middle">1,000</text><path d="M250.0 535 L250.0 542" fill="none" stroke="#6d665c" stroke-width="2"/><text x="250.0" y="571" font-size="21" fill="#6d665c" text-anchor="middle">2,000</text><path d="M365.0 535 L365.0 542" fill="none" stroke="#6d665c" stroke-width="2"/><text x="365.0" y="571" font-size="21" fill="#6d665c" text-anchor="middle">3,000</text><path d="M480.0 535 L480.0 542" fill="none" stroke="#6d665c" stroke-width="2"/><text x="480.0" y="571" font-size="21" fill="#6d665c" text-anchor="middle">4,000</text><text x="20" y="614" font-size="22" fill="#6d665c" text-anchor="start">First bar excludes founder opportunity cost.</text><text x="20" y="650" font-size="22" fill="#6d665c" text-anchor="start">Other bars include it; one input changes at a time.</text><text x="20" y="690" font-size="21" fill="#9d4c3f" text-anchor="start">Scenario model · 3 Nov 2026 · not observed</text></g></svg>