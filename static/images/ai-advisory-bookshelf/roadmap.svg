<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc"><title id="title">A conditional path from side project to stronger evidence</title><desc id="desc">Proposed 0 to 24 month stages with stop gates. Comparison, renewal, case records and expansion only after repeat paid demand and positive contribution. No outcomes have been collected.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="27" fill="#9d4c3f" text-anchor="start">EARN EACH NEXT STAGE</text><rect x="20" y="68" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="101" font-size="27" fill="#27231e" text-anchor="start">Months 0–3 · compare and charge</text><text x="40" y="134" font-size="23" fill="#6d665c" text-anchor="start">Test against the strongest accessible substitute</text><path d="M300 154 L300 178" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="180" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="213" font-size="27" fill="#27231e" text-anchor="start">Months 3–6 · observe renewal</text><text x="40" y="246" font-size="23" fill="#6d665c" text-anchor="start">One decision type; audit source context</text><path d="M300 266 L300 290" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="292" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="325" font-size="27" fill="#27231e" text-anchor="start">Months 6–12 · build case records</text><text x="40" y="358" font-size="23" fill="#6d665c" text-anchor="start">Include failures, missing facts and real costs</text><path d="M300 378 L300 402" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="404" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="437" font-size="27" fill="#27231e" text-anchor="start">Months 12–24 · expand conditionally</text><text x="40" y="470" font-size="23" fill="#6d665c" text-anchor="start">Only with repeat paid demand and contribution</text><text x="20" y="554" font-size="24" fill="#9d4c3f" text-anchor="start">Failed gate → narrow, archive or stop.</text><text x="20" y="589" font-size="22" fill="#6d665c" text-anchor="start">Proposed calendar · no forecast of success</text></g></svg>