<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="title desc"><title id="title">Where retrieval ends and source checking begins</title><desc id="desc">The Brains README documents generated-note search through MCP, not guaranteed original-passage verification. Readwise MCP documentation describes the bridge to AI clients. Source checking is the proposed product requirement in the existing article; host adoption and faithful use have not been tested. Edition 3 November 2026.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="26" fill="#9d4c3f" text-anchor="start">A CONNECTOR IS ONLY ONE LINK</text><rect x="20" y="74" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="107" font-size="26" fill="#27231e" text-anchor="start">External collection</text><text x="38" y="141" font-size="22" fill="#6d665c" text-anchor="start">Search generated notes linked to sources</text><path d="M300 162 L300 184" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 178 L300 184" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 178 L300 184" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="194" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="227" font-size="26" fill="#27231e" text-anchor="start">Host AI</text><text x="38" y="261" font-size="22" fill="#6d665c" text-anchor="start">Must actually call the search tool</text><path d="M300 282 L300 304" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 298 L300 304" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 298 L300 304" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="314" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="347" font-size="26" fill="#27231e" text-anchor="start">Proposed evidence check</text><text x="38" y="381" font-size="22" fill="#6d665c" text-anchor="start">Open original context; test source support</text><path d="M300 402 L300 424" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 418 L300 424" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 418 L300 424" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="434" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="467" font-size="26" fill="#27231e" text-anchor="start">Advice in the user’s conversation</text><text x="38" y="501" font-size="22" fill="#6d665c" text-anchor="start">Keep source words apart from application</text><text x="20" y="568" font-size="25" fill="#9d4c3f" text-anchor="start">Retrieved note ≠ original passage</text><text x="20" y="605" font-size="25" fill="#9d4c3f" text-anchor="start">Tool access ≠ faithful tool use</text><text x="20" y="650" font-size="21" fill="#6d665c" text-anchor="start">Documented plumbing + proposed checking</text></g></svg>