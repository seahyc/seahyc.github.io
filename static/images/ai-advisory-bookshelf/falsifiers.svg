<svg xmlns="http://www.w3.org/2000/svg" width="600" height="695" viewBox="0 0 600 695" role="img" aria-labelledby="title desc"><title id="title">Falsification rules for the standalone bookshelf business</title><desc id="desc">Original proposed stop rules from research-map.md. Stop generic thesis without improvement over strongest accessible substitute; pause release for fabricated quotations or unsupported attribution; exclude unclear-rights sources; stop paid expansion if recurring costs and acquisition consume contribution. No trial or commercial validation has occurred.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="26" fill="#9d4c3f" text-anchor="start">MAKE THE COMPANY EARN ITS PLACE</text><rect x="20" y="76" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="109" font-size="26" fill="#27231e" text-anchor="start">No gain over the strongest substitute</text><text x="38" y="143" font-size="22" fill="#6d665c" text-anchor="start">Stop the generic bookshelf thesis</text><rect x="20" y="188" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="221" font-size="26" fill="#27231e" text-anchor="start">Fabricated or unsupported attribution</text><text x="38" y="255" font-size="22" fill="#6d665c" text-anchor="start">Pause release; repair and re-audit</text><rect x="20" y="300" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="333" font-size="26" fill="#27231e" text-anchor="start">Unresolved source rights</text><text x="38" y="367" font-size="22" fill="#6d665c" text-anchor="start">Exclude affected sources</text><rect x="20" y="412" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="445" font-size="26" fill="#27231e" text-anchor="start">Costs consume contribution</text><text x="38" y="479" font-size="22" fill="#6d665c" text-anchor="start">Stop paid expansion; narrow the scope</text><text x="20" y="584" font-size="25" fill="#597365" text-anchor="start">Useful personal tool ≠ proven business</text><text x="20" y="626" font-size="23" fill="#6d665c" text-anchor="start">Stop rules proposed before the trial.</text><text x="20" y="665" font-size="21" fill="#6d665c" text-anchor="start">Research-map falsifiers · 3 Nov 2026</text></g></svg>