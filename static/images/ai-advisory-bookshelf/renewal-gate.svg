<svg xmlns="http://www.w3.org/2000/svg" width="600" height="703" viewBox="0 0 600 703" role="img" aria-labelledby="title desc"><title id="title">Proposed demand and operating hurdles at day 75</title><desc id="desc">Original proposed gates from research-map.md, not industry benchmarks or completed milestones. Six of twelve participants pay USD19, four renew without consulting, four return for an independent decision; median recurring support at most four minutes per payer-month, reporting tail support and founder time. Passing earns only another bounded test.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="27" fill="#9d4c3f" text-anchor="start">THE DAY-75 DEMAND GATE</text><text x="20" y="76" font-size="24" fill="#6d665c" text-anchor="start">Chosen hurdles · not achieved results</text><rect x="20" y="110" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="143" font-size="26" fill="#27231e" text-anchor="start">6 of 12 participants pay US$19</text><text x="38" y="177" font-size="22" fill="#6d665c" text-anchor="start">For the first month of the proposed trial</text><rect x="20" y="224" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="257" font-size="26" fill="#27231e" text-anchor="start">4 renew once</text><text x="38" y="291" font-size="22" fill="#6d665c" text-anchor="start">Without bundled consulting</text><rect x="20" y="338" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="371" font-size="26" fill="#27231e" text-anchor="start">4 return independently</text><text x="38" y="405" font-size="22" fill="#6d665c" text-anchor="start">For another decision</text><rect x="20" y="452" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="485" font-size="26" fill="#27231e" text-anchor="start">Median support ≤4 min / payer / month</text><text x="38" y="519" font-size="22" fill="#6d665c" text-anchor="start">Report tail effort and founder time too</text><text x="20" y="590" font-size="24" fill="#597365" text-anchor="start">Pass → another bounded experiment</text><text x="20" y="628" font-size="24" fill="#9d4c3f" text-anchor="start">Fail → archive or keep as an unpaid tool</text><text x="20" y="673" font-size="21" fill="#6d665c" text-anchor="start">Proposed research-map gates · 3 Nov 2026</text></g></svg>