<svg xmlns="http://www.w3.org/2000/svg" width="600" height="610" viewBox="0 0 600 610" role="img" aria-labelledby="title desc"><title id="title">Existing suppliers occupy the bookshelf layers</title><desc id="desc">Qualitative comparison of documented product scope, not a ranking. Google purchased books, Readwise saved reading, Delphi replicas and comparison, and The Brains public-source notes. Checked 3 November 2026.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="26" fill="#9d4c3f" text-anchor="start">THE SHELF ALREADY HAS NEIGHBOURS</text><rect x="20" y="68" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="101" font-size="27" fill="#27231e" text-anchor="start">Google Expert Intelligence</text><text x="40" y="134" font-size="23" fill="#6d665c" text-anchor="start">Purchased-book context in Gemini Notebook</text><rect x="20" y="178" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="211" font-size="27" fill="#27231e" text-anchor="start">Readwise MCP</text><text x="40" y="244" font-size="23" fill="#6d665c" text-anchor="start">Saved highlights and Reader documents</text><rect x="20" y="288" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="321" font-size="27" fill="#27231e" text-anchor="start">Delphi</text><text x="40" y="354" font-size="23" fill="#6d665c" text-anchor="start">People-based replicas and comparisons</text><rect x="20" y="398" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="431" font-size="27" fill="#27231e" text-anchor="start">The Brains</text><text x="40" y="464" font-size="23" fill="#6d665c" text-anchor="start">Public-source notes through MCP</text><text x="20" y="548" font-size="22" fill="#6d665c" text-anchor="start">Documented offerings · efficacy not tested</text><text x="20" y="582" font-size="22" fill="#6d665c" text-anchor="start">Primary sources in adjacent text · 3 Nov 2026</text></g></svg>