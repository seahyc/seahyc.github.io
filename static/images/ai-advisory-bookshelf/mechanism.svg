<svg xmlns="http://www.w3.org/2000/svg" width="600" height="676" viewBox="0 0 600 676" role="img" aria-labelledby="title desc"><title id="title">A proposed cited decision workflow</title><desc id="desc">Five steps: original source, context check, conditional comparison, decision record and outcome review. Conceptual design, not product efficacy evidence.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="25" fill="#9d4c3f" text-anchor="start">FROM A SOURCE TO A REVIEWABLE CHOICE</text><rect x="20" y="66" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="99" font-size="27" fill="#27231e" text-anchor="start">Find the original</text><text x="40" y="132" font-size="23" fill="#6d665c" text-anchor="start">Source, date and passage locator</text><path d="M300 152 L300 174" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 168 L300 174" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 168 L300 174" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="178" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="211" font-size="27" fill="#27231e" text-anchor="start">Check the surrounding context</text><text x="40" y="244" font-size="23" fill="#6d665c" text-anchor="start">Separate quotation from interpretation</text><path d="M300 264 L300 286" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 280 L300 286" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 280 L300 286" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="290" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="323" font-size="27" fill="#27231e" text-anchor="start">Compare the conditions</text><text x="40" y="356" font-size="23" fill="#6d665c" text-anchor="start">When would a contrary view be right?</text><path d="M300 376 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 392 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 392 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="402" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="435" font-size="27" fill="#27231e" text-anchor="start">Record the choice</text><text x="40" y="468" font-size="23" fill="#6d665c" text-anchor="start">Assumptions, expected result, review date</text><path d="M300 488 L300 510" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 504 L300 510" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 504 L300 510" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="514" width="560" height="86" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="40" y="547" font-size="27" fill="#27231e" text-anchor="start">Return to the outcome</text><text x="40" y="580" font-size="23" fill="#6d665c" text-anchor="start">What happened? What is still unknown?</text><text x="20" y="646" font-size="22" fill="#6d665c" text-anchor="start">Proposed workflow · not a measured result</text></g></svg>