<svg xmlns="http://www.w3.org/2000/svg" width="600" height="727" viewBox="0 0 600 727" role="img" aria-labelledby="title desc"><title id="title">A proposed case-file anatomy</title><desc id="desc">Original conceptual diagram of the existing proposed evidence specification in market-evidence.md. Dated statement, action, explanation, result and counterexamples/unknowns do not establish causal expertise. No expert rankings or efficacy claims are made.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="26" fill="#9d4c3f" text-anchor="start">A CASE FILE, NOT AN EXPERT SCORE</text><rect x="20" y="70" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="103" font-size="26" fill="#27231e" text-anchor="start">Dated statement</text><text x="38" y="137" font-size="22" fill="#6d665c" text-anchor="start">What was recommended, and when?</text><path d="M300 158 L300 180" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 174 L300 180" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 174 L300 180" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="179" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="212" font-size="26" fill="#27231e" text-anchor="start">Dated action</text><text x="38" y="246" font-size="22" fill="#6d665c" text-anchor="start">What did the adviser actually do?</text><path d="M300 267 L300 289" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 283 L300 289" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 283 L300 289" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="288" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="321" font-size="26" fill="#27231e" text-anchor="start">Contemporaneous explanation</text><text x="38" y="355" font-size="22" fill="#6d665c" text-anchor="start">Which constraints or motives are recorded?</text><path d="M300 376 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 392 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 392 L300 398" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="397" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="430" font-size="26" fill="#27231e" text-anchor="start">Observed result</text><text x="38" y="464" font-size="22" fill="#6d665c" text-anchor="start">What happened; what else could explain it?</text><path d="M300 485 L300 507" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M294 501 L300 507" fill="none" stroke="#6d665c" stroke-width="2"/><path d="M306 501 L300 507" fill="none" stroke="#6d665c" stroke-width="2"/><rect x="20" y="506" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="539" font-size="26" fill="#27231e" text-anchor="start">Counterexamples and unknowns</text><text x="38" y="573" font-size="22" fill="#6d665c" text-anchor="start">Include failures and missing evidence</text><text x="20" y="660" font-size="24" fill="#9d4c3f" text-anchor="start">Sequence does not establish causation.</text><text x="20" y="697" font-size="21" fill="#6d665c" text-anchor="start">Proposed evidence specification · 3 Nov 2026</text></g></svg>