<svg xmlns="http://www.w3.org/2000/svg" width="600" height="674" viewBox="0 0 600 674" role="img" aria-labelledby="title desc"><title id="title">Guidance usage has different denominators</title><desc id="desc">Anthropic April 2026 personal-guidance study: approximately 6% of filtered conversations are personal guidance; within personal guidance 26% professional/career and 9% sycophancy. OpenAI/NBER study consumer user-message share: approximately 29% practical guidance, a broader category. These are not comparable market-size estimates. Primary source links are in adjacent article text.</desc><g font-family="Arial, Helvetica, sans-serif"><text x="20" y="36" font-size="25" fill="#9d4c3f" text-anchor="start">DIFFERENT QUESTIONS, DIFFERENT BASES</text><text x="20" y="76" font-size="24" fill="#27231e" text-anchor="start">Anthropic · personal guidance study</text><rect x="20" y="98" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="131" font-size="26" fill="#27231e" text-anchor="start">6% · personal guidance</text><text x="38" y="165" font-size="22" fill="#6d665c" text-anchor="start">Base: filtered conversation sample</text><rect x="20" y="206" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="239" font-size="26" fill="#27231e" text-anchor="start">26% · professional or career matters</text><text x="38" y="273" font-size="22" fill="#6d665c" text-anchor="start">Base: personal-guidance conversations</text><rect x="20" y="314" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="347" font-size="26" fill="#27231e" text-anchor="start">9% · sycophancy</text><text x="38" y="381" font-size="22" fill="#6d665c" text-anchor="start">Base: personal-guidance conversations</text><text x="20" y="452" font-size="24" fill="#27231e" text-anchor="start">OpenAI / NBER · consumer usage study</text><rect x="20" y="474" width="560" height="88" rx="8" fill="none" stroke="#6d665c" stroke-width="1.5"/><text x="38" y="507" font-size="26" fill="#27231e" text-anchor="start">29% · practical guidance</text><text x="38" y="541" font-size="22" fill="#6d665c" text-anchor="start">Base: consumer user messages</text><text x="20" y="608" font-size="24" fill="#9d4c3f" text-anchor="start">These are not comparable market shares.</text><text x="20" y="644" font-size="21" fill="#6d665c" text-anchor="start">Studies linked in text · edition 3 Nov 2026</text></g></svg>