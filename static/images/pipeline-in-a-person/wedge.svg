<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770" role="img" aria-labelledby="title desc"><title id="title">Proposed target selection gates</title><desc id="desc">A proposed screening flow. Mechanism, function, differentiation, rights and finance must each pass before synthesis.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start" font-weight="bold">A TARGET MUST SURVIVE EVERY GATE</text><rect x="50" y="82" width="620" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="121" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Mechanism</text><text x="360.0" y="159" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Right direction and modality?</text><path d="M360,192 L360,222" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="229" width="620" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="268" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Function</text><text x="360.0" y="306" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Informative, transferable readout?</text><path d="M360,339 L360,369" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="376" width="620" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="415" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Differentiation</text><text x="360.0" y="453" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Better for a defined patient group?</text><path d="M360,486 L360,516" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="50" y="523" width="620" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="562" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Rights + finance</text><text x="360.0" y="600" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Transferable and next gate funded?</text><text x="360" y="732" font-size="32" fill="#9d4c3f" text-anchor="middle" font-weight="bold">Any “no” → stop before synthesis.</text></g></svg>