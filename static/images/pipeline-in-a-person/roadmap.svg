<svg xmlns="http://www.w3.org/2000/svg" width="720" height="835" viewBox="0 0 720 835" role="img" aria-labelledby="title desc"><title id="title">Proposed path of attack</title><desc id="desc">Conditional phases with stop/go gates, not a timeline guarantee or experimental protocol.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start" font-weight="bold">PROPOSED 12–24 MONTH SEQUENCE</text><text x="20" y="115" font-size="29" fill="#9d4c3f" text-anchor="start" font-weight="bold">0–2 mo</text><rect x="175" y="85" width="520" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="435.0" y="124" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Choose + price</text><text x="435.0" y="162" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Mechanism, comparator, bids, rights</text><text x="435" y="228" font-size="24" fill="#665f52" text-anchor="middle" font-weight="normal">STOP / GO</text><text x="20" y="275" font-size="29" fill="#9d4c3f" text-anchor="start" font-weight="bold">2–6 mo</text><rect x="175" y="245" width="520" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="435.0" y="284" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Test function</text><text x="435.0" y="322" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Repeatable comparator-relative result</text><text x="435" y="388" font-size="24" fill="#665f52" text-anchor="middle" font-weight="normal">STOP / GO</text><text x="20" y="435" font-size="29" fill="#9d4c3f" text-anchor="start" font-weight="bold">6–12 mo</text><rect x="175" y="405" width="520" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="435.0" y="444" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Test relevance</text><text x="435.0" y="482" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Exposure and disease evidence</text><text x="435" y="548" font-size="24" fill="#665f52" text-anchor="middle" font-weight="normal">STOP / GO</text><text x="20" y="595" font-size="29" fill="#9d4c3f" text-anchor="start" font-weight="bold">12–24 mo</text><rect x="175" y="565" width="520" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="435.0" y="604" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Challenge + transfer</text><text x="435.0" y="642" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Reproduce; partner, finance or stop</text><text x="360" y="798" font-size="32" fill="#9d4c3f" text-anchor="middle" font-weight="bold">Sale is not a scheduled milestone.</text></g></svg>