<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="title desc"><title id="title">Cash envelopes, not prices</title><desc id="desc">Zero-based bar comparison: low 225, base 600, high 1500 thousand US dollars. Original scenarios, not quotes or guaranteed budgets.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="32" fill="#9d4c3f" text-anchor="start" font-weight="bold">ILLUSTRATIVE CASH ENVELOPES</text><text x="20" y="82" font-size="27" fill="#665f52" text-anchor="start" font-weight="normal">USD thousands • allocations, not vendor quotes</text><text x="20" y="158" font-size="32" fill="#27231e" text-anchor="start" font-weight="normal">Low</text><rect x="135" y="130" width="64.5" height="44" fill="#566e5e"/><text x="213.5" y="162" font-size="32" fill="#27231e" text-anchor="start" font-weight="bold">225</text><text x="20" y="275" font-size="32" fill="#27231e" text-anchor="start" font-weight="normal">Base</text><rect x="135" y="247" width="172.0" height="44" fill="#566e5e"/><text x="321.0" y="279" font-size="32" fill="#27231e" text-anchor="start" font-weight="bold">600</text><text x="20" y="392" font-size="32" fill="#27231e" text-anchor="start" font-weight="normal">High</text><rect x="135" y="364" width="430.0" height="44" fill="#9d4c3f"/><text x="579.0" y="396" font-size="32" fill="#27231e" text-anchor="start" font-weight="bold">1,500</text><path d="M135,480 L565,480" fill="none" stroke="#665f52" stroke-width="3"/><path d="M135.0,480 L135.0,490" fill="none" stroke="#665f52" stroke-width="3"/><text x="135.0" y="525" font-size="25" fill="#665f52" text-anchor="middle" font-weight="normal">0</text><path d="M278.3333333333333,480 L278.3333333333333,490" fill="none" stroke="#665f52" stroke-width="3"/><text x="278.3333333333333" y="525" font-size="25" fill="#665f52" text-anchor="middle" font-weight="normal">500</text><path d="M421.66666666666663,480 L421.66666666666663,490" fill="none" stroke="#665f52" stroke-width="3"/><text x="421.66666666666663" y="525" font-size="25" fill="#665f52" text-anchor="middle" font-weight="normal">1,000</text><path d="M565.0,480 L565.0,490" fill="none" stroke="#665f52" stroke-width="3"/><text x="565.0" y="525" font-size="25" fill="#665f52" text-anchor="middle" font-weight="normal">1,500</text><text x="20" y="590" font-size="29" fill="#27231e" text-anchor="start" font-weight="normal">Includes expertise, assays, exposure, rights</text><text x="20" y="632" font-size="29" fill="#27231e" text-anchor="start" font-weight="normal">and rework. Excludes founder pay and trials.</text><text x="20" y="681" font-size="29" fill="#9d4c3f" text-anchor="start" font-weight="normal">The high case is not a maximum.</text></g></svg>