<svg xmlns="http://www.w3.org/2000/svg" width="720" height="795" viewBox="0 0 720 795" role="img" aria-labelledby="title desc"><title id="title">The evidence ladder</title><desc id="desc">A proposed evidence framework. Each stage answers a distinct question and can stop or redirect the program.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start" font-weight="bold">EACH RUNG EARNS A DIFFERENT CLAIM</text><text x="35" y="121" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">1</text><rect x="90" y="74" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="113" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Design</text><text x="392.5" y="151" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Plausible candidate</text><path d="M390,170 L390,188" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><text x="35" y="238" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">2</text><rect x="90" y="191" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="230" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Binding</text><text x="392.5" y="268" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Attaches under measured conditions</text><path d="M390,287 L390,305" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><text x="35" y="355" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">3</text><rect x="90" y="308" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="347" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Function</text><text x="392.5" y="385" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Changes relevant activity</text><path d="M390,404 L390,422" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><text x="35" y="472" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">4</text><rect x="90" y="425" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="464" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Exposure</text><text x="392.5" y="502" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Active where it must work</text><path d="M390,521 L390,539" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><text x="35" y="589" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">5</text><rect x="90" y="542" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="581" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Disease relevance</text><text x="392.5" y="619" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Meaningful effect in a suitable system</text><path d="M390,638 L390,656" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><text x="35" y="706" font-size="37" fill="#9d4c3f" text-anchor="start" font-weight="bold">6</text><rect x="90" y="659" width="605" height="96" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="392.5" y="698" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Transfer</text><text x="392.5" y="736" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Reproducible evidence and rights</text></g></svg>