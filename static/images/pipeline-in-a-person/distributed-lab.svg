<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">The distributed therapeutic company</title><desc id="desc">Conceptual operating model. Outsourced design and measurement require central scientific accountability.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start" font-weight="bold">RENT THE CAPACITY. OWN THE DECISION.</text><rect x="140" y="80" width="440" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="119" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Founder + scientific lead</text><text x="360.0" y="157" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Question • criteria • interpretation</text><path d="M360,190 L360,225" fill="none" stroke="#665f52" stroke-width="3"/><path d="M125,225 L595,225" fill="none" stroke="#665f52" stroke-width="3"/><path d="M125,225 L125,262" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="20" y="268" width="210" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="125.0" y="307" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">AI design</text><text x="125.0" y="345" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Candidates</text><path d="M125,378 L125,414" fill="none" stroke="#665f52" stroke-width="3"/><path d="M360,225 L360,262" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="255" y="268" width="210" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="307" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Contract labs</text><text x="360.0" y="345" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Measurements</text><path d="M360,378 L360,414" fill="none" stroke="#665f52" stroke-width="3"/><path d="M595,225 L595,262" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="490" y="268" width="210" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="595.0" y="307" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Independent</text><text x="595.0" y="345" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Review</text><path d="M595,378 L595,414" fill="none" stroke="#665f52" stroke-width="3"/><path d="M125,414 L595,414" fill="none" stroke="#665f52" stroke-width="3"/><path d="M360,414 L360,450" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="90" y="458" width="540" height="112" rx="10" fill="none" stroke="#566e5e" stroke-width="2.5"/><text x="360.0" y="497" font-size="32" fill="#566e5e" text-anchor="middle" font-weight="normal">Transferable asset</text><text x="360.0" y="535" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Candidate + evidence + rights</text><text x="360" y="617" font-size="29" fill="#665f52" text-anchor="middle" font-weight="normal">Scientific responsibility stays at the centre.</text></g></svg>