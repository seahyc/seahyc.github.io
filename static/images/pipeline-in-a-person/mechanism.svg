<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc"><title id="title">Hereditary angioedema mechanism</title><desc id="desc">Simplified FDA-label pathway: insufficient C1 inhibitor regulation, excess kallikrein activity and bradykinin; lanadelumab inhibits kallikrein.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#665f52" stroke-width="1.5"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start" font-weight="bold">A PATHWAY, NOT JUST A BINDING TARGET</text><rect x="80" y="78" width="560" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="117" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">C1 inhibitor deficiency</text><text x="360.0" y="155" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Loss of normal pathway restraint</text><path d="M360,188 L360,235" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="80" y="245" width="560" height="100" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="306.0" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Excess kallikrein activity</text><path d="M360,345 L360,399" fill="none" stroke="#665f52" stroke-width="3" marker-end="url(#a)"/><rect x="80" y="410" width="560" height="110" rx="10" fill="none" stroke="#27231e" stroke-width="2.5"/><text x="360.0" y="449" font-size="32" fill="#27231e" text-anchor="middle" font-weight="normal">Excess bradykinin</text><text x="360.0" y="487" font-size="27" fill="#665f52" text-anchor="middle" font-weight="normal">Increased permeability / swelling</text><text x="360" y="575" font-size="31" fill="#566e5e" text-anchor="middle" font-weight="bold">Inhibitory antibody acts on kallikrein</text><text x="360" y="618" font-size="29" fill="#665f52" text-anchor="middle" font-weight="normal">It does not replace the missing inhibitor.</text></g></svg>