<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">First 90 days of a qualification-led cold-plate company</title>
  <desc id="desc">Three 30-day lanes move from buyer interface to supplier audit and paid feasibility, ending with a serialised report and a funded next gate.</desc>
  <defs><style>
    .ink{fill:#27231e;stroke:#27231e;stroke-linecap:round;stroke-linejoin:round}.muted{fill:#81766a}.label{font:600 23px Arial,Helvetica,sans-serif;letter-spacing:1px}.small{font:21px Georgia,serif}.line{fill:none;stroke:#9d4c3f;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#9d4c3f"/></marker></defs>
  <g transform="rotate(-1 600 360)">
    <text x="82" y="92" class="label muted">DAYS 0–90 · THE CUSTOMER OPENS THE INTERFACE</text>
    <path d="M84 148h1030" stroke="#81766a" stroke-width="3" stroke-dasharray="3 13"/>
    <g><rect x="82" y="188" width="304" height="190" rx="18" fill="#e7bd91" stroke="#9d4c3f" stroke-width="4"/><text x="234" y="230" text-anchor="middle" class="label ink">0–30 · BUYER</text><text x="114" y="273" class="small ink">platform revision + heat envelope</text><text x="114" y="307" class="small ink">fluid / QD / service rules</text><text x="114" y="341" class="small ink">named owner + paid proposal</text><text x="234" y="428" text-anchor="middle" class="label muted">OUTPUT · DESIGN INPUT SHEET</text></g>
    <path d="M394 283h55" class="line"/>
    <g><rect x="449" y="188" width="304" height="190" rx="18" fill="#d3c4aa" stroke="#81766a" stroke-width="4"/><text x="601" y="230" text-anchor="middle" class="label ink">31–60 · PROCESS</text><text x="481" y="273" class="small ink">audit three contract makers</text><text x="481" y="307" class="small ink">coupon + sacrificial plate</text><text x="481" y="341" class="small ink">freeze acceptance matrix</text><text x="601" y="428" text-anchor="middle" class="label muted">OUTPUT · CONTROLLED TEST METHOD</text></g>
    <path d="M761 283h55" class="line"/>
    <g><rect x="816" y="188" width="304" height="190" rx="18" fill="#b7d5d0" stroke="#28625d" stroke-width="4"/><text x="968" y="230" text-anchor="middle" class="label ink">61–90 · FEASIBILITY</text><text x="848" y="273" class="small ink">3–5 geometries</text><text x="848" y="307" class="small ink">thermal / hydraulic / leak data</text><text x="848" y="341" class="small ink">ask to fund next NRE gate</text><text x="968" y="428" text-anchor="middle" class="label muted">OUTPUT · SERIALISED REPORT</text></g>
    <path d="M968 470v74" class="line"/><rect x="360" y="560" width="480" height="72" rx="15" fill="#f5e7d1" stroke="#9d4c3f" stroke-width="4"/><text x="600" y="606" text-anchor="middle" class="label ink">CONTINUE ONLY IF THE NEXT STEP IS PAID</text>
  </g>
</svg>
