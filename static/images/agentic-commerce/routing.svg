<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img"><title>A listing is only the first step</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">A listing is only the first step</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Discover → configure</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Registry presence is not invocation</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Eligible task → optional call</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Measure all eligible tasks, including skips</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Useful answer → repeat use</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Compare errors, unknowns, cost and latency</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Buyer payment → retained utility</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">No merchant purchase is needed for value</text><text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Proposed funnel · not observed conversion</text></svg>