<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img"><title>The consumer-fiduciary Master Plan</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">The consumer-fiduciary Master Plan</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">1. Curate a narrow category</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Day 90: 30 payers + held-out utility gate</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">2. Win optional agent routing</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Month 6: 3 builders · 100 payers · 70% kept</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">3. Earn permissioned outcomes</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Month 12: ≥20% fewer hard-error tasks</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">4. Guarantee a bounded purchase</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">3 break-even months + funded claims reserve</text><rect x="20" y="414" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="443" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">5. Open the method and outcome schema</text><text x="36" y="473" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Month 24 option; adoption remains unproven</text><text x="20" y="528" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Original proposed stages · no merchant subsidy assumed</text></svg>