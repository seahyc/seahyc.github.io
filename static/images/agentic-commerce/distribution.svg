<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img"><title>Earn routing before claiming default</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">Earn routing before claiming default</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Days 1–30: independent builder owners</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Ask for real tasks + instrumented comparison</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Days 31–90: optional tool selection</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">API and MCP; no forced-call instruction</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Consumer: pay for a bounded trial</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Test membership; permit easy cancellation</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Months 4–12: keep the useful cohort</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Renewal and correct answers, not installs</text><text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Proposed channel · no partners committed</text></svg>