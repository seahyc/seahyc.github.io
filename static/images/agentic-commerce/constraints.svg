<svg xmlns="http://www.w3.org/2000/svg" width="600" height="408" viewBox="0 0 600 408" role="img"><title>Proposed ranking sequence</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">Hard rules before preferences</text><rect x="20" y="65" width="265" height="100" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="100" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Hard: must pass</text><text x="34" y="139" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#27231e" text-anchor="start">Host · OS · display path</text><rect x="315" y="65" width="265" height="100" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="329" y="100" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Soft: tradeoffs</text><text x="329" y="139" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#27231e" text-anchor="start">Size · looks · confidence</text><path d="M150 180 L150 207" fill="none" stroke="#73685c" stroke-width="2"/><circle cx="150" cy="207" r="3" fill="#73685c"/><path d="M450 180 L450 207" fill="none" stroke="#73685c" stroke-width="2"/><circle cx="450" cy="207" r="3" fill="#73685c"/><rect x="20" y="223" width="560" height="85" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="35" y="255" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#27231e" text-anchor="start">Evidence: pass / fail / unknown</text><text x="35" y="288" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Unknown facts trigger a question or abstention</text><path d="M300 319 L300 346" fill="none" stroke="#73685c" stroke-width="2"/><circle cx="300" cy="346" r="3" fill="#73685c"/><text x="300" y="382" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="middle">Shortlist + total + reasons + sources</text></svg>