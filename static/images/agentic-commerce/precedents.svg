<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img"><title>Costco membership fees and company net income are different accounting measures</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">Costco: fees are revenue, not profit</text><text x="20" y="70" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#73685c" text-anchor="start">FY2026 · USD billions · zero baseline</text><text x="20" y="112" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">Membership-fee revenue</text><rect x="20" y="128" width="265.8" height="29" fill="#527367"/><text x="500" y="152" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#527367" text-anchor="start">5.907</text><text x="20" y="228" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#27231e" text-anchor="start">Net income: whole company</text><rect x="20" y="244" width="415.2" height="29" fill="#9d4c3f"/><text x="500" y="268" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#9d4c3f" text-anchor="start">9.226</text><text x="20" y="371" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Different accounting lines; do not subtract</text><text x="20" y="405" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Source: Costco FY2026 Form 10-K</text></svg>