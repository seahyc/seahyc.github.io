<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540" role="img"><title>How we choose and keep choosing</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">How we choose and keep choosing</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Eligible universe → hard predicates</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Unpaid products eligible; exact variants</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Evidence → independent fixture</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Vendor facts ≠ tests ≠ owner experience</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Shortlist → buyer tradeoffs + total</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Explain exclusions and unknown cost fields</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Refresh → outcomes → corrections</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Quotes each call; claims weekly or on change</text><rect x="20" y="414" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="443" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Appeal → same evidence rules</text><text x="36" y="473" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">No paid admission, suppression or placement</text><text x="20" y="528" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Proposed cadence · testing and rights still required</text></svg>