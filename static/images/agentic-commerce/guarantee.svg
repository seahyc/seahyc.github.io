<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img"><title>Earn responsibility before guaranteeing</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">Earn responsibility before guaranteeing</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Scoped criteria + exact approval</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Variant · payee · ceiling · expiry</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Priced cover + loss allocation</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Partner terms; reserve for claims and returns</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Operating cash can support obligations</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Three break-even months before new pilot</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Open method + interoperable records</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">No exclusivity; platforms may still decline</text><text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Later proposed route · not a launched guarantee</text></svg>