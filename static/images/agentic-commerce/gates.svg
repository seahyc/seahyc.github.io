<svg xmlns="http://www.w3.org/2000/svg" width="600" height="452" viewBox="0 0 600 452" role="img"><title>Pre-register reasons to stop</title><text x="20" y="35" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#27231e" text-anchor="start">Pre-register reasons to stop</text><rect x="20" y="62" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="91" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Rights + baseline advantage</text><text x="36" y="121" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">No unauthorized dependency; beat alternatives</text><rect x="20" y="150" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="179" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Routing + paid demand</text><text x="36" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Optional calls; buyers renew without ranking deals</text><rect x="20" y="238" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="267" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Cost + contribution</text><text x="36" y="297" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Count failures, support, churn and acquisition</text><rect x="20" y="326" width="560" height="74" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="36" y="355" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#527367" text-anchor="start">Outcome graph + expansion</text><text x="36" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#27231e" text-anchor="start">Fresh unseen cases must improve with permission</text><text x="20" y="440" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#73685c" text-anchor="start">Proposed falsifiers · no results observed</text></svg>