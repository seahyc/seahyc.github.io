<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595" role="img" aria-labelledby="title desc"><title id="title">Three company boundaries and a hardware gate</title><desc id="desc">Original strategic comparison. Software vendor, data service and full-stack operator own different work and obligations. Proprietary robotics require validated repeat demand.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">CHOOSE WHAT THE COMPANY OWNS</text><rect x="30" y="78" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="116" font-size="32" fill="#27231e" text-anchor="middle">Sell the software</text><text x="360" y="155" font-size="27" fill="#665f52" text-anchor="middle">Customer owns field execution</text><rect x="30" y="200" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="238" font-size="32" fill="#27231e" text-anchor="middle">Sell processed inspection data</text><text x="360" y="277" font-size="27" fill="#665f52" text-anchor="middle">Own review; depend on supplied footage</text><rect x="30" y="322" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="360" font-size="32" fill="#27231e" text-anchor="middle">Operate the inspection service</text><text x="360" y="399" font-size="27" fill="#665f52" text-anchor="middle">Own crews, delivery and operational downside</text><rect x="30" y="444" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="482" font-size="32" fill="#27231e" text-anchor="middle">Build proprietary robotics</text><text x="360" y="521" font-size="27" fill="#665f52" text-anchor="middle">Only after repeat paid physical bottlenecks</text></g></svg>