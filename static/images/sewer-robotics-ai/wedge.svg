<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595" role="img" aria-labelledby="title desc"><title id="title">Competitive wedge screening</title><desc id="desc">Original strategic comparison from primary product pages and PUB requirements; proposed local advantage is unvalidated.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">WHERE COULD A NEW ENTRANT WIN?</text><rect x="30" y="78" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="116" font-size="32" fill="#27231e" text-anchor="middle">Generic AI coding</text><text x="360" y="155" font-size="27" fill="#665f52" text-anchor="middle">Incumbents already sell it</text><rect x="30" y="200" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="238" font-size="32" fill="#27231e" text-anchor="middle">Inspection quality checks</text><text x="360" y="277" font-size="27" fill="#665f52" text-anchor="middle">QAI already overlaps this wedge</text><rect x="30" y="322" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="360" font-size="32" fill="#27231e" text-anchor="middle">Local field-to-report integration</text><text x="360" y="399" font-size="27" fill="#665f52" text-anchor="middle">Hypothesis: fewer revisits, same crew</text><rect x="30" y="444" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="482" font-size="32" fill="#27231e" text-anchor="middle">Custom sampling or manipulation</text><text x="360" y="521" font-size="27" fill="#665f52" text-anchor="middle">Only after repeat paid mission demand</text></g></svg>