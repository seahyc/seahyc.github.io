<svg xmlns="http://www.w3.org/2000/svg" width="720" height="585" viewBox="0 0 720 585" role="img" aria-labelledby="title desc"><title id="title">The founder decision tree</title><desc id="desc">Original falsification sequence. A safer, cheaper incumbent is a valid reason not to build.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">THREE TESTS BEFORE BUILDING A FLEET</text><rect x="30" y="82" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="120" font-size="32" fill="#27231e" text-anchor="middle">Does the customer lose money here?</text><text x="360" y="159" font-size="27" fill="#665f52" text-anchor="middle">Observe full cost of failed or repeated jobs</text><path d="M360,178 L360,221" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="223" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="261" font-size="32" fill="#27231e" text-anchor="middle">Can existing products solve it?</text><text x="360" y="300" font-size="27" fill="#665f52" text-anchor="middle">Buy and benchmark before rebuilding</text><path d="M360,319 L360,362" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="364" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="402" font-size="32" fill="#27231e" text-anchor="middle">Does our intervention improve the whole job?</text><text x="360" y="441" font-size="27" fill="#665f52" text-anchor="middle">Accepted output • critical misses • recovery</text><text x="360" y="550" font-size="29" fill="#9d4c3f" text-anchor="middle">Any failed gate → stop or change the thesis.</text></g></svg>