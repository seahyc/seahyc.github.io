<svg xmlns="http://www.w3.org/2000/svg" width="720" height="595" viewBox="0 0 720 595" role="img" aria-labelledby="title desc"><title id="title">A sewer robot capability envelope</title><desc id="desc">Engineering schematic, not measured sensor performance. Different sensing and recovery functions address different constraints.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">ONE SEWER. SEVERAL DIFFERENT JOBS.</text><rect x="30" y="78" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="116" font-size="32" fill="#27231e" text-anchor="middle">Above the water</text><text x="360" y="155" font-size="27" fill="#665f52" text-anchor="middle">Camera: visible surface condition</text><rect x="30" y="200" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="238" font-size="32" fill="#27231e" text-anchor="middle">Below murky water</text><text x="360" y="277" font-size="27" fill="#665f52" text-anchor="middle">Sonar: shape, not optical crack detail</text><rect x="30" y="322" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="360" font-size="32" fill="#27231e" text-anchor="middle">Across soft deposits</text><text x="360" y="399" font-size="27" fill="#665f52" text-anchor="middle">Traction and tether drag bind progress</text><rect x="30" y="444" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="482" font-size="32" fill="#27231e" text-anchor="middle">Back to the surface</text><text x="360" y="521" font-size="27" fill="#665f52" text-anchor="middle">Recovery must work after power loss</text></g></svg>