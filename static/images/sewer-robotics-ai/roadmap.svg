<svg xmlns="http://www.w3.org/2000/svg" width="720" height="615" viewBox="0 0 720 615" role="img" aria-labelledby="title desc"><title id="title">A conditional 12 to 24 month plan</title><desc id="desc">Proposed stage gates, not a forecast of procurement or technical success.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">PROPOSED PROOF BEFORE AUTONOMY</text><rect x="30" y="78" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="116" font-size="32" fill="#27231e" text-anchor="middle">0–3 months: baseline + compare</text><text x="360" y="155" font-size="27" fill="#665f52" text-anchor="middle">Paid jobs; manual versus incumbent versus prototype</text><path d="M360,174 L360,203" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="205" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="243" font-size="32" fill="#27231e" text-anchor="middle">3–6 months: sell the workflow</text><text x="360" y="282" font-size="27" fill="#665f52" text-anchor="middle">Independent acceptance; repeat orders</text><path d="M360,301 L360,330" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="332" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="370" font-size="32" fill="#27231e" text-anchor="middle">6–12 months: isolate physical bottleneck</text><text x="360" y="409" font-size="27" fill="#665f52" text-anchor="middle">Test one payload on existing crawler</text><path d="M360,428 L360,457" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="459" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="497" font-size="32" fill="#27231e" text-anchor="middle">12–24 months: replicate or stop</text><text x="360" y="536" font-size="27" fill="#665f52" text-anchor="middle">Second buyer cohort; local approvals; repeatability</text></g></svg>