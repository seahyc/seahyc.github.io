<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590" role="img" aria-labelledby="title desc"><title id="title">From access to intervention</title><desc id="desc">Conceptual workflow. A robot and AI are components; accepted evidence and funded action create value.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="40" font-size="30" fill="#9d4c3f" text-anchor="start">THE PRODUCT IS A COMPLETED DECISION</text><rect x="30" y="75" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="113" font-size="32" fill="#27231e" text-anchor="middle">Reach the pipe</text><text x="360" y="152" font-size="27" fill="#665f52" text-anchor="middle">Access • clean • launch</text><path d="M360,171 L360,198" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="200" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="238" font-size="32" fill="#27231e" text-anchor="middle">Capture useful evidence</text><text x="360" y="277" font-size="27" fill="#665f52" text-anchor="middle">Locate • illuminate • inspect</text><path d="M360,296 L360,323" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="325" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="363" font-size="32" fill="#27231e" text-anchor="middle">Earn acceptance</text><text x="360" y="402" font-size="27" fill="#665f52" text-anchor="middle">Review • classify • submit</text><path d="M360,421 L360,448" fill="none" stroke="#665f52" stroke-width="3"/><rect x="30" y="450" width="660" height="96" rx="10" fill="none" stroke="#665f52" stroke-width="2"/><text x="360" y="488" font-size="32" fill="#27231e" text-anchor="middle">Fund the right intervention</text><text x="360" y="527" font-size="27" fill="#665f52" text-anchor="middle">Repair • clean • verify</text></g></svg>