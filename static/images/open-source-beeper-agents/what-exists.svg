<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 499" width="360" height="499"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">What Beeper already gives agents (checked</text><text x="10" y="41" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">2026-11-21)</text><rect x="10" y="57" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="79" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Bridges, mostly open</text><text x="22" y="96" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">bridge-manager (Apache-2.0) runs official</text><text x="22" y="111.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">bridges for Telegram, WhatsApp, Signal,</text><text x="22" y="127.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Discord, Slack, Meta, LinkedIn, iMessage and</text><text x="22" y="142.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">more on your machine.</text><rect x="10" y="174.0" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="196.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Desktop API: REST, SDKs, MCP</text><text x="22" y="213.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Search, read, send, draft and control the</text><text x="22" y="228.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">client. Local, needs Beeper Desktop running.</text><text x="22" y="244.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">TypeScript, Go, Python, PHP SDKs.</text><rect x="10" y="275.5" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="297.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">CLI (MIT): built for agents</text><text x="22" y="314.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">JSON output, NDJSON event stream, signed</text><text x="22" y="330.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">webhooks, a --read-only mode, and an</text><text x="22" y="345.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">installable headless Beeper Server.</text><rect x="10" y="377.0" width="340" height="110" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="399.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Unknown: is the Beeper app and cloud</text><text x="22" y="416.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">open?</text><text x="22" y="433.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">This edition did not establish whether the</text><text x="22" y="448.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">desktop UI or Beeper cloud is open source.</text><text x="22" y="464.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Not verified either way.</text></svg>