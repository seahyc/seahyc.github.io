<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Price anchors (checked 2026-11-21)</text><rect x="10" y="40" width="340" height="126" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Beeper: free for 5 accounts, Plus</text><text x="22" y="79" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">$9.99/month</text><text x="22" y="96" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Plus allows 10 accounts, 3 per network</text><text x="22" y="111.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">(beeper.com/pricing; free tier from</text><text x="22" y="127.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">help.beeper.com FAQ). The consumer anchor is</text><text x="22" y="142.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">low.</text><rect x="10" y="174.0" width="340" height="110" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="196.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Unipile: $55/month flat for up to 10</text><text x="22" y="213.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">linked accounts</text><text x="22" y="230.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Then $5.50 each for 11 to 50, falling to</text><text x="22" y="245.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">$3.50 above 5,000. Proves some teams pay for</text><text x="22" y="261.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">maintained connections.</text><rect x="10" y="292.5" width="340" height="95" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="314.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Proposed here: $15 to $30 prosumer, $99</text><text x="22" y="331.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">to $299 team</text><text x="22" y="348.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">The source note's guess. No buyer has been</text><text x="22" y="364.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">asked.</text></svg>