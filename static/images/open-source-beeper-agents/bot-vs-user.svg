<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Two meanings of "agent messaging"</text><rect x="10" y="40" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Bot identity</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Agent has its own account. People message</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">it. Low blast radius; a wrong reply</text><text x="22" y="110.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">embarrasses the bot. Examples: Pantalk, A2A</text><text x="22" y="125.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Gateway (default mode).</text><rect x="10" y="157.0" width="340" height="124" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="179.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">User identity</text><text x="22" y="196.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Agent holds your sessions and writes as you.</text><text x="22" y="211.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">High value: it sees your real threads. High</text><text x="22" y="227.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">risk: a wrong send is you saying it.</text><text x="22" y="242.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Examples: Beeper MCP, Agent Messenger user</text><text x="22" y="258.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">mode.</text><rect x="10" y="289.5" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="311.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Docs already warn</text><text x="22" y="328.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Beeper: sending too many messages can lead</text><text x="22" y="344.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">to account suspension by the networks, and</text><text x="22" y="359.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">its MCP advises keeping approval prompts on</text><text x="22" y="375.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">for write tools.</text></svg>