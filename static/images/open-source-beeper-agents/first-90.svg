<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" width="360" height="474"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">First 90 days (proposed)</text><rect x="10" y="40" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Days 1 to 14</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Founder builds the read-only wrapper.</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Budget: founder time plus under $500 of</text><text x="22" y="110.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">tooling. Evidence: it answers three real</text><text x="22" y="125.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">"last conversation with X" queries.</text><text x="180.0" y="160.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="163.0" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="185.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Days 15 to 45</text><text x="22" y="202.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Recruit ten users from Beeper and agent</text><text x="22" y="217.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">communities. Evidence: ten signed-up local</text><text x="22" y="233.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">installs and a weekly use log.</text><text x="180.0" y="267.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="270.5" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="292.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Days 46 to 75</text><text x="22" y="309.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Add recipient resolution and commitment</text><text x="22" y="325.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">follow-ups. Evidence: count of cross-network</text><text x="22" y="340.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">matches and identity collisions.</text><text x="180.0" y="375.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="378.0" width="340" height="78" rx="8" fill="#e4efe9" stroke="#2f6f5e"/><text x="22" y="400.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Days 76 to 90</text><text x="22" y="417.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Review the gate. Five weekly users who want</text><text x="22" y="432.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">to keep it, or stop.</text><text x="180.0" y="467.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text></svg>