<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 467" width="360" height="467"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Gates set before building (numbers from the</text><text x="10" y="41" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">source note)</text><rect x="10" y="57" width="340" height="94" rx="8" fill="#e4efe9" stroke="#2f6f5e"/><text x="22" y="79" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Go at day 90</text><text x="22" y="96" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">At least 5 of 10 users rely on it weekly,</text><text x="22" y="111.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">cross-network context changed a real</text><text x="22" y="127.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">decision, and users ask to keep it.</text><rect x="10" y="158.5" width="340" height="78" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="180.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Stop at day 90</text><text x="22" y="197.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Only enthusiasm is for a nicer inbox, or</text><text x="22" y="213.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Beeper MCP already satisfies the workflow.</text><rect x="10" y="244.5" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="266.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Go to sends</text><text x="22" y="283.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Zero unresolved identity collisions across</text><text x="22" y="299.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">two weeks of read-only use, then 5 users</text><text x="22" y="314.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">with approval-bound sends.</text><rect x="10" y="346.0" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="368.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Falsifier</text><text x="22" y="385.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">If auth failures like the OAuth drops hudzah</text><text x="22" y="400.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">reports occur more than weekly on your own</text><text x="22" y="416.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">runtime, durability is the product and you</text><text x="22" y="431.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">are not there.</text></svg>