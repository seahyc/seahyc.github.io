<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 512" width="360" height="512"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Team, capital, legal, payout (assumptions)</text><rect x="10" y="40" width="340" height="124" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Team</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Founder-engineer first. Add a security</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">engineer before any hosted relay stores</text><text x="22" y="110.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">message content; a bridge maintainer who has</text><text x="22" y="125.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">shipped mautrix-style bridges is the key</text><text x="22" y="141.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">hire.</text><rect x="10" y="172.5" width="340" height="109" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="194.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Capital</text><text x="22" y="211.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Self-fund or a small angel round for Stages</text><text x="22" y="227.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">0 to 2; no hosted infrastructure cost until</text><text x="22" y="242.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Stage 3. Revenue from the $15 to $30 tier is</text><text x="22" y="258.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">untested.</text><rect x="10" y="289.5" width="340" height="109" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="311.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Legal and ethics</text><text x="22" y="328.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Sending as a person via unofficial protocols</text><text x="22" y="344.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">risks account bans and platform terms</text><text x="22" y="359.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">disputes; message data raises privacy</text><text x="22" y="375.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">duties. Get counsel before hosting.</text><rect x="10" y="406.5" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="428.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">How the founder gets paid</text><text x="22" y="445.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Salary from revenue after Stage 3; before</text><text x="22" y="461.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">that, nothing. No exit evidence exists in</text><text x="22" y="476.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">these sources.</text></svg>