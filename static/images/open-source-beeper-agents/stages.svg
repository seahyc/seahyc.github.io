<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 447" width="360" height="447"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">A staged sequence, each gated</text><rect x="10" y="40" width="340" height="95" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Stage 0, weeks 0 to 2: wrap, do not</text><text x="22" y="79" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">build</text><text x="22" y="96" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Beeper Desktop API plus wacli behind one</text><text x="22" y="111.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">read-only search. No new bridges.</text><text x="180.0" y="146.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="149.0" width="340" height="95" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="171.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Stage 1, weeks 3 to 8: ten heavy users,</text><text x="22" y="188.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">read-only</text><text x="22" y="205.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Identity resolution and follow-up</text><text x="22" y="220.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">extraction. Measure weekly use.</text><text x="180.0" y="255.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="258.0" width="340" height="80" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="280.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Stage 2, months 3 to 5: approval-bound</text><text x="22" y="297.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">sends for five users</text><text x="22" y="314.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Draft, resolve, approve, verify.</text><text x="180.0" y="348.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="351.5" width="340" height="78" rx="8" fill="#e4efe9" stroke="#2f6f5e"/><text x="22" y="373.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Stage 3, months 6 to 12: paid layer</text><text x="22" y="390.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Signed releases, hosted encrypted relay,</text><text x="22" y="406.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">team policy and audit.</text><text x="180.0" y="440.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text></svg>