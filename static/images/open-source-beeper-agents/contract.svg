<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="360" height="580"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Proposed contract (design hypothesis)</text><rect x="10" y="40" width="340" height="78" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">1  Ingest and normalize</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Keep the raw provider payload beside the</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">normalized message.</text><text x="180.0" y="129.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="132.0" width="340" height="78" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="154.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">2  Scope and search</text><text x="22" y="171.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Read-only by default; separate grants for</text><text x="22" y="186.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">history, contacts, drafts, sends.</text><text x="180.0" y="221.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="224.0" width="340" height="62" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="246.0" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">3  Draft</text><text x="22" y="263.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">The agent proposes text. Nothing leaves yet.</text><text x="180.0" y="297.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="300.5" width="340" height="78" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="322.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">4  Resolve recipient</text><text x="22" y="339.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Ambiguity is an error shown to the human,</text><text x="22" y="355.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">never an LLM guess.</text><text x="180.0" y="389.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="392.5" width="340" height="78" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="414.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">5  Approve and send</text><text x="22" y="431.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Approval binds to a content hash, recipient</text><text x="22" y="447.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">and network.</text><text x="180.0" y="481.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="484.5" width="340" height="78" rx="8" fill="#e4efe9" stroke="#2f6f5e"/><text x="22" y="506.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">6  Verify</text><text x="22" y="523.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Check delivery state, reconcile when</text><text x="22" y="539.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">upstream disagrees, log it.</text><text x="180.0" y="573.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text></svg>