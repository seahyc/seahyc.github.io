<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 419" width="360" height="419"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">The strongest reasons to stop</text><rect x="10" y="40" width="340" height="94" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Beeper ships the safety features</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Scoped tokens and read-only already exist.</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Approval and recipient rules are an</text><text x="22" y="110.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">incremental step for them.</text><rect x="10" y="141.5" width="340" height="78" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="163.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Unofficial protocols break and ban</text><text x="22" y="180.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">WhatsApp, LinkedIn and Instagram bridges are</text><text x="22" y="196.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">reverse-engineered; upkeep never ends.</text><rect x="10" y="227.5" width="340" height="78" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="249.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Open core, thin moat</text><text x="22" y="266.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Anyone can fork; compatibility data and</text><text x="22" y="282.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">signed releases must compound.</text><rect x="10" y="313.5" width="340" height="94" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="335.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Self-hosters pay little and ask a lot</text><text x="22" y="352.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Beeper is free for 5 accounts; the</text><text x="22" y="368.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">willingness to pay for self-hosting is</text><text x="22" y="383.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">unproven.</text></svg>