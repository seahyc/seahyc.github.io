<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" width="360" height="382"><text x="10" y="24" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">The question and where the gap might be</text><rect x="10" y="40" width="340" height="94" rx="8" fill="#f3eee3" stroke="#bdb6a8"/><text x="22" y="62" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Who talks to the agent?</text><text x="22" y="79" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Bot-style tools: a person messages a bot</text><text x="22" y="94.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">identity. Crowded: Pantalk, A2A Gateway,</text><text x="22" y="110.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">OpenClaw channels.</text><text x="180.0" y="144.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="147.5" width="340" height="109" rx="8" fill="#e4efe9" stroke="#2f6f5e"/><text x="22" y="169.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">Who does the agent talk as?</text><text x="22" y="186.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">User-identity tools: the agent reads and</text><text x="22" y="202.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">sends as you across WhatsApp, Telegram,</text><text x="22" y="217.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Slack. Beeper and Agent Messenger already</text><text x="22" y="233.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">live here.</text><text x="180.0" y="267.5" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text><rect x="10" y="270.5" width="340" height="94" rx="8" fill="#f4e1da" stroke="#a8442f"/><text x="22" y="292.5" font-size="14" font-weight="700" fill="#2b2a28" font-family="Georgia,serif">The thin layer underneath</text><text x="22" y="309.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">Scoped access, recipient resolution,</text><text x="22" y="325.0" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">draft/approve/send, delivery proof. This is</text><text x="22" y="340.5" font-size="12.5" fill="#6b665e" font-family="Georgia,serif">the bet, and it is a hypothesis.</text><text x="180.0" y="375.0" font-size="14" fill="#6b665e" text-anchor="middle" font-family="Georgia,serif">&#8595;</text></svg>