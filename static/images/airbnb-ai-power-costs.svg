<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Electricity-only cost of running a 600 watt system</title>
  <desc id="desc">A horizontal bar chart comparing directional electricity-only hourly cost in Singapore dollars equivalent by geography, with local currency labels.</desc>
  <rect width="1200" height="720" fill="#f7f0e5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#29251f">
    <text x="70" y="72" font-size="28" font-weight="700">Electricity-only cost of a 600W system</text>
    <text x="70" y="108" font-size="18" fill="#6a6258">Directional tariff examples; cooling, demand charges, and taxes excluded</text>
    <g font-size="18">
      <text x="90" y="195">Singapore</text><text x="1090" y="195" text-anchor="end">S$0.209/h</text>
      <text x="90" y="305">Vietnam</text><text x="1090" y="305" text-anchor="end">VND 2,076/h</text>
      <text x="90" y="415">Manila</text><text x="1090" y="415" text-anchor="end">₱8.61/h</text>
      <text x="90" y="525">India example</text><text x="1090" y="525" text-anchor="end">₹2.70/h</text>
    </g>
    <g fill="#a8473a">
      <rect x="300" y="166" width="680" height="42" rx="3"/>
      <rect x="300" y="276" width="420" height="42" rx="3"/>
      <rect x="300" y="386" width="300" height="42" rx="3"/>
      <rect x="300" y="496" width="210" height="42" rx="3"/>
    </g>
    <line x1="300" y1="575" x2="980" y2="575" stroke="#81776d" stroke-width="2"/>
    <g fill="#6a6258" font-size="15">
      <text x="300" y="604">higher directional cost</text><text x="980" y="604" text-anchor="end">comparison is not purchasing-power adjusted</text>
      <text x="70" y="675">Sources: Singapore EMA, Vietnam EVN, Meralco, India CEA. Local currencies shown; bar lengths are illustrative, not FX-normalized.</text>
    </g>
  </g>
</svg>
