<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Four gates over a two-year cold-plate attack plan</title>
  <desc id="desc">A timeline shows buyer proof, process proof, qualification proof, and repeatability proof, each with a stop condition.</desc>
  <defs><style>
    .ink{fill:#27231e;stroke:#27231e;stroke-linecap:round;stroke-linejoin:round}.muted{fill:#81766a}.label{font:600 21px Arial,Helvetica,sans-serif;letter-spacing:1px}.small{font:21px Georgia,serif}.line{fill:none;stroke:#9d4c3f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  </style><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#9d4c3f"/></marker></defs>
  <g transform="rotate(1 600 350)">
    <text x="82" y="101" class="label muted">A GATE IS A REASON TO CONTINUE — OR STOP</text>
    <path d="M103 202H1094" class="line"/>
    <g><circle cx="160" cy="202" r="25" fill="#e7bd91" stroke="#9d4c3f" stroke-width="5"/><text x="160" y="211" text-anchor="middle" class="label ink">1</text><text x="85" y="151" class="label ink">0–3 MO</text><text x="76" y="272" class="label ink">BUYER PROOF</text><text x="76" y="311" class="small muted">named platform</text><text x="76" y="342" class="small muted">paid feasibility</text><path d="M160 365v47" class="line"/><text x="76" y="453" class="small ink">STOP: generic interest</text></g>
    <g><circle cx="445" cy="202" r="25" fill="#d3c4aa" stroke="#81766a" stroke-width="5"/><text x="445" y="211" text-anchor="middle" class="label ink">2</text><text x="370" y="151" class="label ink">3–6 MO</text><text x="353" y="272" class="label ink">PROCESS PROOF</text><text x="354" y="311" class="small muted">10–20 prototypes</text><text x="354" y="342" class="small muted">locked joining + tests</text><path d="M445 365v47" class="line"/><text x="354" y="453" class="small ink">STOP: unexplained leaks</text></g>
    <g><circle cx="730" cy="202" r="25" fill="#b7d5d0" stroke="#28625d" stroke-width="5"/><text x="730" y="211" text-anchor="middle" class="label ink">3</text><text x="655" y="151" class="label ink">6–12 MO</text><text x="620" y="272" class="label ink">QUALIFICATION</text><text x="639" y="311" class="small muted">30–50-piece lot</text><text x="639" y="342" class="small muted">serialised data pack</text><path d="M730 365v47" class="line"/><text x="639" y="453" class="small ink">STOP: liability without NRE</text></g>
    <g><circle cx="1015" cy="202" r="25" fill="#dce6d2" stroke="#54724c" stroke-width="5"/><text x="1015" y="211" text-anchor="middle" class="label ink">4</text><text x="940" y="151" class="label ink">12–24 MO</text><text x="885" y="272" class="label ink">REPEATABILITY</text><text x="923" y="311" class="small muted">second source</text><text x="923" y="342" class="small muted">repeat lot + data</text><path d="M1015 365v47" class="line"/><text x="897" y="453" class="small ink">STOP: no repeat economics</text></g>
    <path d="M80 555h1040" stroke="#81766a" stroke-width="2" stroke-dasharray="2 12"/><text x="80" y="614" class="small muted">Scale follows evidence gates; the factory is an option, not the first milestone.</text>
  </g>
</svg>
