<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Make, buy, and service decision flow</title>
  <desc id="desc">A flow from customer specification to partner-supplied precision components and rented metrology. The company makes a component in-house only after repeat paid demand and a measured supplier bottleneck, while service data remains its product.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#9d4c3f"/></marker></defs>
  <g font-family="Arial,Helvetica,sans-serif" fill="#27231e">
    <text x="53" y="56" font-size="28" font-weight="700" letter-spacing="2">MAKE / BUY / SERVE: OWN THE RISK, NOT EVERYTHING</text><text x="55" y="88" font-size="18" fill="#81766a">Keep acceptance, configuration control, and service data in-house while capability is rented.</text>
    <g stroke="#27231e" stroke-width="4"><rect x="61" y="165" width="260" height="96" rx="16" fill="#e4c9ac"/><rect x="412" y="165" width="300" height="96" rx="16" fill="#c6d9d4"/><rect x="803" y="165" width="322" height="96" rx="16" fill="#a86e58"/><rect x="119" y="424" width="305" height="116" rx="16" fill="#d9c8b1"/><rect x="529" y="424" width="305" height="116" rx="16" fill="#f0e6d7" stroke="#9d4c3f" stroke-width="5"/><rect x="939" y="424" width="186" height="116" rx="16" fill="#8e8578"/></g>
    <g font-size="21" font-weight="700" text-anchor="middle"><text x="191" y="205">customer ICD</text><text x="191" y="234">+ paid NRE</text><text x="562" y="205">partner capability</text><text x="562" y="234">pads / base / metrology</text><text x="964" y="205" fill="#fff">integrate + witness</text><text x="964" y="234" fill="#fff">the acceptance test</text><text x="271" y="466">SHIP MODULE</text><text x="271" y="499">serialised data pack</text><text x="681" y="466" fill="#9d4c3f">MAKE ONLY IF</text><text x="681" y="499" fill="#9d4c3f">repeat demand + bottleneck</text><text x="1032" y="466" fill="#fff">SERVICE</text><text x="1032" y="499" fill="#fff">uptime / spares</text></g>
    <path d="M321 213H412M712 213H803M964 261V424M424 482H529M834 482H939" fill="none" stroke="#9d4c3f" stroke-width="5" marker-end="url(#arrow)"/><path d="M681 424V329C681 300 640 286 605 261" fill="none" stroke="#9d4c3f" stroke-width="4" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
    <text x="593" y="337" font-size="17" fill="#9d4c3f">measured supplier lead-time / yield bottleneck</text><path d="M939 592C725 660 401 660 271 540" fill="none" stroke="#527f78" stroke-width="5" marker-end="url(#arrow)"/><text x="454" y="680" font-size="19" font-weight="700" fill="#527f78">service ledger feeds the next specification</text>
  </g>
</svg>
