<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" role="img"><title>FROM INFRASTRUCTURE TO REVENUE</title><g font-family="Arial, sans-serif"><text x="15" y="36" font-size="27" fill="#9d4c3f">FROM INFRASTRUCTURE TO REVENUE</text><text x="15" y="85" font-size="26" fill="#27231e">Useful observation</text><text x="15" y="121" font-size="23" fill="#665f52">Can the chosen sensor answer the question?</text><path d="M30,131v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="186" font-size="26" fill="#27231e">Permission and operating window</text><text x="15" y="222" font-size="23" fill="#665f52">Can we lawfully and safely reach the site?</text><path d="M30,232v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="287" font-size="26" fill="#27231e">Accepted evidence</text><text x="15" y="323" font-size="23" fill="#665f52">Does the result meet the engineer’s scope?</text><path d="M30,333v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="388" font-size="26" fill="#27231e">Profitable paid work</text><text x="15" y="424" font-size="23" fill="#665f52">Does payment cover the complete job?</text><text x="15" y="489" font-size="21" fill="#665f52">Proposed commercial filter · not a market count</text></g></svg>