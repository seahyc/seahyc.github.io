<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" role="img"><title>THE UNDERWATER CONTROL LOOP</title><g font-family="Arial, sans-serif"><text x="15" y="36" font-size="27" fill="#9d4c3f">THE UNDERWATER CONTROL LOOP</text><text x="15" y="85" font-size="26" fill="#27231e">Surface: plan and locate</text><text x="15" y="121" font-size="23" fill="#665f52">GPS fix + mission bounds + abort rules</text><path d="M30,131v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="186" font-size="26" fill="#27231e">Submerged: sense and decide</text><text x="15" y="222" font-size="23" fill="#665f52">Navigation + local observations + uncertainty</text><path d="M30,232v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="287" font-size="26" fill="#27231e">Sparse acoustic messages</text><text x="15" y="323" font-size="23" fill="#665f52">Status and commands; no broadband assumption</text><path d="M30,333v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="388" font-size="26" fill="#27231e">Return: review and compare</text><text x="15" y="424" font-size="23" fill="#665f52">Recover raw data; qualify accepted coverage</text><text x="15" y="489" font-size="21" fill="#665f52">Conceptual synthesis · NOAA / WHOI / NOC</text></g></svg>