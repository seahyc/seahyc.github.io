<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" role="img"><title>DAMAGE IS NOT ATTRIBUTION</title><g font-family="Arial, sans-serif"><text x="15" y="36" font-size="27" fill="#9d4c3f">DAMAGE IS NOT ATTRIBUTION</text><text x="15" y="85" font-size="26" fill="#27231e">Condition inspection</text><text x="15" y="121" font-size="23" fill="#665f52">What changed along this corridor?</text><path d="M30,131v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="186" font-size="26" fill="#27231e">Protection and monitoring</text><text x="15" y="222" font-size="23" fill="#665f52">Can a harmful event be deterred or noticed?</text><path d="M30,232v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="287" font-size="26" fill="#27231e">Attribution</text><text x="15" y="323" font-size="23" fill="#665f52">Who caused it, and what proves intent?</text><path d="M30,333v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="388" font-size="26" fill="#27231e">Repair readiness</text><text x="15" y="424" font-size="23" fill="#665f52">How will service be restored?</text><text x="15" y="489" font-size="21" fill="#665f52">Conceptual product boundaries · card 01 sources</text></g></svg>