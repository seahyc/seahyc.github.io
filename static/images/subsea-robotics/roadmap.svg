<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" role="img"><title>PROOF BEFORE A PROPRIETARY FLEET</title><g font-family="Arial, sans-serif"><text x="15" y="36" font-size="27" fill="#9d4c3f">PROOF BEFORE A PROPRIETARY FLEET</text><text x="15" y="85" font-size="26" fill="#27231e">Months 0–2: earn access</text><text x="15" y="121" font-size="23" fill="#665f52">Owner + contractor + scope + competing quotes</text><path d="M30,131v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="186" font-size="26" fill="#27231e">Months 2–6: prove accepted savings</text><text x="15" y="222" font-size="23" fill="#665f52">Matched campaigns + all attempts + paid repeat</text><path d="M30,232v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="287" font-size="26" fill="#27231e">Months 6–12: remove one bottleneck</text><text x="15" y="323" font-size="23" fill="#665f52">Fund autonomy only from measured job friction</text><path d="M30,333v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="388" font-size="26" fill="#27231e">Months 12–24: replicate or stop</text><text x="15" y="424" font-size="23" fill="#665f52">Second owner; contribution; rights; recovery</text><text x="15" y="489" font-size="21" fill="#665f52">Proposed gates · not a procurement forecast</text></g></svg>