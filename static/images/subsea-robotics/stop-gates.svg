<svg xmlns="http://www.w3.org/2000/svg" width="600" height="529" viewBox="0 0 600 529" role="img"><title>PRECOMMIT TO THE STOP DECISION</title><g font-family="Arial, sans-serif"><text x="15" y="36" font-size="27" fill="#9d4c3f">PRECOMMIT TO THE STOP DECISION</text><text x="15" y="85" font-size="26" fill="#27231e">Day 45: access and alternatives</text><text x="15" y="121" font-size="23" fill="#665f52">8 interviews / 3 job packs / 2 priced options</text><path d="M30,131v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="186" font-size="26" fill="#27231e">Day 60: agree the envelope</text><text x="15" y="222" font-size="23" fill="#665f52">Coverage, permissions, insurance, recovery</text><path d="M30,232v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="287" font-size="26" fill="#27231e">Days 60–120: matched comparison</text><text x="15" y="323" font-size="23" fill="#665f52">6 campaigns; target ≥20% lower full cost</text><path d="M30,333v28" stroke="#566e5e" stroke-width="2"/><text x="15" y="388" font-size="26" fill="#27231e">Month 6: paid repeat or stop</text><text x="15" y="424" font-size="23" fill="#665f52">2 repeat scopes; collection; feasible break-even</text><text x="15" y="489" font-size="21" fill="#665f52">Founder screening targets · not certification</text></g></svg>