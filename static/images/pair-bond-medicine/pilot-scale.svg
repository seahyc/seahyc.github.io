<svg xmlns="http://www.w3.org/2000/svg" width="600" height="562" viewBox="0 0 600 562" role="img" aria-labelledby="title desc"><title id="title">The pilot contribution and annual cost base</title><desc id="desc">Original scenarios on cards 12 and 13. The pilot contribution is not revenue or funding; bars compare dollar magnitudes, not matched annual cohorts.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="25" fill="#27231e" text-anchor="start">LEARNING VOLUME IS NOT BREAK-EVEN</text><text x="20" y="72" font-size="24" fill="#6e665a" text-anchor="start">Original USD scenarios • 3 Nov 2026</text><text x="20" y="120" font-size="26" fill="#527367" text-anchor="start">100 paid enrolments: contribution</text><rect x="20" y="140" width="23.229" height="30" fill="#527367"/><text x="20" y="205" font-size="25" fill="#527367" text-anchor="start">$12,905 before fixed costs</text><text x="20" y="260" font-size="26" fill="#27231e" text-anchor="start">Assumed annual fixed costs</text><rect x="20" y="280" width="540" height="30" fill="#6e665a"/><text x="20" y="345" font-size="25" fill="#27231e" text-anchor="start">$300,000 per year</text><text x="20" y="386" font-size="23" fill="#6e665a" text-anchor="start">Bars start at $0 • same dollar scale</text><path d="M20,413H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="454" font-size="26" fill="#27231e" text-anchor="start">Base annual break-even: 2,325 enrolments</text><text x="20" y="490" font-size="24" fill="#27231e" text-anchor="start">At $129.05 contribution per enrolment</text><text x="20" y="535" font-size="24" fill="#9d4c3f" text-anchor="start">Drug development is outside this model.</text></g></svg>