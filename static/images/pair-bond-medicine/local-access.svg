<svg xmlns="http://www.w3.org/2000/svg" width="600" height="615" viewBox="0 0 600 615" role="img" aria-labelledby="title desc"><title id="title">Access is specific to jurisdiction and product</title><desc id="desc">Summary of the FDA, TGA, Singapore NDF, CNB and HSA sources cited on card 10; not a compliance clearance.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="26" fill="#27231e" text-anchor="start">LEGAL ACCESS HAS A LOCAL SCOPE</text><path d="M20,52H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="88" font-size="28" fill="#527367" text-anchor="start">United States</text><text x="20" y="126" font-size="24" fill="#27231e" text-anchor="start">Approved injection ≠ compounded nasal drug</text><text x="20" y="158" font-size="24" fill="#27231e" text-anchor="start">503A and 503B have different conditions</text><text x="20" y="190" font-size="24" fill="#27231e" text-anchor="start">No pharmacy or formulation cleared here</text><path d="M20,220H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="256" font-size="28" fill="#527367" text-anchor="start">Australia</text><text x="20" y="294" font-size="24" fill="#27231e" text-anchor="start">Restricted psychiatrist-led access</text><text x="20" y="326" font-size="24" fill="#27231e" text-anchor="start">MDMA: PTSD • psilocybine: TRD</text><text x="20" y="358" font-size="24" fill="#27231e" text-anchor="start">Protocol and product-specific permissions</text><path d="M20,388H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="424" font-size="28" fill="#527367" text-anchor="start">Singapore</text><text x="20" y="462" font-size="24" fill="#27231e" text-anchor="start">Prescription obstetric oxytocin injection</text><text x="20" y="494" font-size="24" fill="#27231e" text-anchor="start">MDMA controlled • separate trial review</text><text x="20" y="526" font-size="24" fill="#27231e" text-anchor="start">Exact exemptions unverified here</text><text x="20" y="588" font-size="25" fill="#9d4c3f" text-anchor="start">No general bonding-drug permission follows.</text></g></svg>