<svg xmlns="http://www.w3.org/2000/svg" width="600" height="454" viewBox="0 0 600 454" role="img" aria-labelledby="title desc"><title id="title">The psychiatric asset package</title><desc id="desc">Conceptual reading of the Lilly and AbbVie transactions described on card 01; not a model of acquisition probability or service valuation.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="26" fill="#27231e" text-anchor="start">WHAT A PSYCHIATRIC BUYER ACQUIRES</text><rect x="20" y="62" width="560" height="89" rx="5" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="96" font-size="27" fill="#527367" text-anchor="start">Defined indication</text><text x="38" y="129" font-size="24" fill="#27231e" text-anchor="start">Depression or social anxiety</text><rect x="20" y="173" width="560" height="89" rx="5" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="207" font-size="27" fill="#527367" text-anchor="start">Human development evidence</text><text x="38" y="240" font-size="24" fill="#27231e" text-anchor="start">Programme-specific clinical progress</text><rect x="20" y="284" width="560" height="89" rx="5" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="318" font-size="27" fill="#527367" text-anchor="start">Transferable asset rights</text><text x="38" y="351" font-size="24" fill="#27231e" text-anchor="start">A drug programme a buyer can own</text><text x="20" y="429" font-size="25" fill="#9d4c3f" text-anchor="start">No demonstrated couples treatment follows.</text></g></svg>