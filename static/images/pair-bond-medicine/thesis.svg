<svg xmlns="http://www.w3.org/2000/svg" width="600" height="438" viewBox="0 0 600 438" role="img" aria-labelledby="title desc"><title id="title">THE CLAIM MUST CROSS EACH BRIDGE</title><desc id="desc">Conceptual chain • no automatic causal transfer</desc><g font-family="Arial,Helvetica,sans-serif"><text x="16" y="33" font-size="27" fill="#27231e" text-anchor="start">THE CLAIM MUST CROSS EACH BRIDGE</text><rect x="16" y="62" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="95" font-size="27" fill="#527367" text-anchor="start">Molecular action</text><text x="34" y="127" font-size="23" fill="#27231e" text-anchor="start">A chemical changes a biological signal</text><path d="M300,150 L300,170" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M294,164 L300,170" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M300,170 L306,164" fill="none" stroke="#6e665a" stroke-width="2"/><rect x="16" y="174" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="207" font-size="27" fill="#527367" text-anchor="start">Useful human change</text><text x="34" y="239" font-size="23" fill="#27231e" text-anchor="start">A defined patient outcome improves</text><path d="M300,262 L300,282" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M294,276 L300,282" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M300,282 L306,276" fill="none" stroke="#6e665a" stroke-width="2"/><rect x="16" y="286" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="319" font-size="27" fill="#527367" text-anchor="start">A relationship freely chosen</text><text x="34" y="351" font-size="23" fill="#27231e" text-anchor="start">Both people benefit beyond the session</text><text x="16" y="422" font-size="21" fill="#9d4c3f" text-anchor="start">Conceptual chain • no automatic causal transfer</text></g></svg>