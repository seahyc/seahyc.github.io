<svg xmlns="http://www.w3.org/2000/svg" width="600" height="482" viewBox="0 0 600 482" role="img" aria-labelledby="title desc"><title id="title">Useful benefit and staying together differ</title><desc id="desc">The single study described on card 11 reports relationship functioning and breakup frequency separately. No effect magnitude reconstructed.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="25" fill="#27231e" text-anchor="start">BETTER FUNCTIONING ≠ FEWER BREAKUPS</text><text x="20" y="75" font-size="25" fill="#6e665a" text-anchor="start">742 low-income couples • six months</text><path d="M20,99H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="143" font-size="28" fill="#527367" text-anchor="start">Relationship functioning</text><text x="20" y="181" font-size="25" fill="#27231e" text-anchor="start">Improved in the randomized study</text><path d="M20,217H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="264" font-size="28" fill="#9d4c3f" text-anchor="start">Breakup frequency</text><text x="20" y="302" font-size="25" fill="#27231e" text-anchor="start">No significant reduction reported</text><path d="M20,340H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="383" font-size="27" fill="#27231e" text-anchor="start">Different endpoints. Both matter.</text><text x="20" y="421" font-size="23" fill="#6e665a" text-anchor="start">Doss et al. • abstract-level evidence</text><text x="20" y="455" font-size="24" fill="#9d4c3f" text-anchor="start">Does not validate the proposed service.</text></g></svg>