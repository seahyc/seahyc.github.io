<svg xmlns="http://www.w3.org/2000/svg" width="600" height="615" viewBox="0 0 600 615" role="img" aria-labelledby="title desc"><title id="title">Compensation, operating surplus and exit proceeds</title><desc id="desc">Original scenarios from card 19; annual operating surplus is not automatically distributed as a dividend. No acquisition multiple is inferred.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="25" fill="#27231e" text-anchor="start">THREE DIFFERENT KINDS OF PROCEEDS</text><path d="M20,51H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="88" font-size="27" fill="#527367" text-anchor="start">Funded compensation</text><text x="20" y="127" font-size="24" fill="#27231e" text-anchor="start">$9,000 quarter draw from the cash cap</text><text x="20" y="160" font-size="24" fill="#27231e" text-anchor="start">Planned pay • not business profit</text><path d="M20,195H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="232" font-size="27" fill="#527367" text-anchor="start">Hypothetical operating surplus</text><text x="20" y="271" font-size="24" fill="#27231e" text-anchor="start">3,000 paid annual enrolments</text><text x="20" y="304" font-size="24" fill="#27231e" text-anchor="start">$387,150 contribution − $300,000 fixed</text><text x="20" y="337" font-size="24" fill="#27231e" text-anchor="start">= $87,150 before tax and other exclusions</text><path d="M20,373H580" stroke="#6e665a" stroke-width="1" fill="none"/><text x="20" y="410" font-size="27" fill="#527367" text-anchor="start">Arbitrary equity-exit illustration</text><text x="20" y="449" font-size="24" fill="#27231e" text-anchor="start">30% × $50 million = $15 million gross</text><text x="20" y="482" font-size="24" fill="#27231e" text-anchor="start">Before preferences, tax and costs</text><text x="20" y="515" font-size="24" fill="#27231e" text-anchor="start">No valuation or probability is asserted</text><text x="20" y="586" font-size="24" fill="#9d4c3f" text-anchor="start">Scenarios • not three comparable returns</text></g></svg>