<svg xmlns="http://www.w3.org/2000/svg" width="600" height="619" viewBox="0 0 600 619" role="img" aria-labelledby="title desc"><title id="title">Which comparison answers which question?</title><desc id="desc">Studies and registry described on card 07. No pooled effect size or cross-trial treatment ranking.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="20" y="34" font-size="25" fill="#27231e" text-anchor="start">SEPARATE THERAPY FROM DRUG EFFECT</text><rect x="20" y="64" width="560" height="149" rx="5" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="98" font-size="27" fill="#527367" text-anchor="start">Conjoint drug pilot</text><text x="38" y="132" font-size="24" fill="#27231e" text-anchor="start">6 couples • uncontrolled</text><text x="38" y="163" font-size="24" fill="#27231e" text-anchor="start">Drug + therapy + attention together</text><text x="38" y="194" font-size="24" fill="#27231e" text-anchor="start">Cannot isolate the added drug effect</text><rect x="20" y="234" width="560" height="149" rx="5" fill="none" stroke="#527367" stroke-width="2"/><text x="38" y="268" font-size="27" fill="#527367" text-anchor="start">Earlier therapy comparison</text><text x="38" y="302" font-size="24" fill="#27231e" text-anchor="start">40 couples • randomized</text><text x="38" y="333" font-size="24" fill="#27231e" text-anchor="start">Conjoint PTSD therapy vs waitlist</text><text x="38" y="364" font-size="24" fill="#27231e" text-anchor="start">Therapy can contribute to improvement</text><rect x="20" y="404" width="560" height="149" rx="5" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="38" y="438" font-size="27" fill="#9d4c3f" text-anchor="start">Registered conjoint comparison</text><text x="38" y="472" font-size="24" fill="#27231e" text-anchor="start">60 individuals planned • open-label</text><text x="38" y="503" font-size="24" fill="#27231e" text-anchor="start">Randomized • no results posted</text><text x="38" y="534" font-size="24" fill="#27231e" text-anchor="start">Planned sample ≠ completed couples</text><text x="20" y="593" font-size="23" fill="#6e665a" text-anchor="start">Design map • research cutoff: 3 Nov 2026</text></g></svg>