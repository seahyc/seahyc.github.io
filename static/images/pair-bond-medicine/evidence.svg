<svg xmlns="http://www.w3.org/2000/svg" width="600" height="438" viewBox="0 0 600 438" role="img" aria-labelledby="title desc"><title id="title">MDMA: KEEP THE ENDPOINT ATTACHED</title><desc id="desc">PTSD symptom improvement ≠ divorce prevention</desc><g font-family="Arial,Helvetica,sans-serif"><text x="16" y="33" font-size="27" fill="#27231e" text-anchor="start">MDMA: KEEP THE ENDPOINT ATTACHED</text><rect x="16" y="62" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="95" font-size="27" fill="#527367" text-anchor="start">Controlled PTSD evidence</text><text x="34" y="127" font-size="23" fill="#27231e" text-anchor="start">MAPP2 • 104 participants • 2023</text><path d="M300,150 L300,170" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M294,164 L300,170" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M300,170 L306,164" fill="none" stroke="#6e665a" stroke-width="2"/><rect x="16" y="174" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="207" font-size="27" fill="#527367" text-anchor="start">Conjoint pilot evidence</text><text x="34" y="239" font-size="23" fill="#27231e" text-anchor="start">6 couples • uncontrolled • 2020</text><path d="M300,262 L300,282" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M294,276 L300,282" fill="none" stroke="#6e665a" stroke-width="2"/><path d="M300,282 L306,276" fill="none" stroke="#6e665a" stroke-width="2"/><rect x="16" y="286" width="568" height="88" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="34" y="319" font-size="27" fill="#527367" text-anchor="start">Incremental couple benefit?</text><text x="34" y="351" font-size="23" fill="#27231e" text-anchor="start">Active randomized study • no results posted</text><text x="16" y="422" font-size="21" fill="#9d4c3f" text-anchor="start">PTSD symptom improvement ≠ divorce prevention</text></g></svg>