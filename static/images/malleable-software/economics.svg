<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title"><title id="title">Illustrative contribution at two six and sixteen recurring support hours</title><text x="20" y="35" font-family="Georgia,serif" font-size="29" fill="#27231e" text-anchor="start">Support hours decide the margin</text><text x="20" y="69" font-family="Georgia,serif" font-size="23" fill="#81766a" text-anchor="start">Scenario: $1,500 revenue / customer / month</text><text x="20" y="110" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">2 support hours → $1,200 contribution</text><rect x="20" y="122" width="440.0" height="18" fill="#527367"/><text x="480" y="139" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">80%</text><text x="20" y="205" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">6 support hours → $900 contribution</text><rect x="20" y="217" width="330.0" height="18" fill="#527367"/><text x="480" y="234" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">60%</text><text x="20" y="300" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">16 support hours → $150 contribution</text><rect x="20" y="312" width="55.0" height="18" fill="#9d4c3f"/><text x="480" y="329" font-family="Georgia,serif" font-size="25" fill="#27231e" text-anchor="start">10%</text><text x="20" y="415" font-family="Georgia,serif" font-size="22" fill="#81766a" text-anchor="start">Assumed: $150 infra + $75 / support hour</text><text x="20" y="447" font-family="Georgia,serif" font-size="22" fill="#81766a" text-anchor="start">Before acquisition, R&amp;D and central overhead</text></svg>