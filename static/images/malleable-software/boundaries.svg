<svg xmlns="http://www.w3.org/2000/svg" width="600" height="390" viewBox="0 0 600 390" role="img" aria-labelledby="title"><title id="title">Three separate boundaries for employee-built software</title><rect x="25" y="10" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="42" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">1. Generated app is untrusted</text><text x="45" y="72" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Isolated runtime; no raw secrets</text><path d="M300 98 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="131" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="163" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">2. Trusted host checks each action</text><text x="45" y="193" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Person + record + operation + approval</text><path d="M300 219 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="252" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="284" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">3. Business system stays authoritative</text><text x="45" y="314" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Read approved data; stage bounded writes</text><text x="300" y="370" font-family="Georgia,serif" font-size="22" fill="#9d4c3f" text-anchor="middle">Browser outputs and logs need controls too</text></svg>