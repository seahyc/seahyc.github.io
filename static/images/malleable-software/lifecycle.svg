<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title"><title id="title">A maintained release loop includes business checks and recovery</title><rect x="25" y="10" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="42" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Describe a change + examples</text><text x="45" y="72" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Keep the previous working version</text><path d="M300 98 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="131" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="163" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Preview against safe test records</text><text x="45" y="193" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Check permissions AND business rules</text><path d="M300 219 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="252" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="284" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Approve a version; watch its behavior</text><text x="45" y="314" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">On drift: freeze writes, investigate, repair</text><text x="300" y="380" font-family="Georgia,serif" font-size="24" fill="#9d4c3f" text-anchor="middle">Rollback code ≠ undo external side effects</text></svg>