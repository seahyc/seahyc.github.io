<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title"><title id="title">An employee changes a tool inside a maintained company environment</title><rect x="25" y="12" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="44" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Operator: “change this workflow”</text><text x="45" y="74" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Describe → preview → revise</text><path d="M300 100 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="133" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="165" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Company: approved operating space</text><text x="45" y="195" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Identity · data scope · version history</text><path d="M300 221 v24 m-7 -7 l7 7 7 -7" fill="none" stroke="#81766a" stroke-width="2"/><rect x="25" y="254" width="550" height="82" rx="8" fill="none" stroke="#527367" stroke-width="2"/><text x="45" y="286" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Team: a tool that survives change</text><text x="45" y="316" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Named owner · behavior checks · repair</text><text x="300" y="380" font-family="Georgia,serif" font-size="21" fill="#81766a" text-anchor="middle">Proposed product, not demonstrated demand</text></svg>