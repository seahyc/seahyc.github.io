<svg xmlns="http://www.w3.org/2000/svg" width="600" height="455" viewBox="0 0 600 455" role="img" aria-labelledby="title"><title id="title">Existing alternatives already combine creation, hosting and governance</title><text x="20" y="35" font-family="Georgia,serif" font-size="29" fill="#27231e" text-anchor="start">The competitive bar is already high</text><path d="M20 135 H580" stroke="#81766a" stroke-width="1"/><text x="20" y="88" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Retool</text><text x="20" y="119" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Build elsewhere → governed deployment</text><path d="M20 217 H580" stroke="#81766a" stroke-width="1"/><text x="20" y="170" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Cloudflare OS</text><text x="20" y="201" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Personal apps → resource Gatekeepers</text><path d="M20 299 H580" stroke="#81766a" stroke-width="1"/><text x="20" y="252" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Power Platform / AppSheet</text><text x="20" y="283" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">Low-code + administration + lifecycle</text><path d="M20 381 H580" stroke="#81766a" stroke-width="1"/><text x="20" y="334" font-family="Georgia,serif" font-size="27" fill="#527367" text-anchor="start">Replit / Lovable / Airtable</text><text x="20" y="365" font-family="Georgia,serif" font-size="22" fill="#27231e" text-anchor="start">AI creation + managed platform controls</text><text x="20" y="435" font-family="Georgia,serif" font-size="22" fill="#9d4c3f" text-anchor="start">Documented / advertised; not hands-on tested</text></svg>