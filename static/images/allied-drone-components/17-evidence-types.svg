<svg xmlns="http://www.w3.org/2000/svg" width="600" height="591" viewBox="0 0 600 591" role="img" aria-labelledby="title desc"><title id="title">Evidence types and missing private validation</title><desc id="desc">Evidence taxonomy for the Fieldbook, cross-checked against evidence-ledger.md and report section 17 as of 3 November 2026. Primary published facts establish what official documents say. Vendor claims establish published offers and claims, not audited provenance, inventory, fulfillment, or comparative value. The proposed ESC wedge is an inference; buyer demand and achievable price remain hypotheses. Financial inputs are invented scenarios. Private evidence remains missing: no interviews, quotations, paid engineering, hardware tests, or regulatory submissions have occurred. Sources: evidence-ledger.md entries E01-E26 and allied-drone-components/index.md section 17.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="41" font-size="25" fill="#9d4c3f" text-anchor="start" font-weight="700">WHAT KIND OF EVIDENCE IS THIS?</text><rect x="24" y="66" width="552" height="74" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="42" y="96" font-size="23" fill="#566e5e" text-anchor="start" font-weight="700">PRIMARY · published</text><text x="42" y="127" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Policy, regulator, official programme facts</text><rect x="24" y="155" width="552" height="74" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="42" y="185" font-size="23" fill="#665f52" text-anchor="start" font-weight="700">VENDOR · published claim</text><text x="42" y="216" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Offer / rating / origin claim; not audited</text><rect x="24" y="244" width="552" height="74" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="42" y="274" font-size="23" fill="#9d4c3f" text-anchor="start" font-weight="700">INFERRED · proposed wedge</text><text x="42" y="305" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">ESC choice; buyer value not established</text><rect x="24" y="333" width="552" height="74" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="42" y="363" font-size="23" fill="#9d4c3f" text-anchor="start" font-weight="700">INVENTED · scenario</text><text x="42" y="394" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">All financial inputs; no forecast</text><rect x="24" y="422" width="552" height="74" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="42" y="452" font-size="23" fill="#27231e" text-anchor="start" font-weight="700">MISSING · private evidence</text><text x="42" y="483" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Quotes · interviews · tests · paid NRE</text><text x="24" y="533" font-size="22" fill="#9d4c3f" text-anchor="start" font-weight="700">No interviews, quotes, hardware tests or submissions</text><text x="24" y="573" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Sources: evidence-ledger.md · snapshot 3 Nov 2026</text></g></svg>
