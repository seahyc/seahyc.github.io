<svg xmlns="http://www.w3.org/2000/svg" width="600" height="588" viewBox="0 0 600 588" role="img" aria-labelledby="title desc"><title id="title">Official aircraft orders and acceptances do not establish ESC sales</title><desc id="desc">Official Gauntlet I leaderboard snapshot displayed as current on 2 November 2026: 30,000 aircraft ordered, of which 23,840 accepted. The chart deliberately shows zero evidenced ESC revenue: the aircraft denominator does not establish ESC attach rate, component eligibility, procurement route, or startup sales. It is not a claim of zero total market revenue. Source: official leaderboard https://dronedominance.mil/leaderboard.html; evidence ledger E24, captured 3 November 2026. Original order rows and bonus fulfillment have distinct status; do not interpret as audited payment ledger.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="24" fill="#9d4c3f" text-anchor="start" font-weight="700">AIRCRAFT SNAPSHOT ≠ COMPONENT REVENUE</text><text x="24" y="82" font-size="23" fill="#665f52" text-anchor="start" font-weight="400">Official leaderboard snapshot · 2 Nov 2026</text><text x="24" y="139" font-size="35" fill="#27231e" text-anchor="start" font-weight="700">30,000</text><text x="24" y="172" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">ordered aircraft</text><rect x="24" y="188" width="552" height="24" rx="8" fill="#ddd5c8" stroke="#e9e1d3" stroke-width="2"/><rect x="24" y="188" width="552" height="24" rx="4" fill="#566e5e" stroke="#566e5e" stroke-width="2"/><text x="24" y="260" font-size="35" fill="#27231e" text-anchor="start" font-weight="700">23,840</text><text x="24" y="293" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">accepted aircraft</text><rect x="24" y="309" width="552" height="24" rx="8" fill="#ddd5c8" stroke="#e9e1d3" stroke-width="2"/><rect x="24" y="309" width="438.272" height="24" rx="4" fill="#566e5e" stroke="#566e5e" stroke-width="2"/><text x="24" y="365" font-size="24" fill="#566e5e" text-anchor="start" font-weight="700">Both bars count aircraft only</text><rect x="24" y="393" width="552" height="95" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="44" y="431" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">ESC revenue attributable from this snapshot</text><text x="300" y="477" font-size="22" fill="#9d4c3f" text-anchor="middle" font-weight="700">$0 evidenced</text><text x="24" y="531" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">No ESC attach rate, eligibility or startup sales inferred.</text><text x="24" y="570" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Source: dronedominance.mil leaderboard · E24</text></g></svg>
