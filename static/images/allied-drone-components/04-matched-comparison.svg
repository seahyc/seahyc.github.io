<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" role="img" aria-labelledby="title desc"><title id="title">Scorpion and APD published conditions are not matched</title><desc id="desc">Scorpion publishes a 220 A rating conditional on 60 seconds and 35 m/s airflow, and a $499.99 list price with currency unresolved in this research. APD&#x27;s UHV guide specifies full throttle for 180 seconds at 10 m/s airflow. Conditions and documentation are not matched; this is not comparative proof of achieved performance. Sources: Scorpion Tribunus III product page https://www.scorpionsystem.com/catalog/speed_controllers/tribunus_esc/hv_tribunusIII_series/III_14_220/ and APD UHV documentation https://docs.powerdrives.net/products/uhv; ledger vendor records.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="36" font-size="24" fill="#9d4c3f" text-anchor="start" font-weight="700">PUBLISHED RATINGS</text><text x="24" y="66" font-size="24" fill="#9d4c3f" text-anchor="start" font-weight="700">DIFFERENT TEST WINDOWS</text><rect x="24" y="80" width="552" height="165" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="44" y="101" font-size="26" fill="#27231e" text-anchor="start" font-weight="700">SCORPION · Tribunus III</text><text x="44" y="143" font-size="27" fill="#566e5e" text-anchor="start" font-weight="400">220 A · 60 seconds</text><text x="44" y="181" font-size="25" fill="#27231e" text-anchor="start" font-weight="400">35 m/s airflow</text><text x="44" y="222" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">$499.99 listed · currency unresolved</text><rect x="24" y="260" width="552" height="180" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="44" y="296" font-size="26" fill="#27231e" text-anchor="start" font-weight="700">APD · UHV guide</text><text x="44" y="338" font-size="25" fill="#566e5e" text-anchor="start" font-weight="400">Full throttle · 180 seconds</text><text x="44" y="376" font-size="25" fill="#27231e" text-anchor="start" font-weight="400">10 m/s airflow</text><text x="44" y="417" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Different vendor-published condition</text><path d="M300,245 L300,260" fill="none" stroke="#9d4c3f" stroke-width="3" stroke-dasharray=""/><text x="24" y="483" font-size="27" fill="#9d4c3f" text-anchor="start" font-weight="700">Not a matched comparison</text><text x="24" y="522" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">Vendor claims · no independent equivalence shown</text><text x="24" y="559" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Sources: Scorpion product page; APD UHV guide</text></g></svg>
