<svg xmlns="http://www.w3.org/2000/svg" width="600" height="867" viewBox="0 0 600 867" role="img" aria-labelledby="title desc"><title id="title">Sensing, judgement and authorized effect</title><desc id="desc">Conceptual chain: detect, track, identify, decide, defeat. Detection-site buyers and authorized mitigation integrators are distinct. No range, accuracy or success-rate claims. Sources: FAA airport UAS guidance, FBI April 2026 testimony and ACMA guidance, ledger E18–E20.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="29" fill="#9d4c3f" text-anchor="start">COUNTER-DRONE IS A CHAIN</text><rect x="24" y="75" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="110" font-size="28" fill="#27231e" text-anchor="middle">Detect</text><text x="300" y="145" font-size="23" fill="#665f52" text-anchor="middle">Observe a possible aircraft</text><path d="M300,168 L300,192" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,185 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="197" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="232" font-size="28" fill="#27231e" text-anchor="middle">Track</text><text x="300" y="267" font-size="23" fill="#665f52" text-anchor="middle">Associate observations over time</text><path d="M300,290 L300,314" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,307 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="319" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="354" font-size="28" fill="#27231e" text-anchor="middle">Identify</text><text x="300" y="389" font-size="23" fill="#665f52" text-anchor="middle">Assess what the object could be</text><path d="M300,412 L300,436" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,429 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="441" width="552" height="92" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="300" y="476" font-size="28" fill="#27231e" text-anchor="middle">Decide</text><text x="300" y="511" font-size="23" fill="#665f52" text-anchor="middle">Apply lawful authority and judgement</text><path d="M300,534 L300,558" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,551 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="563" width="552" height="92" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="300" y="598" font-size="28" fill="#27231e" text-anchor="middle">Defeat</text><text x="300" y="633" font-size="23" fill="#665f52" text-anchor="middle">Only an authorized actor may act</text><text x="24" y="721" font-size="24" fill="#9d4c3f" text-anchor="start">Detection does not establish hostile intent.</text><text x="24" y="762" font-size="23" fill="#27231e" text-anchor="start">Sensing itself can have legal constraints.</text><text x="24" y="805" font-size="22" fill="#665f52" text-anchor="start">Conceptual workflow · 3 Nov 2026</text><text x="24" y="839" font-size="22" fill="#665f52" text-anchor="start">Sources: FAA guidance; FBI testimony; E18–E20</text></g></svg>
