<svg xmlns="http://www.w3.org/2000/svg" width="600" height="736" viewBox="0 0 600 736" role="img" aria-labelledby="title desc"><title id="title">Power conversion and the ESC boundary</title><desc id="desc">Conceptual engineering synthesis, not a tested design. Battery energy is switched by the ESC into motor currents, shaft work and propeller thrust. Heat, cooling and duty cycle constrain useful continuous operation. Source: research-map.md and ledger E09–E12, 3 November 2026.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="27" fill="#9d4c3f" text-anchor="start">WHERE ELECTRICITY BECOMES THRUST</text><rect x="24" y="74" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="109" font-size="28" fill="#27231e" text-anchor="middle">Battery</text><text x="300" y="144" font-size="23" fill="#665f52" text-anchor="middle">Stored energy → electrical input</text><path d="M300,167 L300,191" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,184 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="196" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="231" font-size="28" fill="#27231e" text-anchor="middle">Electronic speed controller</text><text x="300" y="266" font-size="23" fill="#665f52" text-anchor="middle">Switches power into timed currents</text><path d="M300,289 L300,313" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,306 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="318" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="353" font-size="28" fill="#27231e" text-anchor="middle">Motor</text><text x="300" y="388" font-size="23" fill="#665f52" text-anchor="middle">Electrical input → shaft work</text><path d="M300,411 L300,435" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,428 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="440" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="475" font-size="28" fill="#27231e" text-anchor="middle">Propeller</text><text x="300" y="510" font-size="23" fill="#665f52" text-anchor="middle">Shaft work → thrust</text><text x="24" y="594" font-size="24" fill="#27231e" text-anchor="start">Heat and losses occur along the chain.</text><text x="24" y="631" font-size="24" fill="#9d4c3f" text-anchor="start">A peak rating is not continuous capability.</text><text x="24" y="674" font-size="22" fill="#665f52" text-anchor="start">Original engineering synthesis · 3 Nov 2026</text><text x="24" y="708" font-size="22" fill="#665f52" text-anchor="start">Conditions to specify: cooling, load, duty cycle.</text></g></svg>
