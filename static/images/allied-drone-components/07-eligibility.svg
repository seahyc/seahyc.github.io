<svg xmlns="http://www.w3.org/2000/svg" width="600" height="582" viewBox="0 0 600 582" role="img" aria-labelledby="title desc"><title id="title">Origin evidence and US authorization are separate determinations</title><desc id="desc">Conceptual distinction based on FCC DA 25-1086 and FCC Covered List FAQ updated 21 July 2026. Production location and item/channel authorization are different questions. The proposed ESC is not expressly named in the non-exhaustive critical-component list; whether it is covered or requires authorization is unresolved. The FAQ also has conflicting exemption dates. This graphic makes no legal determination or eligibility promise. Sources: https://docs.fcc.gov/public/attachments/DA-25-1086A1.pdf and https://www.fcc.gov/covered-list-faqs-uas-and-uas-critical-components; evidence ledger E04-E06.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="25" fill="#9d4c3f" text-anchor="start" font-weight="700">TWO DIFFERENT QUESTIONS</text><rect x="24" y="73" width="250" height="156" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="44" y="111" font-size="27" fill="#27231e" text-anchor="start" font-weight="700">ORIGIN</text><text x="44" y="151" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Where was each</text><text x="44" y="181" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">item produced?</text><text x="44" y="215" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Trace every branch</text><rect x="326" y="73" width="250" height="156" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="346" y="111" font-size="23" fill="#27231e" text-anchor="start" font-weight="700">AUTHORIZATION</text><text x="346" y="151" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Does this item and</text><text x="346" y="181" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">channel need it?</text><text x="346" y="215" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Actual determination</text><path d="M274,151 L326,151" fill="none" stroke="#9d4c3f" stroke-width="3" stroke-dasharray=""/><text x="300" y="279" font-size="25" fill="#9d4c3f" text-anchor="middle" font-weight="700">US FCC</text><text x="24" y="326" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">Foreign-production rules are not a blanket import ban.</text><rect x="24" y="354" width="552" height="85" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="44" y="386" font-size="22" fill="#9d4c3f" text-anchor="start" font-weight="700">Proposed ESC coverage / authorization:</text><text x="44" y="417" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">UNRESOLVED · ESC not expressly named in list</text><text x="24" y="482" font-size="23" fill="#566e5e" text-anchor="start" font-weight="700">Get controlling, item-specific determination first.</text><text x="24" y="523" font-size="23" fill="#9d4c3f" text-anchor="start" font-weight="400">No eligibility or legal outcome promised</text><text x="24" y="562" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Sources: FCC DA 25-1086; FAQ updated 21 Jul 2026</text></g></svg>
