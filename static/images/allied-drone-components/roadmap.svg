<svg xmlns="http://www.w3.org/2000/svg" width="600" height="715" viewBox="0 0 600 715" role="img" aria-labelledby="title desc"><title id="title">A conditional twelve to twenty-four month company plan</title><desc id="desc">Proposed founder plan, not forecast. Compare incumbent quotes and collect paid qualification scope, deliver a buyer-defined lot, earn repeat accepted releases and collected cash, then prove transferability to another buyer. Source: research-map.md, 3 November 2026.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="26" fill="#9d4c3f" text-anchor="start">RENT CAPACITY. EARN THE NEXT RELEASE.</text><rect x="24" y="75" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="110" font-size="28" fill="#27231e" text-anchor="middle">Months 0–3 · paid discovery</text><text x="300" y="145" font-size="23" fill="#665f52" text-anchor="middle">Matched incumbent quotes + paid scope</text><path d="M300,168 L300,192" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,185 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="197" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="232" font-size="28" fill="#27231e" text-anchor="middle">Months 3–6 · qualification lot</text><text x="300" y="267" font-size="23" fill="#665f52" text-anchor="middle">Buyer-defined tests + traceable revision</text><path d="M300,290 L300,314" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,307 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="319" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="354" font-size="28" fill="#27231e" text-anchor="middle">Months 6–12 · repeat releases</text><text x="300" y="389" font-size="23" fill="#665f52" text-anchor="middle">Accepted units + returns + collected cash</text><path d="M300,412 L300,436" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M294,429 l6,7 l6,-7" fill="none" stroke="#665f52" stroke-width="2"/><rect x="24" y="441" width="552" height="92" rx="8" fill="none" stroke="#665f52" stroke-width="2"/><text x="300" y="476" font-size="28" fill="#27231e" text-anchor="middle">Months 12–24 · second buyer</text><text x="300" y="511" font-size="23" fill="#665f52" text-anchor="middle">Reuse the product; fund any new scope</text><text x="24" y="597" font-size="23" fill="#9d4c3f" text-anchor="start">Advance only when the previous gate passes.</text><text x="24" y="642" font-size="23" fill="#27231e" text-anchor="start">Proposed sequence, not procurement timing.</text><text x="24" y="687" font-size="22" fill="#665f52" text-anchor="start">Source: research-map.md · 3 Nov 2026</text></g></svg>
