<svg xmlns="http://www.w3.org/2000/svg" width="600" height="712" viewBox="0 0 600 712" role="img" aria-labelledby="title desc"><title id="title">Annual company contribution in three invented scenarios</title><desc id="desc">Zero-referenced comparison in US dollars per steady year after fixed cost, net customer engineering and tooling depreciation. Low minus 431,000, base plus 43,641, high plus 1,077,440. Inputs are invented planning assumptions; these cases are not statistical bounds or forecasts. Source: scenario-model.json, 3 November 2026.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="26" fill="#9d4c3f" text-anchor="start">DO REPEAT RELEASES PAY THE COMPANY?</text><text x="24" y="80" font-size="24" fill="#27231e" text-anchor="start">USD per steady year · invented scenarios</text><text x="24" y="115" font-size="22" fill="#665f52" text-anchor="start">After fixed costs, NRE and tooling depreciation</text><text x="24" y="170" font-size="27" fill="#27231e" text-anchor="start">Low: -431,000</text><rect x="37.770" y="190" width="142.230" height="34" fill="#9d4c3f"/><text x="24" y="285" font-size="27" fill="#27231e" text-anchor="start">Base: +43,641</text><rect x="180.000" y="305" width="14.402" height="34" fill="#566e5e"/><text x="24" y="400" font-size="27" fill="#27231e" text-anchor="start">High: +1,077,440</text><rect x="180.000" y="420" width="355.555" height="34" fill="#566e5e"/><path d="M180,182 L180,466" fill="none" stroke="#27231e" stroke-width="2" stroke-dasharray=""/><path d="M24,475 L576,475" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><path d="M48.0,475 L48.0,484" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="48.0" y="516" font-size="22" fill="#665f52" text-anchor="middle">−400k</text><path d="M180.0,475 L180.0,484" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="180.0" y="516" font-size="22" fill="#665f52" text-anchor="middle">0</text><path d="M510.0,475 L510.0,484" fill="none" stroke="#665f52" stroke-width="2" stroke-dasharray=""/><text x="510.0" y="516" font-size="22" fill="#665f52" text-anchor="middle">+1m</text><text x="24" y="565" font-size="23" fill="#27231e" text-anchor="start">Each case changes price, volume and costs.</text><text x="24" y="603" font-size="23" fill="#9d4c3f" text-anchor="start">These are outcomes, not confidence bounds.</text><text x="24" y="649" font-size="22" fill="#665f52" text-anchor="start">Source: scenario-model.json · 3 Nov 2026</text><text x="24" y="684" font-size="22" fill="#665f52" text-anchor="start">No quoted prices, measured yields or forecast.</text></g></svg>
