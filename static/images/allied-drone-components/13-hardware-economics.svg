<svg xmlns="http://www.w3.org/2000/svg" width="600" height="586" viewBox="0 0 600 586" role="img" aria-labelledby="title desc"><title id="title">Exact base scenario unit and annual contribution arithmetic</title><desc id="desc">Exact arithmetic from scenario-model.json, as of 3 November 2026. One accepted ESC: unit contribution = price $350 - attempt cost $190 divided by yield 0.92 - acceptance cost $20 - warranty fraction 2.5% times price $350 = $114.7282608696, shown rounded to $114.73. At 5,000 accepted units this is $573,641.304; net NRE is 3 projects times ($75,000 fee - $65,000 cost) = $30,000. Annual fixed expense $500,000 plus tooling depreciation $60,000 equals $560,000. Annual contribution after depreciation = $43,641.304. Without NRE: $13,641.304. All inputs are invented scenario assumptions, not estimates, supplier quotes, market prices, or forecasts. Source: research-dossiers/2026-11-03-allied-drone-components/scenario-model.json.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="40" font-size="25" fill="#9d4c3f" text-anchor="start" font-weight="700">BASE CASE · ONE ACCEPTED ESC</text><text x="24" y="80" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Invented steady-year planning assumptions · USD</text><rect x="24" y="100" width="552" height="75" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="44" y="132" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">Price − attempt cost / yield − acceptance</text><text x="44" y="163" font-size="22" fill="#27231e" text-anchor="start" font-weight="400">− warranty reserve = unit contribution</text><text x="556" y="202" font-size="22" fill="#27231e" text-anchor="end" font-weight="400">$350 − $190/0.92 − $20 − 2.5%×$350</text><text x="556" y="238" font-size="22" fill="#566e5e" text-anchor="end" font-weight="700">= $114.7283 → $114.73 / accepted unit</text><path d="M44,258 L556,258" fill="none" stroke="#9d4c3f" stroke-width="3" stroke-dasharray=""/><text x="44" y="296" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">5,000 accepted × $114.7283</text><text x="556" y="296" font-size="23" fill="#27231e" text-anchor="end" font-weight="400">$573,641</text><text x="44" y="335" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">+ net NRE: 3 × ($75k − $65k)</text><text x="556" y="335" font-size="23" fill="#566e5e" text-anchor="end" font-weight="400">+$30,000</text><text x="44" y="374" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">− fixed $500k − depreciation $60k</text><text x="556" y="374" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="400">−$560,000</text><rect x="24" y="397" width="552" height="55" rx="8" fill="none" stroke="#9d4c3f" stroke-width="2"/><text x="44" y="433" font-size="22" fill="#27231e" text-anchor="start" font-weight="700">Annual contribution after depreciation</text><text x="556" y="433" font-size="23" fill="#566e5e" text-anchor="end" font-weight="700">+$43,641</text><text x="24" y="490" font-size="22" fill="#9d4c3f" text-anchor="start" font-weight="400">Without NRE: +$13,641 · not a forecast</text><text x="24" y="531" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Inputs all invented · base case · 3 Nov 2026</text><text x="24" y="568" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">Source: scenario-model.json · annual, not first-year cash</text></g></svg>
