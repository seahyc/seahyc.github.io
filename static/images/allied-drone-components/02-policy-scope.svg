<svg xmlns="http://www.w3.org/2000/svg" width="600" height="566" viewBox="0 0 600 566" role="img" aria-labelledby="title desc"><title id="title">China motor criteria and linked ESC definition</title><desc id="desc">Diagram of MOFCOM Announcement 49 clauses 9A901.a-b, issued 19 October 2026 and effective 18 November 2026. The motor criteria are conjunctive and include stated drone-propeller design purpose. The linked ESC definition has voltage and power thresholds and design linkage, without separate density or speed thresholds. The announcement requires export permission and names no destination ban. Source: MOFCOM Announcement 49, https://www.mofcom.gov.cn/zcfb/zc/art/2026/art_b2fa4e60bcd24bdf8c658e476b808785.html; evidence ledger E01.</desc><g font-family="Arial,Helvetica,sans-serif"><text x="24" y="39" font-size="24" fill="#9d4c3f" text-anchor="start" font-weight="700">MOTOR CONTROL · ALL CONDITIONS APPLY</text><text x="24" y="81" font-size="27" fill="#27231e" text-anchor="start" font-weight="700">9A901.a · motor</text><rect x="24" y="103" width="552" height="40" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="40" y="130" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Rated voltage</text><text x="556" y="130" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="700">≥ 48 V</text><rect x="24" y="151" width="552" height="40" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="40" y="178" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Rated power</text><text x="556" y="178" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="700">≥ 3 kW</text><rect x="24" y="199" width="552" height="40" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="40" y="226" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Power density</text><text x="556" y="226" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="700">≥ 3 kW/kg</text><rect x="24" y="247" width="552" height="40" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="40" y="274" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Rated speed</text><text x="556" y="274" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="700">≤ 3,000 rpm</text><rect x="24" y="295" width="552" height="40" rx="8" fill="#f4efe6" stroke="#e9e1d3" stroke-width="2"/><text x="40" y="322" font-size="23" fill="#27231e" text-anchor="start" font-weight="400">Design purpose</text><text x="556" y="322" font-size="23" fill="#9d4c3f" text-anchor="end" font-weight="700">stated drone-propeller use</text><text x="300" y="363" font-size="24" fill="#9d4c3f" text-anchor="middle" font-weight="700">AND</text><rect x="24" y="379" width="552" height="86" rx="8" fill="#f4efe6" stroke="#9d4c3f" stroke-width="2"/><text x="40" y="410" font-size="25" fill="#27231e" text-anchor="start" font-weight="700">9A901.b · linked ESC</text><text x="40" y="442" font-size="22" fill="#665f52" text-anchor="start" font-weight="400">≥48 V + ≥3 kW + designed for 9A901.a motors</text><text x="24" y="505" font-size="23" fill="#566e5e" text-anchor="start" font-weight="400">No separate density or speed test for ESC</text><text x="24" y="544" font-size="22" fill="#9d4c3f" text-anchor="start" font-weight="400">Export permission required · no destination ban named</text></g></svg>
