<style>
:root{--clay1:#f0dcbc;--clay2:#cfa77d;--clayEdge:#94704c;--ink:#4a3322;--ink2:#7a5a40;--glow:rgba(0,0,0,0)}

html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#1d2029;color:var(--ink);

.modal.show{display:flex}
.card{padding:26px 30px 22px;max-width:min(560px,calc(100vw - 32px));border-radius:30px;text-align:center}
.card h2{margin:0 0 8px;font-size:25px;font-weight:900}
.card p{margin:6px 0;font-weight:700;color:var(--ink2);line-height:1.45}
.card .stars{font-size:38px;letter-spacing:8px;color:#f5c542;text-shadow:0 2px 0 #a8761a}
.card .row{display:flex;gap:12px;justify-content:center;margin-top:16px}
.btn{border:none;font:inherit;color:var(--ink);font-weight:800;font-size:15px;padding:11px 22px;cursor:pointer}
.btn:active{transform:translateY(3px)}
#stagePick{position:fixed;z-index:6;opacity:0;font-size:16px;cursor:pointer;border:0}
#safe{position:fixed;inset:0;pointer-events:none;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

</head>

function genQueue(st) {
  const types = Object.keys(st.weights), tot = types.reduce((a, t) => a + st.weights[t], 0);
  const q = []; let theras = 0;
  for (let i = 0; i < st.target; i++) {
    let t;
    for (let tries = 0; tries < 20; tries++) {
      let r = Math.random() * tot; t = types[0];
      for (const ty of types) { r -= st.weights[ty]; if (r <= 0) { t = ty; break; } }
      if (t === 'thera' && theras >= 2) continue;
      if (i < 2 && (t === 'bhikkhuni' || t === 'thera') && !(st.intro[t] === i)) continue;
      break;
    }
    if (t === 'thera') theras++;
    q.push(t);
  }
  for (const [t, idx] of Object.entries(st.intro)) if (idx < q.length && t !== 'bhikkhu') { if (q[idx] === 'thera' && t !== 'thera') continue; q[idx] = t; }
  return q;

function buildTiles(idx) {
  tiles = new Map();
  const N = Math.ceil(RW / TS);
  for (let c = -N; c <= N; c++) for (let r = -N; r <= N; r++) if (insideR(c * TS, r * TS, RW - 16)) tiles.set(K(c, r), { c, r, blk: null });
  let gr = 0; while (tiles.has(K(0, gr + 1))) gr++;
  GATE = { c: 0, r: gr };
  dividers = (DIVT[idx] || []).map(([c1, r1, c2, r2]) => {
    const n = Math.max(Math.abs(c2 - c1), Math.abs(r2 - r1));
    for (let i = 0; i <= n; i++) { const t = tiles.get(K(c1 + Math.sign(c2 - c1) * i, r1 + Math.sign(r2 - r1) * i)); if (t) t.blk = 'div'; }
    const ex = Math.sign(c2 - c1) * TS * .42, ey = Math.sign(r2 - r1) * TS * .42;
    return { x1: c1 * TS - ex, y1: r1 * TS - ey, x2: c2 * TS + ex, y2: r2 * TS + ey };
  });
  rocks = ST.rocks.map(([x, y]) => { const c = Math.round(x / TS), r = Math.round(y / TS), t = tiles.get(K(c, r)); if (t) t.blk = 'rock'; return { x: c * TS, y: r * TS, r: 21 }; });
  incense = [];
  for (const a of ST.incense) {
    const [x, y] = shapePt(a, 298), c0 = Math.round(x / TS), r0 = Math.round(y / TS);
    const cs = c0 - (Math.sign(c0) || -1), rs = r0 - (Math.sign(r0) || -1);
    const zone = [];
    for (const [c, r] of [[c0, r0], [cs, r0], [c0, rs], [cs, rs]]) { const t = tiles.get(K(c, r)); if (t && !t.blk) { t.blk = 'inc'; zone.push([c, r]); } }
    if (zone.length) incense.push(zone);
  }

/* ---------------- Directing arrivals ---------------- */
function command(e, c, r, dir, auto) {

function autoArrive() {

/* ---------------- One beat of caṅkama ---------------- */
function stepBeat() {

/* ---------------- Frame update ---------------- */
function update(dt) {
  T += dt;
  updateParticles(dt);
  for (const f of footprints) f.t += dt;
  const fpLife = ST.spirit ? 6 : ST.trails ? 4 : 2.6;
  while (footprints.length && footprints[0].t > fpLife) footprints.shift();
  for (const ef of effects) ef.t += dt;
  effects = effects.filter(ef => ef.t < 1.6);
  updatePetals(dt);
  ambienceTick(dt);
  G.titleT += dt;
  const scoring = G.phase === 'placing' || G.phase === 'check';
  if (scoring) {
    G.elapsed += dt;
    if (G.phase === 'placing' && G.line.length) {
      G.arrT -= dt;
      if (G.arrT <= 0) { G.arrT = cadence(); sel = null; if (!G.waiting) { if (G.ready) autoArrive(); G.ready = true; } }
    }
  }
  if (G.phase !== 'lost') { G.beatT += dt; while (G.beatT >= BEAT) { G.beatT -= BEAT; stepBeat(); } }
  const p = ease(clamp(G.beatT / (BEAT * .8), 0, 1));
  for (const e of G.ents) {
    e.age += dt; e.landT += dt; if (e.bubbleT > 0) e.bubbleT -= dt;
    e.x = lerp(e.px, e.wx, e.moved ? p : 1); e.y = lerp(e.py, e.wy, e.moved ? p : 1);
    e.h = dirA(e.pdir) + angDiff(dirA(e.dir), dirA(e.pdir)) * p;
  }
  const lineAll = (G.waiting ? [G.waiting] : []).concat(G.line);
  lineAll.forEach((e, n) => { const [sx, sy] = slotPos(n), k = 1 - Math.exp(-dt * 4); e.x += (sx - e.x) * k; e.y += (sy - e.y) * k; e.h = Math.PI / 2; });
  if (ST.fadeStill) {
    const ht = hoverTile();
    for (const e of G.ents) {
      const still = e.state === 'still' || e.pause > 0;
      let near = false;
      if (still) {
        for (const o of G.ents) if (o !== e && o.state === 'walk' && o.pause === 0 && cheb(o, e) <= 2) { near = true; break; }
        if (ht && Math.abs(ht.c - e.c) <= 2 && Math.abs(ht.r - e.r) <= 2) near = true;
      }
      e.fade = lerp(e.fade, still && !near && e.age > 2 ? .1 : 1, 1 - Math.exp(-dt * 1.6));
    }

  if (ST.trails) paintTrails();
  hum(G.viol.size > 0 && scoring);
  if (G.phase === 'won') { G.wonT += dt; if (G.wonT > 2.6 && !G.endShown) showEnd(true); }
}

const starsFor = (st, m) => 1 + (m >= STAR_MERIT[st][0]) + (m >= STAR_MERIT[st][1]);

function showEnd(won) {

    $('endBody').innerHTML = `<div class="stars">${'★'.repeat(stars)}<span style="opacity:.25">${'★'.repeat(3 - stars)}</span></div><p>✿ ${G.merit} merit · ${G.petals} / ${MAXP} petals</p>`;

  c.globalCompositeOperation = 'lighter';

/* ---------------- Particles / ambience visuals ---------------- */
function initParticles() {
  parts = [];

const PENTA = [523.3, 587.3, 659.3, 784, 880, 1046.5];

function sTempleBell() {

function sBowlStrike() { const f = 220; [[1, .08, 3.4], [1.008, .06, 3.4], [2.71, .035, 2.4], [5.1, .015, 1.4]].forEach(([r, g, d]) => tone(f * r, d, g, { attack: .02, rev: .6 })); }

function sSpiritChime() { tone(pick([1318.5, 1568, 1760, 2093]), 1.6, .022, { rev: .9 }); }
function sChime() {
  const night = ST.night, base = pick(night ? [1760, 1975.5, 2349.3, 2637] : [1174.7, 1318.5, 1480, 1760, 1975.5]);

function sBird() {

/* ---------------- Input ---------------- */
function setMuteIcon() { }
function evWorld(ev) { const r = cv.getBoundingClientRect(); return toWorld(ev.clientX - r.left, ev.clientY - r.top); }

  audioInit();

  const pl = planState(); if (!pl) return;
  if (!pl.ok) { tone(170, .14, .08, { type: 'triangle', rev: .1 }); return; }

  try { cv.setPointerCapture(ev.pointerId); } catch (e) { }
});
cv.addEventListener('pointermove', ev => {
  const w = evWorld(ev);

    return;

});

  else if (k === 'r') loadStage(G.stage);

/* ---------------- Layout & loop ---------------- */
function layout() {
