name: Verify coding practice
on:
  pull_request:
    paths: ['static/practice/**', 'scripts/*practice*', 'scripts/*mastery*', 'scripts/state.test.mjs', 'scripts/verify-exercises.py', '.github/workflows/practice.yml']
  push:
    branches: [main]
    paths: ['static/practice/**', 'scripts/*practice*', 'scripts/*mastery*', 'scripts/state.test.mjs', 'scripts/verify-exercises.py', '.github/workflows/practice.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: node --test scripts/state.test.mjs scripts/practice-path.test.mjs scripts/mastery.test.mjs
      - run: node --check static/practice/app.mjs && node --check static/practice/runner.mjs && node --check static/practice/path/app.mjs && node --check static/practice/mastery.mjs
      - run: python3 scripts/verify-exercises.py
      - run: python3 scripts/verify-exercises.py --curriculum static/practice/ramp.json
