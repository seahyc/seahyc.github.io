name: Verify coding practice
on:
  pull_request:
    paths: ['content/projects/**', 'scripts/prune-private-projects.mjs', '.github/workflows/hugo.yml', 'static/practice/**', 'scripts/*practice*', 'scripts/*mastery*', 'scripts/*explorer*', 'scripts/state.test.mjs', 'scripts/*.test.mjs', 'scripts/verify-*.py', 'scripts/fixtures/variation-solutions/**', 'projects-src/practice-editor/**', 'package*.json', '.github/workflows/practice.yml']
  push:
    branches: [main]
    paths: ['content/projects/**', 'scripts/prune-private-projects.mjs', '.github/workflows/hugo.yml', 'static/practice/**', 'scripts/*practice*', 'scripts/*mastery*', 'scripts/*explorer*', 'scripts/state.test.mjs', 'scripts/*.test.mjs', 'scripts/verify-*.py', 'scripts/fixtures/variation-solutions/**', 'projects-src/practice-editor/**', 'package*.json', '.github/workflows/practice.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:practice-editor
      - run: node --test scripts/*.test.mjs
      - run: python3 scripts/verify-runner.py
      - run: node --check static/practice/app.mjs && node --check static/practice/runner.mjs && node --check static/practice/path/app.mjs && node --check static/practice/mastery.mjs
      - run: python3 scripts/verify-exercises.py
      - run: python3 scripts/verify-exercises.py --curriculum static/practice/ramp.json
      - run: python3 scripts/verify-exercises.py --curriculum static/practice/variations.json
      - run: python3 scripts/verify-variations.py
      - run: python3 scripts/verify-explorer-examples.py
      - name: Install browser for core experience regression
        run: npx playwright install --with-deps chromium
      - name: Verify input-output exploration in Chromium
        timeout-minutes: 8
        run: node scripts/browser-explorer.mjs
