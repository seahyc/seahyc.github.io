name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.156.0
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install planner build dependencies
        run: npm ci
      - name: Build retirement planner bundle
        run: npm run build:retirement-planning
      - name: Build renovation field notes
        run: npm run build:reno-field-notes
      - name: Verify renovation field-note assets
        run: npm run verify:reno-field-notes
      - name: Typecheck renovation digital twin
        run: npm run typecheck:reno-twin
      - name: Build renovation digital twin
        run: npm run build:reno-twin
      - name: Verify renovation digital twin
        run: npm run verify:reno-twin
      - name: Typecheck renovation weather globe
        run: npm run typecheck:reno-atmosphere
      - name: Build renovation weather globe
        run: npm run build:reno-atmosphere
      - name: Verify renovation weather globe
        run: npm run verify:reno-atmosphere
      - name: Verify renovation private marker API
        run: npm run verify:reno-private-api
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Prune non-runtime planner sources from public
        run: node projects-src/retirement-planning/prune-public.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # deploy-pages v5 currently inherits DEP0040 from @actions/artifact.
    # Suppress only that upstream warning until actions/deploy-pages#433 lands.
    env:
      NODE_OPTIONS: --disable-warning=DEP0040
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
